  {text: "الصراع، الإحباط، الحرمان، والخبرات الصادمة هي من الأسباب:", options: ["البيئية.", "الفسيولوجية.", "النفسية.", "الاجتماعية."], correct: 2, explanation: "الأسباب النفسية تشمل الصراعات الداخلية، الإحباط، الحرمان، والخبرات الصادمة التي تؤثر على النفسية البشرية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "أساليب التنشئة الوالدية، واضطرابات العلاقات الأسرية، والكوارث الاجتماعية، تُصنف كأسباب:", options: ["نفسية.", "بيئية.", "أصلية (مهيأة).", "عضوية."], correct: 1, explanation: "الأسباب البيئية تشمل أساليب التنشئة الوالدية، اضطرابات العلاقات الأسرية، والكوارث الاجتماعية التي تحيط بالفرد.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "أثبتت دراسة بقايا الإنسان الأول أنه كان يلجأ للتخلص من المرض والألم إلى:", options: ["العقاقير الطبية المتقدمة.", "الطبيعة.", "بناء المستشفيات.", "الكهنة والسحرة."], correct: 1, explanation: "أثبتت دراسات بقايا الإنسان الأول أنه كان يلجأ إلى الطبيعة للتخلص من المرض والألم، مستخدماً الأعشاب والعلاجات الطبيعية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "دلت البرديات المصرية القديمة على وجود ثقوب جراحية بجماجم الفراعنة كان الهدف منها:", options: ["طرد الأرواح الشريرة التي تسبب الجنون أو الصرع.", "علاج الشلل النصفي.", "استئصال الأورام الدماغية.", "تخفيف الضغط الدماغي."], correct: 0, explanation: "البرديات المصرية القديمة أشارت إلى وجود ثقوب جراحية (Trephination) في جماجم الفراعنة بهدف طرد الأرواح الشريرة المسببة للجنون أو الصرع.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "وردت إشارات في شعر وأساطير ........ تشير إلى حدوث نوبات هياج أو جنون تصيب من يُطلق عليهم \"الأبطال\":", options: ["الفراعنة.", "الإغريق.", "المسلمين الأوائل.", "الرومان."], correct: 1, explanation: "في شعر وأساتير الإغريق وردت إشارات إلى نوبات هياج أو جنون تصيب الأبطال، مما يعكس إدراكهم المبكر للاضطرابات النفسية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "أول من شيد المستشفيات الخاصة بالأمراض العقلية هم:", options: ["الفراعنة.", "فلاسفة الإغريق.", "العلماء المسلمون الأوائل (مثل الرازي وابن سينا).", "الأوروبيون في العصور الوسطى."], correct: 2, explanation: "العلماء المسلمون الأوائل مثل الرازي وابن سينا كانوا أول من شيد المستشفيات الخاصة بالأمراض العقلية، وقدموا رعاية إنسانية للمرضى.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "عندما يعجز الفرد عن حل مشكلاته اليومية إخفاقاً يزيد عما يُنتظر منه ويصبح غير قادر على التكيف، فإن هذه الحالة تُسمى:", options: ["العصاب.", "سوء التوافق.", "الذهان الوظيفي.", "الفصام."], correct: 1, explanation: "سوء التوافق هو حالة يعجز فيها الفرد عن حل مشكلاته اليومية إخفاقاً يزيد عما يُنتظر منه عمراً ونضجاً وخبرة وظروفاً، مما يجعله غير قادر على التكيف.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "سوء التوافق المهني، الأسري، الاقتصادي، والديني هي أمثلة على:", options: ["مجالات سوء التوافق.", "أسباب الأمراض الفسيولوجية.", "الحيل الدفاعية السوية.", "الأمراض العضوية."], correct: 0, explanation: "سوء التوافق يظهر في مجالات متعددة من الحياة تشمل الجانب المهني، الأسري، الاجتماعي، الاقتصادي، والديني.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "من مظاهر سوء التوافق البسيطة (مشكلات سلوكية) التي تظهر عند الأطفال:", options: ["الفصام والاكتئاب الذهاني.", "قضم الأظافر، التبول القسري، والنرفزة، والعناد.", "فقدان الذاكرة والهلاوس.", "الشلل والصرع."], correct: 1, explanation: "مظاهر سوء التوافق البسيطة عند الأطفال تشمل قضم الأظافر، التبول القسري، النرفزة، والعناد، وهي مشكلات سلوكية يمكن معالجتها.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يُعد ........ أخطر دروب سوء التوافق، حيث يجعل الفرد غريباً عن نفسه وعن الناس مما يقعده عن العمل ويتطلب عزله:", options: ["الأمراض العقلية.", "التمرد الشديد في المراهقة.", "الميل الشديد للانطواء.", "الاكتئاب العصابي."], correct: 0, explanation: "الأمراض العقلية (الذهان) هي أخطر دروب سوء التوافق، حيث تجعل الفرد غريباً عن نفسه وعن الناس، وينفصل عن الواقع تماماً.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يلجأ الإنسان للحيل الدفاعية غير السوية عندما:", options: ["يكون متوافقاً أسرياً واجتماعياً.", "يعجز عن الاحتفاظ بتوازنه النفسي بالطرق السوية لمواجهة مشكلاته.", "يتمتع بصحة عقلية مثالية.", "يحقق جميع أهدافه."], correct: 1, explanation: "يلجأ الإنسان للحيل الدفاعية غير السوية عندما يعجز عن الاحتفاظ بتوازنه النفسي بالطرق السوية لمواجهة مشكلاته اليومية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المعيار الذي يرى أن السلوك السوي هو السلوك الكامل أو ما يقرب من الكمال هو:", options: ["المعيار المثالي.", "المعيار الإحصائي.", "المعيار السيكولوجي.", "المعيار الثقافي الاجتماعي."], correct: 0, explanation: "المعيار المثالي يرى أن السلوك السوي هو السلوك الكامل أو ما يقرب من الكمال، وهو المعيار الذي تبنته مدرسة التحليل النفسي بقيادة فرويد.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المدرسة النفسية التي تهتم بـ \"المعيار المثالي\" في السواء والشذوذ هي مدرسة:", options: ["السلوكية.", "التحليل النفسي.", "المعرفية.", "الجشطلت."], correct: 1, explanation: "مدرسة التحليل النفسي هي التي تهتم بالمعيار المثالي في تحديد السواء والشذوذ، حيث ترى أن الشخص السوي هو من خالص من الصراعات النفسية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المعيار الذي يعتبر الشخصية السوية هي التي لا تنحرف عن \"المتوسط\" حيث توجد غالبية الأفراد هو:", options: ["المعيار المثالي.", "المعيار الثقافي الاجتماعي.", "المعيار الإحصائي.", "المعيار السيكولوجي."], correct: 2, explanation: "المعيار الإحصائي يعتبر الشخصية السوية هي التي لا تنحرف عن المتوسط الحسابي حيث توجد غالبية الأفراد في المجتمع.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يُعد الانتحار دليلاً على الاضطراب النفسي في الثقافة الغربية، بينما يُعد ظاهرة سوية في اليابان؛ هذا يمثل المعيار:", options: ["المثالي.", "الثقافي الاجتماعي.", "السيكولوجي.", "الإحصائي."], correct: 1, explanation: "المعيار الثقافي الاجتماعي يختلف من مجتمع لآخر في تحديد السواء والشذوذ، فالانتحار مثلاً يُعتبر مريضاً في الغرب وسلوكاً مقبولاً في بعض ثقافات اليابان.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المعيار الذي يرى أن الشخصية غير السوية هي التي لديها صراعات نفسية لا شعورية أو تلفاً في الجهاز العصبي هو:", options: ["المعيار السيكولوجي.", "المعيار الإحصائي.", "المعيار المثالي.", "المعيار الثقافي الاجتماعي."], correct: 0, explanation: "المعيار السيكولوجي يرى أن الشخصية غير السوية هي التي لديها صراعات نفسية لا شعورية أو تلفاً عضوياً في الجهاز العصبي.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "من أهم مميزات المعيار السيكولوجي لتحديد السوية والشذوذ أنه:", options: ["يعتمد على المتوسط الحسابي.", "يمكن تطبيقه في أي مجتمع بغض النظر عن ثقافته.", "يهتم بالسلوك الكامل الخالي من العيوب فقط.", "يختلف من ثقافة لأخرى."], correct: 1, explanation: "من أهم مميزات المعيار السيكولوجي أنه يمكن تطبيقه في أي مجتمع بغض النظر عن ثقافته، لأنه يعتمد على وجود صراعات نفسية لا شعورية أو تلف عضوي.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "ينعزل المريض كلياً عن المجتمع ويخلق لنفسه عالماً خاصاً به وتنقطع صلته بالواقع ولا يؤدي أي دور في حالة:", options: ["القلق العصابي.", "الفصام.", "التبول القسري.", "الاكتئاب العصابي."], correct: 1, explanation: "في حالة الفصام (الذهان) ينعزل المريض كلياً عن المجتمع ويخلق لنفسه عالماً خاصاً به، وتنقطع صلته بالواقع تماماً.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المشكلة الأساسية لمريض الفصام والذهان بصفة عامة هي مشكلة:", options: ["توافق.", "وجود.", "تكيف دراسي فقط.", "تكيف مهني فقط."], correct: 1, explanation: "المشكلة الأساسية لمريض الفصام والذهان هي مشكلة \"وجود\" حيث ينفصل المريض عن الواقع ويعيش في عالم خاص به.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المشكلة الأساسية لمريض القلق والعصاب بصفة عامة هي مشكلة:", options: ["وجود.", "توافق.", "تلف جيني.", "تلف عضوي."], correct: 1, explanation: "المشكلة الأساسية لمريض القلق والعصاب هي مشكلة \"توافق\" حيث يظل المريض على اتصال بالواقع لكنه يعاني من صعوبات في التكيف.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "قد يحاول المريض ........ الانتحار وينجح إن لم يُعالج لأن مشكلته هي مشكلة وجود:", options: ["باضطراب الهستيريا.", "بالاكتئاب الذهاني.", "باضطراب المخاوف البسيطة.", "بالقلق العصابي."], correct: 1, explanation: "مريض الاكتئاب الذهاني قد يحاول الانتحار وينجح إن لم يُعالج، لأن مشكلته هي مشكلة \"وجود\" ونقص في الإحساس بالحياة.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "بين المريض ........ والحياة \"جدار فولاذي مرتفع عريض\" فلا يرى منها شيئاً ولا يقدر على تجاوزه:", options: ["العصابي.", "الذهاني.", "المتوافق.", "السوي."], correct: 1, explanation: "بين المريض الذهاني والحياة \"جدار فولاذي مرتفع عريض\" فلا يرى منها شيئاً ولا يقدر على تجاوزه، بعكس المريض العصابي الذي يبقى على اتصال بالحياة.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "بين المريض ........ والحياة \"غشاء نفاذ\" يدخل إليها عندما يستطيع وتسمح له الظروف:", options: ["العصابي.", "الذهاني.", "الفصامي.", "المضطرب."], correct: 0, explanation: "بين المريض العصابي والحياة \"غشاء نفاذ\" يدخل إليها عندما يستطيع وتسمح له الظروف، مما يعني أنه يحافظ على اتصال جزئي بالواقع.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "تصنيف الأمراض النفسية إلى \"عصاب\" و\"ذهان\" يُعد من التصنيفات:", options: ["الحديثة جداً.", "الأقدم وأكثرها شيوعاً.", "المرفوضة علمياً.", "المؤقتة."], correct: 1, explanation: "التصنيف إلى عصاب وذهان هو من التصنيفات الأقدم وأكثرها شيوعاً في تاريخ الطب النفسي، رغم أن DSM-IV ألغى هذا التقسيم الصارم.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يتميز الشخص ........ باضطراب جوانب عديدة في شخصيته، وتكون شخصيته مفككة ويبدو متبلداً ومنفصلاً عن الواقع:", options: ["العصابي.", "الذهاني.", "القهري.", "المتوافق."], correct: 1, explanation: "الشخص الذهاني يتميز باضطراب جوانب عديدة في شخصيته، وتكون شخصيته مفككة ويبدو متبلداً ومنفصلاً عن الواقع تماماً.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الأمراض النفسية والعقلية التي يكون سببها المباشر خلل أو إصابة تشريحية بالجهاز العصبي كالأورام تُسمى:", options: ["أمراضاً وظيفية.", "أمراضاً عضوية.", "عصاباً تحولياً.", "ذهاناً وظيفياً."], correct: 1, explanation: "الأمراض العضوية هي التي يكون سببها المباشر خلل أو إصابة تشريحية في الجهاز العصبي مثل الأورام أو الالتهابات.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "اضطرابات سن الشيخوخة، وزهري الجهاز العصبي، تُصنف كأمراض عقلية:", options: ["وظيفية.", "عضوية.", "بيئية.", "نفسية."], correct: 1, explanation: "اضطرابات سن الشيخوخة وزهري الجهاز العصبي (Neurosyphilis) تُصنف كأمراض عقلية عضوية لأن لها أساساً عضوياً واضحاً في الجهاز العصبي.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الأمراض النفسية والعقلية التي يكون سببها المباشر خللاً في البناء النفسي للإنسان مع سلامة الجهازين العصبي والغدي تُسمى:", options: ["أمراضاً عضوية.", "أمراضاً وظيفية.", "أمراضاً عصبية.", "أمراضاً عقلية."], correct: 1, explanation: "الأمراض الوظيفية هي التي يكون سببها خلل في البناء النفسي مع سلامة الجهازين العصبي والغدي، مثل القلق والوسواس القهري.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "مجال التخصص الأساسي لطالب الدراسات النفسية (الأخصائي النفسي Psychologist) هو الأمراض:", options: ["النفسية والعقلية الوظيفية.", "النفسية والعقلية العضوية.", "الجراحية.", "الجلدية."], correct: 0, explanation: "مجال تخصص الأخصائي النفسي (Psychologist) هو الأمراض النفسية والعقلية الوظيفية، بينما يختص الطبيب النفسي (Psychiatrist) بالأمراض العضوية أيضاً.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "التعطل الجزئي للفرد عن أداء دوره في الحياة يُسمى:", options: ["الذهان.", "العصاب.", "التخلف العقلي.", "الفصام."], correct: 1, explanation: "العصاب هو التعطل الجزئي للفرد عن أداء دوره في الحياة، حيث يظل المريض على اتصال بالواقع لكن بشكل جزئي فقط.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "من أنواع العصاب (التعطل الجزئي):", options: ["الفصام والبارانويا.", "القلق، الهستيريا، الاكتئاب العصابي، والفوبيا.", "الاكتئاب الذهاني.", "الخرف والهذيان."], correct: 1, explanation: "أنواع العصاب تشمل القلق، الهستيريا، الاكتئاب العصابي، والفوبيا (المخاوف الشاذة)، وهي جميعها اضطرابات وظيفية.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "من أنواع الذهان (التعطل الكلي):", options: ["الوسواس القهري والفزع.", "الهستيريا والقلق العام.", "الفصام والاكتئاب الذهاني والبارانويا.", "الاكتئاب العصابي."], correct: 2, explanation: "أنواع الذهان تشمل الفصام، الاكتئاب الذهاني، والبارانويا، وهي جميعها تتميز بتعطل كامل عن أداء الدور في الحياة وانفصال عن الواقع.", category: "mcq", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المرض بمعناه العام هو تعطل العضو عن أداء وظيفته تعطلاً جزئياً أو كلياً.", options: ["صح", "خطأ"], correct: 0, explanation: "المرض بمعناه العام هو تعطل العضو عن أداء وظيفته تعطلاً جزئياً أو كلياً، وهذا التعريف الشامل ينطبق على الأمراض الجسدية والعقلية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المرض النفسي أو العصاب هو اضطراب جسمي ينشأ عن تلف عضوي يصيب الجهاز العصبي.", options: ["صح", "خطأ"], correct: 1, explanation: "العصاب (Neurosis) هو اضطراب وظيفي في الشخصية وليس تلفاً عضوياً، بينما المرض العصبي (Nervous disease) هو الذي ينشأ عن تلف عضوي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المرض العصبي (Nervous disease) يتميز بتلف عضوي في الجهاز العصبي كالشلل النصفي.", options: ["صح", "خطأ"], correct: 0, explanation: "المرض العصني يتميز بتلف عضوي في الجهاز العصبي مثل الشلل النصفي وحالات الصرع.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يُعد اندفاع الناس لاستخدام الأدوية التي تُهدئ الأعصاب لعلاج الأمراض النفسية إجراءً طبياً سليماً.", options: ["صح", "خطأ"], correct: 1, explanation: "الأدوية المهدئة لا تعالج الأمراض النفسية بشكل سليم، بل تحتاج إلى علاج نفسي متخصص وقد يحتاج الأمر إلى تدخل طبي نفسي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الأسباب الأصلية أو المهيأة للمرض النفسي هي التي تمهد لحدوث المرض وتجعل الفرد عرضة لظهوره.", options: ["صح", "خطأ"], correct: 0, explanation: "الأسباب الأصلية (المهيأة) هي التي تمهد لحدوث المرض وتجعل الفرد عرضة له مثل العوامل الوراثية والخبرات الأليمة.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
    {text: "الخبرة الأليمة في مرحلة الطفولة تُعد من الأسباب المساعدة (المرسبة) السريعة لظهور المرض.", options: ["صح", "خطأ"], correct: 1, explanation: "الخبرة الأليمة في الطفولة تُعد من الأسباب الأصلية (المهيأة) وليست المساعدة، لأنها تمهد لحدوث المرض على المدى الطويل.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "اضطراب الغدد والهرمونات والأمراض المعدية تُصنف كأسباب فسيولوجية للأمراض النفسية.", options: ["صح", "خطأ"], correct: 0, explanation: "الأسباب الفسيولوجية تشمل اضطرابات وظائف الأعضاء الجسدية مثل الغدد والهرمونات والأمراض المعدية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "أثبتت الدراسات أن الإنسان الأول كان يعاني من أمراض وتآذى، وكان يلجأ للطبيعة للخلاص منها.", options: ["صح", "خطأ"], correct: 0, explanation: "أثبتت دراسات بقايا الإنسان الأول أنه كان يلجأ للطبيعة للتخلص من المرض والألم.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "لم يتوصل الفراعنة في مصر القديمة إلى التمييز بين الأصحاء ومرضى الجسم وفاقدي العقل.", options: ["صح", "خطأ"], correct: 1, explanation: "الفراعنة توصلوا إلى التمييز بين الأصحاء ومرضى العقل، ودلت البرديات على وجود ثقوب جراحية في جماجم الفراعنة لطرد الأرواح الشريرة.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "العلماء المسلمون كابن سينا والرازي كانوا أول من شيد المستشفيات الخاصة بالأمراض العقلية.", options: ["صح", "خطأ"], correct: 0, explanation: "العلماء المسلمون الأوائل مثل الرازي وابن سينا كانوا أول من شيد المستشفيات الخاصة بالأمراض العقلية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يُعرّف سوء التوافق بأنه حالة تبدو في عجز الفرد وإخفاقه في حل مشكلاته اليومية بشكل طبيعي.", options: ["صح", "خطأ"], correct: 0, explanation: "سوء التوافق هو حالة يعجز فيها الفرد عن حل مشكلاته اليومية إخفاقاً يزيد عما يُنتظر منه.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الكذب والسرقة والتبول القسري تعد من صور التكيف السوي عند الأطفال.", options: ["صح", "خطأ"], correct: 1, explanation: "الكذب والسرقة والتبول القسري من مظاهر سوء التوافق البسيط عند الأطفال وليست صوراً للتكيف السوي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "جميع حالات سوء التوافق تصل دائماً إلى درجة الأمراض العقلية الخطيرة.", options: ["صح", "خطأ"], correct: 1, explanation: "ليس جميع حالات سوء التوافق تصل إلى درجة الأمراض العقلية، فهناك درجات متفاوتة من سوء التوافق.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يلجأ الإنسان للحيل الدفاعية غير السوية عندما يعجز عن الاحتفاظ بتوازنه النفسي بالطرق السوية.", options: ["صح", "خطأ"], correct: 0, explanation: "الحيل الدفاعية غير السوية تظهر عندما يعجز الفرد عن الحفاظ على توازنه النفسي بالطرق السوية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "وفقاً للمعيار المثالي، السلوك السوي هو السلوك الكامل أو الذي يقرب من الكمال.", options: ["صح", "خطأ"], correct: 0, explanation: "المعيار المثالي يرى أن السلوك السوي هو السلوك الكامل أو ما يقرب من الكمال، وهو المعيار الذي تبنته مدرسة التحليل النفسي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المعيار السيكولوجي لا يمكن تطبيقه في كل المجتمعات لأنه يعتمد على ثقافة المجتمع.", options: ["صح", "خطأ"], correct: 1, explanation: "المعيار السيكولوجي يمكن تطبيقه في أي مجتمع بغض النظر عن ثقافته، لأنه يعتمد على وجود صراعات نفسية أو تلف عضوي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "مريض القلق (العصابي) تنقطع صلته بالمجتمع تماماً ولا يؤدي أي دور في الحياة.", options: ["صح", "خطأ"], correct: 1, explanation: "مريض القلق (العصابي) يظل على اتصال بالواقع، وبينه وبين الحياة \"غشاء نفاذ\" على عكس المريض الذهاني.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "مشكلة مريض الفصام هي مشكلة \"وجود\" بينما مشكلة مريض القلق هي مشكلة \"توافق\".", options: ["صح", "خطأ"], correct: 0, explanation: "مشكلة الذهاني (الفصام) هي مشكلة \"وجود\" (انفصال عن الواقع) ومشكلة العصابي هي مشكلة \"توافق\".", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المريض العصابي بينه وبين الحياة \"غشاء نفاذ\" يسمح له بالتفاعل مع الحياة متى استطاع.", options: ["صح", "خطأ"], correct: 0, explanation: "بين المريض العصابي والحياة \"غشاء نفاذ\" يدخل منه إلى الحياة عندما يستطيع، بعكس الذهاني الذي بينه وبين الحياة \"جدار فولاذي\".", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المريض الذهاني يدرك تماماً طبيعة اضطرابه ويسعى لطلب المساعدة الطبية بنفسه.", options: ["صح", "خطأ"], correct: 1, explanation: "المريض الذهاني عادة لا يدرك طبيعة اضطرابه ولا يسعى للعلاج بنفسه، لأنه يعيش في عالمه الخاص بعيداً عن الواقع.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الأمراض النفسية والعقلية العضوية يكون سببها المباشر خللاً أو إصابة في الجهاز العصبي كالأورام.", options: ["صح", "خطأ"], correct: 0, explanation: "الأمراض العضوية يكون سببها تلف أو إصابة تشريحية في الجهاز العصبي مثل الأورام أو الالتهابات.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الأمراض النفسية والعقلية الوظيفية يكون سببها تلف تشريحي في خلايا المخ.", options: ["صح", "خطأ"], correct: 1, explanation: "الأمراض الوظيفية يكون سببها خلل في البناء النفسي مع سلامة الجهاز العصبي، وليس تلفاً تشريحياً.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يختص الأطباء النفسيون (Psychiatrists) بمعرفة وعلاج الأمراض النفسية والعقلية العضوية بشكل مباشر.", options: ["صح", "خطأ"], correct: 0, explanation: "الأطباء النفسيون (Psychiatrists) يختصون بالأمراض العضوية والوظيفية، بينما الأخصائيون النفسيون (Psychologists) يختصون بالوظيفية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "العصاب هو تعطل الفرد عن أداء دوره في الحياة تعطلاً جزئياً.", options: ["صح", "خطأ"], correct: 0, explanation: "العصاب هو التعطل الجزئي للفرد عن أداء دوره في الحياة، بينما الذهان هو التعطل الكلي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الذهان هو تعطل الفرد عن أداء دوره في الحياة تعطلاً كلياً.", options: ["صح", "خطأ"], correct: 0, explanation: "الذهان هو تعطل الفرد عن أداء دوره في الحياة تعطلاً كلياً، مع انفصال تام عن الواقع.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الاكتئاب العصابي والفوبيا يُعدان من أمثلة الذهان الوظيفي.", options: ["صح", "خطأ"], correct: 1, explanation: "الاكتئاب العصابي والفوبيا من أمثلة العصاب (التعطل الجزئي) وليس الذهان.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الفصام والبارانويا يُعدان من أمثلة العصاب الوظيفي.", options: ["صح", "خطأ"], correct: 1, explanation: "الفصام والبارانويا من أمثلة الذهان (التعطل الكلي) وليس العصاب الوظيفي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "اضطراب الوسواس القهري (OCD) واضطراب ما بعد الصدمة (PTSD) من الاضطرابات العصابية (النفسية).", options: ["صح", "خطأ"], correct: 0, explanation: "الوسواس القهري (OCD) واضطراب ما بعد الصدمة (PTSD) من الاضطرابات العصابية النفسية الوظيفية.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "الذهان قد يكون وظيفياً (بدون سبب عضوي) وقد يكون ذُهاناً عضوياً ناتجاً عن أمراض الجهاز العصبي.", options: ["صح", "خطأ"], correct: 0, explanation: "الذهان قد يكون وظيفياً (كالفصام) أو عضوياً ناتجاً عن أمراض الجهاز العصبي كالأورام أو الخرف.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "المرض النفسي والعقلي الوظيفي يعني تعطل وظائف المريض الحياتية رغم سلامة أجهزته العصبية والغدية.", options: ["صح", "خطأ"], correct: 0, explanation: "المرض الوظيفي هو تعطل في الوظائف الحياتية رغم سلامة الأجهزة العصبية والغدية، وهذا يميزه عن المرض العضوي.", category: "truefalse", chapter: "الفصل الأول: مفهوم الاضطرابات النفسية"},
  {text: "يُعرّف \"وولمان Wolman\" الاضطرابات العقلية بأنها:", options: ["اختلالات فيزيقية كيميائية فقط.", "اضطرابات سلوكية، وسوء توافق شديد الدرجة تتضمن كل أشكال السلوك النفسي المرضي.", "تعطل الفرد عن أداء دوره الوظيفي فقط.", "انحراف عن المعيار الإحصائي."], correct: 1, explanation: "وولمان عرّف الاضطرابات العقلية بأنها اضطرابات سلوكية وسوء توافق شديد الدرجة تتضمن كل أشكال السلوك النفسي المرضي.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "مجموعة الأعراض (Symptoms) التي تشكل معاً تشخيصاً لمرض معين تُسمى:", options: ["زملة أعراض (Syndrome).", "مرضاً عضوياً.", "اضطراباً فسيولوجياً.", "حالة نفسية عابرة."], correct: 0, explanation: "زملة الأعراض (Syndrome) هي مجموعة الأعراض التي تظهر معاً وتشكل نمطاً مميزاً لتشخيص مرض معين.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "ألغى الدليل التشخيصي الرابع (DSM-IV) والتصنيف الدولي العاشر (ICD-10) التقسيم الصارم للاضطرابات إلى فئتي:", options: ["العصاب والذهان (مع الإبقاء على اللفظين لوصف القليل منها).", "التخلف العقلي واضطرابات التعلم.", "الأمراض العضوية والأمراض الوظيفية.", "الاضطرابات الخلقية والمكتسبة."], correct: 0, explanation: "DSM-IV و ICD-10 ألغيا التقسيم الصارم إلى عصاب وذهان مع الإبقاء على اللفظين في بعض الحالات.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "من الاضطرابات التي يتم تشخيصها غالباً في مرحلة الرضاعة والطفولة أو المراهقة:", options: ["اضطرابات الهذيان.", "التخلف العقلي واضطرابات التواصل.", "اضطراب الشخصية المضادة للمجتمع.", "الاكتئاب الذهاني."], correct: 1, explanation: "التخلف العقلي واضطرابات التواصل من الاضطرابات التي تظهر وتُشخص غالباً في مرحلة الطفولة المبكرة أو المراهقة.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطرابات الهذيان، الخبل (الجنون)، والنسيان تُصنف تحت فئة:", options: ["الاضطرابات المعرفية.", "اضطرابات المزاج.", "الاضطرابات جسمية الشكل.", "الاضطرابات الانفصالية."], correct: 0, explanation: "الاضطرابات المعرفية تشمل الهذيان، الخرف (Dementia)، والنسيان، وهي تؤثر على الوظائف العقلية العليا.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الاضطرابات المرتبطة بالخمر، الأمفيتامين، والكوكايين تُصنف ضمن:", options: ["اضطرابات الإدعاء.", "اضطرابات مرتبطة بعقار أو مستحضر (Substance-Related).", "اضطرابات القلق.", "اضطرابات الشخصية."], correct: 1, explanation: "اضطرابات المخدرات والمواد (Substance-Related Disorders) تشمل الاضطرابات المرتبطة بالخمر، الأمفيتامين، والكوكايين.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب الفصام الوجداني والاضطراب الضلالي (الهذائي) يندرجان تحت فئة:", options: ["اضطرابات الشخصية.", "اضطرابات الفصام والاضطرابات الذهانية.", "الاضطرابات الانفصالية.", "اضطرابات المزاج."], correct: 1, explanation: "الفصام الوجداني والاضطراب الضلالي (الهذائي) يندرجان تحت فئة اضطرابات الفصام والاضطرابات الذهانية.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب الاكتئاب الرئيسي والاضطراب ثنائي البعد (ثنائي القطب) هما من:", options: ["اضطرابات القلق.", "اضطرابات المزاج (الوجدان).", "اضطرابات التوافق.", "الاضطرابات الانفصالية."], correct: 1, explanation: "اضطرابات المزاج (Mood Disorders) تشمل الاكتئاب الرئيسي والاضطراب ثنائي القطب (Bipolar).", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الخواف الاجتماعي، واضطراب ما بعد الصدمة، واضطراب القلق العام تُعد من:", options: ["اضطرابات المزاج.", "اضطرابات القلق.", "الاضطرابات الانشقاقية.", "اضطرابات الشخصية."], correct: 1, explanation: "اضطرابات القلق (Anxiety Disorders) تشمل الخواف الاجتماعي، اضطراب ما بعد الصدمة (PTSD)، والقلق العام.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب التجسيد، اضطراب التحول، واضطراب توهم المرض يصنفون ضمن:", options: ["اضطرابات الإدعاء.", "الاضطرابات جسمية الشكل (Somatoform).", "اضطرابات التحكم في الدافع.", "الاضطرابات الانفصالية."], correct: 1, explanation: "الاضطرابات جسمية الشكل (Somatoform Disorders) تشمل اضطراب التحول، اضطراب توهم المرض، واضطراب الجسدنة.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "النسيان الانفصالي، الشرود الانفصالي، واضطراب انفصال الهوية تُصنف كـ:", options: ["اضطرابات الانفصال أو الانشقاق (Dissociative).", "اضطرابات معرفية.", "اضطرابات الشخصية.", "اضطرابات المزاج."], correct: 0, explanation: "الاضطرابات الانفصالية (Dissociative Disorders) تشمل النسيان الانفصالي، الشرود، وانفصال الهوية (تعدد الشخصيات).", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "فقدان الشهية العصبي والشره المرضي للطعام يندرجان تحت:", options: ["اضطرابات التغذية والأكل.", "اضطرابات التحكم في الدافع.", "اضطرابات التوافق.", "اضطرابات الطفولة."], correct: 0, explanation: "اضطرابات الأكل (Eating Disorders) تشمل فقدان الشهية العصبي (Anorexia) والشره المرضي (Bulimia).", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب الشخصية الفصامية، البينية، والنرجسية تُعد من:", options: ["الاضطرابات الذهانية.", "اضطرابات الشخصية.", "اضطرابات المزاج.", "الاضطرابات العصابية."], correct: 1, explanation: "اضطرابات الشخصية (Personality Disorders) تشمل الشخصية الفصامية، الحدية (البينية)، والنرجسية.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "متلازمة عصبية نفسية تتصف بأنها تحدث فجأة وتؤثر على درجات الوعي والانتباه والإدراك، تُعرف بـ:", options: ["الهذيان (Delirium).", "الخرف (Dementia).", "الفصام.", "الاكتئاب."], correct: 0, explanation: "الهذيان (Delirium) هو متلازمة عصبية نفسية تحدث فجأة وتؤثر على الوعي والانتباه والإدراك.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يصل معدل انتشار الهذيان لدى المرضى المسنين في المستشفيات إلى:", options: ["10 - 15%", "40 - 60%", "80 - 90%", "5 - 10%"], correct: 1, explanation: "يصل معدل انتشار الهذيان لدى المرضى المسنين في المستشفيات إلى 40-60%، مما يجعله شائعاً جداً في هذه الفئة العمرية.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يُعد ........ العامل المؤهب الأكثر أهمية والأقوى لحدوث الهذيان لدى كبار السن:", options: ["الاكتئاب.", "الضعف الإدراكي السابق أو الخرف (Dementia).", "القلق العام.", "الأرق."], correct: 1, explanation: "الضعف الإدراكي السابق أو الخرف (Dementia) هو العامل المؤهب الأقوى لحدوث الهذيان لدى كبار السن.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "وفقاً للدراسات، نسبة المرضى الداخليين المصابين بالخرف الذين يعانون من الهذيان تبلغ:", options: ["12%", "41%", "87%", "5%"], correct: 2, explanation: "تشير الدراسات إلى أن 87% من المرضى الداخليين المصابين بالخرف يعانون أيضاً من الهذيان.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الهذيان بعد العمليات الجراحية (خاصة الكسور الكبيرة) يبلغ متوسط حدوثه حوالي:", options: ["10%", "40%", "90%", "5%"], correct: 1, explanation: "الهذيان بعد العمليات الجراحية الكبيرة (خاصة كسور الفخذ) يبلغ متوسط حدوثه حوالي 40%.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "وجود الهذيان لدى المرضى المسنين يؤدي غالباً إلى:", options: ["سرعة الشفاء والتعافي.", "دخول المستشفى لفترة أطول وتعقيد النتائج.", "تحسن في الأداء اليومي.", "تحسن في الذاكرة."], correct: 1, explanation: "وجود الهذيان لدى المرضى المسنين يؤدي إلى دخول المستشفى لفترة أطول وتعقيد النتائج العلاجية.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "من الآليات البيولوجية العصبية التي تساهم في الهذيان:", options: ["زيادة تدفق الدم للمخ.", "اختلال توازن الناقلات العصبية.", "قوة الذاكرة قصيرة المدى.", "زيادة إفراز السيروتونين."], correct: 1, explanation: "الهذيان ينتج عن اختلال توازن الناقلات العصبية خاصة الأسيتيل كولين والدوبامين في الدماغ.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يُستبعد تشخيص \"الهذيان\" في الحالات التي يفقد فيها المريض الوعي تماماً مثل:", options: ["الفصام والاكتئاب.", "الذهول والغيبوبة.", "القلق والتوتر.", "الهستيريا."], correct: 1, explanation: "يُستبعد تشخيص الهذيان في حالات فقدان الوعي التام مثل الذهول والغيبوبة (Coma) لأن الهذيان يتطلب وجود وعي متغير وليس مفقوداً تماماً.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يشمل الهذيان ثلاثة مجالات أعراض مميزة أساسية، أي من الآتي *ليس* منها؟", options: ["مجالات معرفية (التوجه والانتباه).", "القدرة البصرية المكانية والذاكرة.", "قوة العضلات وسرعة الركض.", "التفكير العالي والنشاط الحركي."], correct: 2, explanation: "الهذيان يشمل ثلاثة مجالات أعراض: التوجه والانتباه، الذاكرة والقدرة البصرية المكانية، والتفكير العالي والنشاط الحركي. قوة العضلات ليست منها.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اللغة، وعملية التفكير، والوظيفة التنفيذية، والساعة البيولوجية تُصنف في الهذيان ضمن مجال:", options: ["التفكير العالي.", "الذاكرة قصيرة المدى.", "التوجه الفراغي.", "الوعي والانتباه."], correct: 0, explanation: "اللغة، التفكير، الوظيفة التنفيذية، والساعة البيولوجية تُصنف ضمن مجال التفكير العالي في الهذيان.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يتمثل العرض الحركي للهذيان في ثلاثة أنماط هي:", options: ["سريع، بطيء، ومتوسط.", "مفرط النشاط، ناقص النشاط، والنمط المختلط.", "إرادي، لا إرادي، وشبه إرادي.", "طبيعي، مضطرب، وخليط."], correct: 1, explanation: "العرض الحركي للهذيان له ثلاثة أنماط: مفرط النشاط، ناقص النشاط، والنمط المختلط.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "تُعتبر القدرة العاطفية والسمات الذهانية في مريض الهذيان:", options: ["أعراضاً أساسية وجوهرية.", "أعراضاً غير أساسية (ثانوية) لأنها غير محددة وتحدث بشكل أقل.", "العرض الوحيد للتشخيص.", "غير مهمة تشخيصياً."], correct: 1, explanation: "القدرة العاطفية والسمات الذهانية في الهذيان تُعتبر أعراضاً ثانوية غير أساسية لأنها غير محددة وتحدث بشكل أقل.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
    {text: "المرضى الذين يعانون من اضطرابات معرفية سابقة (مثل الخرف) يظهر لديهم الهذيان بـ:", options: ["عبء إدراكي إجمالي أكبر وتلف أشد.", "أعراض طفيفة وسرعة في الشفاء.", "لا يظهر لديهم الهذيان إطلاقاً.", "تحسن مفاجئ في الذاكرة."], correct: 0, explanation: "المرضى المصابون بالخرف يظهر لديهم الهذيان بعبء إدراكي أكبر وتلف أشد مقارنة بغير المصابين بالخرف.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الإساءة الجسمية أو الجنسية للطفل، وإهمال الطفل، تُصنف في الدليل التشخيصي كـ:", options: ["مشاكل مرتبطة بسوء المعاملة أو الإهمال.", "اضطرابات التوافق.", "اضطرابات الشخصية.", "اضطرابات التعلم."], correct: 0, explanation: "الإساءة الجسمية أو الجنسية للطفل والإهمال يُصنفان في DSM كمشاكل مرتبطة بسوء المعاملة أو الإهمال.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب تقلص المهبل (الذي لا يرجع لأسباب جسمية) يُصنف ضمن:", options: ["اضطرابات القلق.", "الاضطرابات الجنسية والهوية الجنسية.", "الاضطرابات جسمية الشكل.", "الاضطرابات الانفصالية."], correct: 1, explanation: "اضطراب تقلص المهبل (Vaginismus) الذي لا يرجع لأسباب جسمية يُصنف ضمن الاضطرابات الجنسية والوظيفة الجنسية.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "من أمثلة \"اضطرابات التوافق\":", options: ["الفصام البارانويدي.", "اضطراب التوافق مع مزاج اكتئابي أو مع قلق.", "التخلف العقلي الشديد.", "الوسواس القهري."], correct: 1, explanation: "اضطرابات التوافق (Adjustment Disorders) تشمل الاضطراب مع مزاج اكتئابي أو مع قلق كرد فعل لضغوط بيئية واضحة.", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "وجود عرض واحد أو اثنين في الشخص:", options: ["يبرر تماماً وضعه تحت تشخيص اضطراب عقلي معين.", "لا يبرر وضعه تحت اضطراب معين أو وصفه به.", "يكفي لتشخيص الفصام فقط.", "يؤكد إصابته بالخرف."], correct: 1, explanation: "وجود عرض واحد أو اثنين لا يبرر وضع الشخص تحت تشخيص اضطراب عقلي معين، فالتشخيص يحتاج إلى مجموعة أعراض (زملة أعراض).", category: "mcq", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "تُعزى الاضطرابات العقلية إلى عوامل اجتماعية أو نفسية أو وراثية أو اختلالات بيولوجية.", options: ["صح", "خطأ"], correct: 0, explanation: "الاضطرابات العقلية قد تنتج عن عوامل متعددة تشمل الاجتماعية، النفسية، الوراثية، والبيولوجية.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "زملة الأعراض (Syndrome) تعني أن عرضاً واحداً فقط يكفي لتشخيص المريض بالاضطراب العقلي.", options: ["صح", "خطأ"], correct: 1, explanation: "زملة الأعراض تعني مجموعة أعراض تظهر معاً وتشكل نمطاً مميزاً، وليس عرضاً واحداً فقط.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "أبقى الدليل التشخيصي الرابع والتصنيف الدولي العاشر على لفظي \"العصاب\" و\"الذهان\" لوصف بعض الاضطرابات رغم إلغاء التقسيم الصارم بينهما.", options: ["صح", "خطأ"], correct: 0, explanation: "DSM-IV و ICD-10 أبقيا على لفظي العصاب والذهان لبعض الاضطرابات رغم إلغاء التقسيم الصارم.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب اللوازم (Tic disorders) واضطرابات الإخراج تُشخص غالباً في مرحلة الرضاعة والطفولة أو المراهقة.", options: ["صح", "خطأ"], correct: 0, explanation: "اضطرابات اللوازم (Tics) واضطرابات الإخراج تظهر عادةً في مرحلة الطفولة أو المراهقة.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب الهلع، والخواف من الأماكن المفتوحة، واضطراب الوسواس القهري تصنف كاضطرابات مزاج (وجدان).", options: ["صح", "خطأ"], correct: 1, explanation: "هذه الاضطرابات تُصنف كاضطرابات قلق وليست اضطرابات مزاج.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب التحول واضطراب توهم المرض يُصنفان ضمن الاضطرابات جسمية الشكل (Somatoform).", options: ["صح", "خطأ"], correct: 0, explanation: "اضطراب التحول (Conversion) وتوهم المرض (Hypochondriasis) من الاضطرابات جسمية الشكل.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب انفصال الهوية (تعدد الشخصيات) والشرود الانفصالي هما من الاضطرابات الانفصالية (Dissociative).", options: ["صح", "خطأ"], correct: 0, explanation: "انفصال الهوية والشرود الانفصالي من الاضطرابات الانفصالية (Dissociative Disorders).", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الشره المرضي للطعام وفقدان الشهية العصبي يُصنفان ضمن اضطرابات النوم.", options: ["صح", "خطأ"], correct: 1, explanation: "الشره المرضي وفقدان الشهية يُصنفان ضمن اضطرابات الأكل وليس اضطرابات النوم.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "اضطراب الشخصية المضادة للمجتمع واضطراب الشخصية الوسواسية القهرية ينتميان لفئة \"اضطرابات الشخصية\".", options: ["صح", "خطأ"], correct: 0, explanation: "كلاهما من اضطرابات الشخصية (Personality Disorders).", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الهذيان هو متلازمة عصبية نفسية تتصف بأنها تحدث ببطء شديد وتدريجي على مدار سنوات.", options: ["صح", "خطأ"], correct: 1, explanation: "الهذيان يحدث فجأة وليس ببطء، وهو حالة حادة وليست مزمنة.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يعتبر التقدم في العمر عاملاً مهماً من عوامل خطر الإصابة بالهذيان.", options: ["صح", "خطأ"], correct: 0, explanation: "التقدم في العمر من أهم عوامل خطر الإصابة بالهذيان، خاصة فوق سن 65.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الضعف الإدراكي السابق (أو الخرف) هو عامل مؤهب قوي جداً لحدوث الهذيان.", options: ["صح", "خطأ"], correct: 0, explanation: "الخرف هو العامل المؤهب الأقوى لحدوث الهذيان.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "نسبة انتشار الهذيان لدى المرضى المسنين المصابين بالخرف أقل بكثير من المسنين غير المصابين بالخرف.", options: ["صح", "خطأ"], correct: 1, explanation: "نسبة الهذيان أعلى بكثير لدى المصابين بالخرف (87%) مقارنة بغير المصابين.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "الهذيان بعد العمليات الجراحية الكبيرة قد تتراوح نسبته بين 9% إلى 87% بمتوسط 40%.", options: ["صح", "خطأ"], correct: 0, explanation: "هذه الإحصائيات صحيحة حول حدوث الهذيان بعد العمليات الجراحية الكبيرة.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يتصف الهذيان بضعف الوعي وتغير متقلب في الوظائف القشرية العليا مع انتباه واضح ومركز.", options: ["صح", "خطأ"], correct: 1, explanation: "الهذيان يتصف بضعف الوعي وتشتت الانتباه وليس انتباهاً واضحاً ومركزاً.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "يتم استبعاد تشخيص الهذيان في الحالات التي يفقد فيها المريض الوعي تماماً مثل الغيبوبة.", options: ["صح", "خطأ"], correct: 0, explanation: "يُستبعد تشخيص الهذيان في حالات فقدان الوعي التام مثل الغيبوبة.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "مجالات الأعراض الثلاثة الأساسية للهذيان تشمل: التوجه والانتباه، الذاكرة والقدرة البصرية المكانية، والتفكير العالي والنشاط الحركي.", options: ["صح", "خطأ"], correct: 0, explanation: "هذه هي المجالات الثلاثة الأساسية لأعراض الهذيان.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "للهذيان عرض حركي واحد فقط وهو \"النمط مفرط النشاط\".", options: ["صح", "خطأ"], correct: 1, explanation: "للهذيان ثلاثة أنماط حركية: مفرط النشاط، ناقص النشاط، والمختلط.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "تُعتبر القدرة العاطفية والسمات الذهانية (كالهلاوس) من الأعراض الأساسية والجوهرية الثابتة في كل حالات الهذيان.", options: ["صح", "خطأ"], correct: 1, explanation: "القدرة العاطفية والسمات الذهانية تُعتبر أعراضاً ثانوية غير أساسية في الهذيان.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "نقص الأبحاث حول الهذيان لدى الأطفال يجعل معظم ما نعرفه عن ظواهره مستمداً من الأبحاث على البالغين وكبار السن.", options: ["صح", "خطأ"], correct: 0, explanation: "هذا صحيح، حيث أن معظم الأبحاث عن الهذيان تركز على البالغين وكبار السن.", category: "truefalse", chapter: "الفصل الثاني: الاضطرابات العقلية"},
  {text: "أول محاولة جدية لوصف الفصام كمرض مستقل كانت عام 1860م على يد العالم:", options: ["إميل كريبلين (Emil Kraepelin).", "إيوجين بلويلر (Eugen Bleuler).", "بندكت موريل (Benedict Morel).", "هيكر (Hecker)."], correct: 2, explanation: "بندكت موريل (Morel) قدم أول محاولة جدية لوصف الفصام كمرض مستقل عام 1860.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "أطلق \"موريل\" على حالة التدهور العقلي والميل إلى العزلة التي ظهرت على فتى في الرابعة عشرة اسم:", options: ["الخبل المبكر (Dementia Praecox).", "البارانويا (Paranoia).", "جنون الطفولة (Hebephrenia).", "الفصام (Schizophrenia)."], correct: 0, explanation: "موريل أطلق مصطلح \"الخبل المبكر\" (Dementia Praecox) على حالة التدهور العقلي التي لاحظها على فتى في سن الرابعة عشرة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في عام 1871، وصف \"هيكر Hecker\" التدهور العقلي الذي يحدث في سن البلوغ وأطلق عليه اسم \"هيبفرينيا\" والذي يعني:", options: ["انقسام العقل.", "جنون الطفولة.", "ذهان الهذاءات.", "التدهور العقلي."], correct: 1, explanation: "هيكر وصف حالة التدهور في سن البلوغ وأطلق عليها اسم \"هيبفرينيا\" (Hebephrenia) أي جنون الطفولة أو المراهقة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "أطلق \"كالباوم Kahlbaum\" عام 1873 مصطلح \"البارانويا Paranoia\" للإشارة إلى:", options: ["ذهان الهذاءات (انحراف العقل).", "الخبل المبكر.", "ازدواج الشخصية.", "جنون الطفولة."], correct: 0, explanation: "كالباوم أطلق مصطلح البارانويا عام 1873 للإشارة إلى ذهان الهذاءات أو انحراف العقل.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "أول من جمع الاضطرابات (الخبل، الهيبفرينيا، البارانويا) تحت اسم \"جنون المراهقة\" أو \"الخبل المبكر\" عام 1896 هو:", options: ["هندرسون.", "بلويلر.", "كريبلين.", "موريل."], correct: 2, explanation: "إميل كريبلين جمع هذه الاضطرابات الثلاث تحت اسم \"الخبل المبكر\" (Dementia Praecox) أو \"جنون المراهقة\" عام 1896.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "اعتقد \"كريبلين\" أن الخبل المبكر له أساس عضوي يؤدي إلى فقدان الوحدة الداخلية للعقل، وكان معياره الأساسي للتشخيص هو:", options: ["التدهور العقلي وانحلال الشخصية.", "الميكانيزمات النفسية اللاشعورية.", "الاكتئاب وتأنيب الضمير.", "العوامل البيئية."], correct: 0, explanation: "كريبلين اعتمد على التدهور العقلي وانحلال الشخصية كمعيار أساسي لتشخيص الخبل المبكر.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "من هو العالم الذي قدم مصطلح \"الفصام Schizophrenia\" للإشارة إلى انقسام العقل أو الوظائف النفسية؟", options: ["كريبلين.", "بلويلر.", "موريل.", "هيكر."], correct: 1, explanation: "إيوجين بلويلر (Eugen Bleuler) قدم مصطلح \"الفصام\" (Schizophrenia) عام 1908 للإشارة إلى انقسام الوظائف النفسية.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "عارض \"بلويلر\" استخدام مصطلح \"جنون المراهقة\" لكريبلين على أساس أن الاضطراب:", options: ["لا يظهر إلا في سن الشيخوخة.", "لا يؤدي بالضرورة إلى التدهور ولا يبدأ دائماً في المراهقة.", "ناتج عن أسباب بيئية بحتة دون أي تدخل للوظائف النفسية.", "مرض عضوي بحت."], correct: 1, explanation: "بلويلر عارض مصطلح \"جنون المراهقة\" لأن الاضطراب لا يبدأ دائماً في المراهقة ولا ينتهي بالضرورة بالتدهور التام.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "مصطلح \"الشخصية المنقسمة\" في الفصام يعني:", options: ["انقسام الشخصية إلى شخصيتين منفصلتين أو أكثر (ازدواج الشخصية).", "تنافراً وانقساماً بين الوظائف النفسية المختلفة داخل شخصية واحدة (انعدام التكامل).", "امتلاك المريض لقدرات خارقة للطبيعة.", "الانسحاب الكامل من المجتمع."], correct: 1, explanation: "الشخصية المنقسمة في الفصام تعني تنافراً وانقساماً بين الوظائف النفسية داخل شخصية واحدة وليست ازدواج الشخصية.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يُعرّف \"أحمد فائق\" الفصام بأنه اضطراب يجعل المريض يبدل عالمنا بـ:", options: ["عالم واقعي مليء بالقلق والمخاوف.", "عالم وهمي له فيه قدرات خارقة وسلطان مطلق للفكر.", "شخصية أخرى تماماً تعيش حياة طبيعية.", "عالم من العزلة والصمت."], correct: 1, explanation: "أحمد فائق عرّف الفصام بأنه يجعل المريض يبدل عالمنا بعالم وهمي يملك فيه قدرات خارقة وسلطاناً مطلقاً للفكر.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يعتبر \"بلويلر\" و \"ماير\" أن اضطرابات ........ تعد من الأعراض الأولية للفصام:", options: ["الذاكرة.", "التفكير.", "السمع.", "البصر."], correct: 1, explanation: "بلويلر وماير اعتبرا أن اضطرابات التفكير هي من الأعراض الأولية والأساسية للفصام.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يرى \"هندرسون Henderson\" أن التدهور الفصامي هو تدهور في الانفعال ينعكس في اضطرابات أخرى مثل:", options: ["الانسحاب من الواقع والنكوص إلى التفكير الطفلي.", "فقدان الذاكرة طويلة المدى تماماً.", "زيادة الذكاء والقدرة على التركيز.", "الشفاء التلقائي."], correct: 0, explanation: "هندرسون يرى أن التدهور الفصامي هو تدهور في الانفعال ينعكس في الانسحاب من الواقع والنكوص إلى التفكير الطفلي.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يقسم \"سكوتو Scottowo\" الفصام إلى حالات أساسية (عضوية بمرض واضح) وحالات ........ (ذات تكوين خلقي يعجز عن التكيف):", options: ["مخففة.", "شديدة.", "متقدمة.", "مستعصية."], correct: 0, explanation: "سكوتو يقسم الفصام إلى حالات أساسية (عضوية) وحالات مخففة (ذات تكوين خلقي يعجز عن التكيف).", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "وفقاً لنظرية \"ماير وجروس Mayer & Gross\"، أهم ما يُظهر الفصام هو:", options: ["الأفكار التي يعبر عنها المريض فقط.", "شذوذ \"عملية\" التفكير نفسها، كضغط الأفكار أو توقفها دفعة واحدة.", "الانطواء الاجتماعي دون أي خلل عقلي.", "زيادة الذكاء."], correct: 1, explanation: "نظرية ماير وجروس تركز على شذوذ عملية التفكير نفسها (كضغط الأفكار) وليس محتوى الأفكار فقط.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "من مظاهر شذوذ التفكير عند الفصامي استعمال المفاهيم بطريقة ........ بدلاً من المجردة:", options: ["علمية دقيقة.", "عيانية (ملموسة).", "فلسفية.", "منطقية."], correct: 1, explanation: "الفصامي يميل إلى استعمال المفاهيم بطريقة عيانية (ملموسة) بدلاً من المجردة، وهذا من مظاهر شذوذ التفكير.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار \"الفهم (Understanding)\" بمقياس وكسلر، من سمات استجابة الفصامي أنه:", options: ["ينجح في الأسئلة السهلة ويفشل في الصعبة.", "يفشل في الأسئلة السهلة بالرغم من إجابته على الأسئلة الصعبة.", "لا يجيب على أي سؤال إطلاقاً.", "ينجح في جميع الأسئلة."], correct: 1, explanation: "من سمات الفصامي في اختبار الفهم أنه قد يفشل في الأسئلة السهلة بالرغم من نجاحه في بعض الأسئلة الصعبة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يظهر الفصامي في اختبار \"عكس الأرقام (Number reversal)\" بمقياس وكسلر:", options: ["مستوى متوسطاً وطبيعياً جداً كباقي الأفراد.", "تفوقاً قاطعاً في الإعادة بالعكس أو فشلاً قاطعاً وتطبيق طرق جزافية.", "قدرة على عكس الأرقام تصاعدياً فقط.", "رفضاً تاماً للاختبار."], correct: 1, explanation: "الفصامي في اختبار عكس الأرقام يظهر إما تفوقاً قاطعاً أو فشلاً قاطعاً مع تخمين جزافي.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار \"الحساب (Counting)\" بمقياس وكسلر، يلجأ مريض الفصام غالباً إلى:", options: ["الإجابات الدقيقة والسريعة.", "الإجابات التقريبية والخلط في الإجابة، مع الفشل في المسائل السهلة والنجاح في الصعبة.", "استخدام الآلة الحاسبة لضعف ذاكرته.", "رفض الإجابة تماماً."], correct: 1, explanation: "مريض الفصام في اختبار الحساب يلجأ إلى الإجابات التقريبية والخلط، وقد يفشل في السهل وينجح في الصعب.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "استجابة الفصامي في اختبار \"المتشابهات (Analogies)\" تتميز بـ:", options: ["إعطاء أوجه الشبه بدقة متناهية.", "المثابرة على إنكار وجود أوجه شبه أو إعطاء الفروق بدلاً من أوجه الشبه.", "الحصول على درجات عالية جداً تفوق مستوى ذكائه.", "الصمت وعدم الرد."], correct: 1, explanation: "الفصامي في اختبار المتشابهات يميل إلى إنكار أوجه الشبه ويعطي الفروق بدلاً منها.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "الإطالة وإعطاء معاني متعددة وبديلة وتفاصيل غير هامة عند تعريف الكلمات في اختبار المفردات تُسمى:", options: ["الإضافة الزائدة.", "الحذف (Ellipsis).", "التوحد مع الذات.", "الضغط المعرفي."], correct: 0, explanation: "الإضافة الزائدة هي الإطالة وإعطاء معاني متعددة وتفاصيل غير هامة عند تعريف الكلمات.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "عندما يقوم الفصامي بحذف كلمة أو أكثر تكون ضرورية لإكمال المعنى في اختبار المفردات، فإن هذا يُعرف بـ:", options: ["التوحد مع الذات.", "الإضافة الزائدة.", "الحذف (Ellipsis).", "الانحراف المعرفي."], correct: 2, explanation: "الحذف (Ellipsis) هو حذف كلمات ضرورية لإكمال المعنى أثناء الحديث.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "عندما يدمج الفصامي مشاعره الشخصية في تعريف الكلمة، فإن ذلك يُسمى:", options: ["الحذف.", "الإضافة الزائدة.", "التوحد مع الذات (Self-identification).", "الانفصال."], correct: 2, explanation: "التوحد مع الذات (Self-identification) هو إدماج الفصامي لمشاعره الشخصية في تعريف الكلمات.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار \"تصميمات المكعبات (Block-designs)\"، يتميز الفصامي بـ:", options: ["استخدام ألوان غير الأحمر والأبيض والاصرار على أن الرسوم الخاطئة صحيحة.", "العناد الشديد ورفض تغيير الرسم نهائياً عند توجيه الفاحص.", "الدقة الفائقة في نقل التصميم بشكل مطابق.", "السرعة في الإنجاز."], correct: 0, explanation: "الفصامي في اختبار تصميمات المكعبات يتميز بالإصرار على أن الرسوم الخاطئة صحيحة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "السرعة الفائقة في الاستعداد لتغيير الرسم في اختبار المكعبات عند أي إيحاء من الفاحص تعكس:", options: ["ذكاء الفصامي المرتفع.", "نقصاً في الاتصال بالواقع وتدهوراً في التفكير المجرد.", "مرونة فكرية عالية جداً وصحية.", "الرغبة في إرضاء الفاحص."], correct: 1, explanation: "السرعة الفائقة في تغيير الرسم تعكس نقصاً في الاتصال بالواقع وتدهوراً في التفكير المجرد عند الفصامي.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار \"تجميع الأشياء (Grouping/Object Assembly)\"، قد يظهر على المريض الفصامي:", options: ["سرعة إدراك الكليات وتجميعها في ثوانٍ.", "عدم التعرف على الوجه أو اليد بعد تجميع أجزائها، وتقبل مقترحات غريبة كعكس الذراعين.", "رفض لمس القطع بسبب الهلاوس البصرية.", "الدقة التامة في التجميع."], correct: 1, explanation: "الفصامي في اختبار تجميع الأشياء قد يفشل في التعرف على الوجه بعد تجميعه ويقبل مقترحات غريبة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
    {text: "يُطلق على الاضطرابات والحالات الشبه فصامية التي تتدرج من بعض اضطرابات الشخصية إلى اضطرابات ذهانية معينة اسم:", options: ["الاضطرابات الطبقية الفصامية (Schizophrenic spectrum).", "اضطرابات القلق العام.", "اضطرابات المزاج ثنائية القطب.", "الاضطرابات الانفصالية."], correct: 0, explanation: "الاضطرابات الطبقية الفصامية (Schizophrenic spectrum) هي التي تتدرج من اضطرابات الشخصية إلى الذهانية.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "\"فقدان الوحدة الداخلية للعقل والعاطفة والإرادة، بحيث يؤدي الشخص وظائفه مثل أوركسترا بدون قائد\".. هذا الوصف قدمه العالم:", options: ["سيجموند فرويد.", "كريبلين.", "كالباوم.", "بلويلر."], correct: 2, explanation: "كالباوم وصف الفصام بأنه يعمل مثل \"أوركسترا بدون قائد\" بسبب فقدان الوحدة الداخلية للعقل والعاطفة والإرادة.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "من خصائص اختبار \"رموز الأرقام (Digit symbols)\" لدى الفصاميين:", options: ["تكرار أخطاء النقل، قلب الرموز، وترك مسافات خالية.", "السرعة الثابتة والمستقرة طوال الاختبار.", "الدقة التامة في رسم الرموز دون تحريف.", "الإنجاز السريع بدون أخطاء."], correct: 0, explanation: "الفصاميين في اختبار رموز الأرقام يتصفون بتكرار أخطاء النقل وقلب الرموز وترك مسافات خالية.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "رغم أن \"بلويلر\" اعتقد باحتمالية وجود أساس عضوي للفصام، إلا أنه ركز بشكل رئيسي على:", options: ["التدهور العقلي الحتمي.", "الميكانيزمات النفسية التي تؤدي إلى تطور الأعراض.", "دور الوراثة حصراً.", "العوامل البيئية فقط."], correct: 1, explanation: "بلويلر ركز على الميكانيزمات النفسية التي تؤدي إلى تطور أعراض الفصام، مثل الإسقاط والنكوص.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "الفصام يُعد إعاقة زائدة في:", options: ["مستوى الذكاء الفطري (IQ).", "اختبار الواقع (وأحياناً خلق واقع جديد).", "القدرات البدنية والمهارات الحركية.", "الذاكرة طويلة المدى."], correct: 1, explanation: "الفصام يُعد إعاقة في اختبار الواقع، حيث يخلق المريض واقعاً جديداً خاصاً به.", category: "mcq", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يُعتبر الفصام من أكثر أشكال الذهان انتشاراً ورغم ذلك لا يزال الخبراء يفتقدون لمحكات صادقة تماماً لتشخيصه.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصام هو أكثر أشكال الذهان انتشاراً ولا يزال التشخيص يعتمد على مجموعة الأعراض السريرية.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "الفصام يعني ازدواج الشخصية، أي أن ينقسم المريض إلى شخصيتين منفصلتين تماماً يتعامل بهما مع الناس.", options: ["صح", "خطأ"], correct: 1, explanation: "الفصام لا يعني ازدواج الشخصية، بل يعني انقسام الوظائف النفسية داخل شخصية واحدة.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "أطلق \"موريل\" مصطلح \"الخبل المبكر\" على مريض أظهر تدهوراً عقلياً وميلاً للعزلة في سن الرابعة عشر.", options: ["صح", "خطأ"], correct: 0, explanation: "موريل أطلق هذا المصطلح على فتى في سن 14 أظهر تدهوراً عقلياً وميلاً للعزلة.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "مصطلح \"البارانويا\" الذي وضعه كالباوم عام 1873 يعني ذهان الهذاءات أو انحراف العقل.", options: ["صح", "خطأ"], correct: 0, explanation: "كالباوم أطلق مصطلح البارانويا للإشارة إلى ذهان الهذاءات وانحراف العقل.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "اعتمد \"كريبلين\" في تشخيص الخبل المبكر على الميكانيزمات النفسية اللاشعورية ورفض فكرة الأساس العضوي.", options: ["صح", "خطأ"], correct: 1, explanation: "كريبلين اعتمد على التدهور العقلي والأساس العضوي وليس الميكانيزمات النفسية.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "مصطلح \"الفصام Schizophrenia\" الذي قدمه بلويلر يشير إلى انقسام أو تنافر بين الوظائف النفسية المختلفة داخل شخصية واحدة.", options: ["صح", "خطأ"], correct: 0, explanation: "بلويلر قدم مصطلح الفصام للإشارة إلى انقسام الوظائف النفسية وليس الشخصية.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "اعترض \"بلويلر\" على مصطلح \"جنون المراهقة\" لأن الاضطراب لا يبدأ دائماً في المراهقة ولا يؤدي بالضرورة للتدهور.", options: ["صح", "خطأ"], correct: 0, explanation: "بلويلر عارض هذا المصطلح لأن الفصام لا يبدأ دائماً في المراهقة ولا ينتهي بالضرورة بالتدهور.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يعيش مريض الفصام في عالم وهمي خيالي يمتلك فيه قدرات خارقة وسلطاناً مطلقاً للفكر.", options: ["صح", "خطأ"], correct: 0, explanation: "مريض الفصام يعيش في عالم وهمي خاص به يمتلك فيه قدرات خارقة حسب رأي أحمد فائق.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "الفصاميون لديهم نفس الأعراض تماماً ولا يوجد أي اختلاف بين مريض فصامي وآخر.", options: ["صح", "خطأ"], correct: 1, explanation: "الفصاميون يختلفون في أعراضهم وشدة اضطرابهم من مريض لآخر.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "اتفق بلويلر وماير مع كريبلين في اعتبار اضطرابات التفكير من الأعراض الأولية للفصام.", options: ["صح", "خطأ"], correct: 0, explanation: "بلويلر وماير اعتبرا اضطرابات التفكير من الأعراض الأولية والأساسية للفصام.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "اعتبر \"هندرسون\" أن التدهور الفصامي هو تدهور في الذاكرة بالأساس وليس في الانفعال.", options: ["صح", "خطأ"], correct: 1, explanation: "هندرسون اعتبر التدهور في الانفعال هو الأساس وليس الذاكرة.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "الحالات \"المخففة من الفصام\" عند \"سكوتو\" هي حالات ناتجة عن تكوين خلقي يعجز فيه الفرد عن التكيف مع بعض المواقف دون أساس عضوي مرضي واضح.", options: ["صح", "خطأ"], correct: 0, explanation: "الحالات المخففة عند سكوتو هي ذات تكوين خلقي يعجز عن التكيف دون أساس عضوي واضح.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "يرى \"ماير وجروس\" أن شذوذ عملية التفكير (مثل ضغط الأفكار أو توقفها) أهم من الأفكار التي يعبر عنها المريض.", options: ["صح", "خطأ"], correct: 0, explanation: "نظرية ماير وجروس تركز على شذوذ عملية التفكير نفسها.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "من مظاهر شذوذ التفكير عند الفصامي تأثر الأفكار بالأسجاع الكلامية والمشابهات والمعاني الرمزية الغريبة.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصامي تتأثر أفكاره بالأسجاع الكلامية والمعاني الرمزية الغريبة.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في مقياس وكسلر، يفشل مريض الفصام في الإجابة عن الأسئلة الصعبة جداً بينما ينجح دائماً في الأسئلة السهلة المباشرة.", options: ["صح", "خطأ"], correct: 1, explanation: "قد يفشل الفصامي في السهل وينجح في الصعب، وهذا من خصائص الاضطراب الفصامي.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار المتشابهات، يميل مريض الفصام إلى المبالغة في العمومية وإنكار أوجه الشبه معطياً الفروق بدلاً منها.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصامي يميل إلى إنكار أوجه الشبه وإعطاء الفروق بدلاً منها.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "\"الإضافة الزائدة\" تعني قيام مريض الفصام بحذف كلمات ضرورية لإكمال معنى الجملة أثناء الحديث.", options: ["صح", "خطأ"], correct: 1, explanation: "الإضافة الزائدة تعني الإطالة وإعطاء معاني متعددة، أما حذف الكلمات فهو \"الحذف (Ellipsis)\".", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار تصميمات المكعبات، يتمسك الفصامي برأيه بقوة ويرفض أي إيحاء من الفاحص بتغيير الرسم الخاطئ.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصامي يتمسك برأيه ويصر على صحة الرسم الخاطئ.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "قد يفشل الفصامي في اختبار تجميع الأشياء في التعرف على شكل الوجه أو اليد حتى بعد أن يقوم بتجميع أجزائها.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصامي قد يفشل في التعرف على الشكل بعد تجميع أجزائه.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "في اختبار رموز الأرقام، يتفاوت الفصامي في سرعة العمل ويقوم بتحريف كبير في الرموز وترك مسافات خالية.", options: ["صح", "خطأ"], correct: 0, explanation: "الفصامي في اختبار رموز الأرقام يحرّف الرموز ويترك مسافات خالية.", category: "truefalse", chapter: "الفصل الثالث: الفصام والاضطرابات الذهانية"},
  {text: "تعتبر دراسة سيكولوجية الشخصية من الدراسات الهامة حتى أن البعض يعتبرها:", options: ["فرعاً ثانوياً في علم النفس.", "القاسم المشترك وصلب كل فروع علم النفس الأخرى.", "تقتصر فقط على علم النفس الصناعي.", "غير مهمة في الفهم الإكلينيكي."], correct: 1, explanation: "دراسة الشخصية تعتبر القاسم المشترك وصلب كل فروع علم النفس الأخرى لأنها تتداخل مع معظم المجالات.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يُعرّف ........ الشخصية بأنها \"التنظيم الدينامي في الفرد لتلك الأجهزة الجسمية النفسية التي تحدد مطابقة الفرد في التوافق مع بيئته\":", options: ["شيلدون.", "بيرت.", "ألبورت.", "كود."], correct: 2, explanation: "ألبورت (Allport) عرّف الشخصية بأنها التنظيم الدينامي للأجهزة الجسمية النفسية التي تحدد توافق الفرد مع بيئته.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "ذهب \"شيلدون\" إلى القول بوجود ثلاثة أنماط أساسية للتكوين الجسمي، وهي التركيب الحشوي، والجلدي، والتركيب:", options: ["العصبي.", "العظمي.", "العضلي.", "الهضمي."], correct: 1, explanation: "شيلدون حدد ثلاثة أنماط للتكوين الجسمي: الحشوي، الجلدي، والعظمي (أو العضلي).", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يُعرّف ........ الشخصية بأنها \"النظام الكامل من الميول والاستعدادات الجسمية والعقلية الثابتة نسبياً، والتي يتحدد بمقتضاها أسلوبه في التكيف\":", options: ["بيرت.", "شيلدون.", "ألبورت.", "كود."], correct: 0, explanation: "بيرت (Burt) عرّف الشخصية بأنها النظام الكامل من الميول والاستعدادات الثابتة نسبياً التي تحدد أسلوب التكيف.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "اضطرابات الشخصية هي نماذج سلوكية مستمرة وعميقة تظهر على شكل ردود واستجابات ........ في مدى واسع من المواقف:", options: ["مرنة وسريعة التكيف.", "غير مرنة.", "مؤقتة وعابرة.", "متغيرة باستمرار."], correct: 1, explanation: "اضطرابات الشخصية تتميز بكونها غير مرنة (صلبة) ومستمرة في مدى واسع من المواقف.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تتضح اضطرابات الشخصية من خلال الانحراف الواضح عما هو سائد في ........ فيما يتعلق بالإدراك والتفكير:", options: ["ثقافة الفرد.", "طموح الفرد.", "ذكاء الفرد.", "عمر الفرد."], correct: 0, explanation: "اضطرابات الشخصية تتضح من خلال الانحراف عن ما هو سائد في ثقافة الفرد فيما يتعلق بالإدراك والتفكير.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "من المعايير التشخيصية لاضطرابات الشخصية وجود نمط دائم من الخبرة يحيد عن المعايير في مجال \"المعرفة\"، والذي يتعلق بـ:", options: ["الانفعالات الشديدة والتأرجح.", "عدم التحكم في السلوك المندفع.", "طريقة إدراك وفهم الذات وفهم الآخرين والأحداث.", "القدرات الذهنية."], correct: 2, explanation: "مجال المعرفة يتعلق بطريقة إدراك وفهم الذات والآخرين والأحداث.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "النمط الدائم الذي يظهر في اضطرابات الشخصية يمكن تعقب بدايته من الماضي بداية من مرحلة:", options: ["الطفولة المبكرة جداً.", "المراهقة وبداية سن الرشد.", "منتصف العمر (سن الأربعين).", "الشيخوخة."], correct: 1, explanation: "اضطرابات الشخصية يمكن تعقب بدايتها من مرحلة المراهقة وبداية سن الرشد.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يُشترط لتشخيص اضطراب الشخصية أن يكون النمط السلوكي:", options: ["راجعاً لأسباب فسيولوجية كتعاطي المخدرات.", "يؤدي إلى الشعور بالكدر والاختلال في الأداء الاجتماعي أو المهني.", "ناتجاً عن إصابة حديثة في الدماغ.", "مؤقتاً وعابراً."], correct: 1, explanation: "يُشترط أن يؤدي النمط السلوكي إلى الشعور بالكدر والاختلال في الأداء الاجتماعي أو المهني.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تواتر اضطرابات الشخصية بين العائلات الواحدة يُشير إلى دور العوامل ........ في تسبيبها:", options: ["الوراثية.", "البيئية.", "العضوية.", "الثقافية."], correct: 0, explanation: "تواتر اضطرابات الشخصية في العائلات يُشير إلى دور العوامل الوراثية الجينية.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "الافراط في التدليل، والافتقار إلى القيم الخلقية، والتذبذب بين القسوة والتدليل يُصنف ضمن الأسباب ........ لاضطرابات الشخصية:", options: ["العضوية.", "الوراثية.", "البيئية.", "الجينية."], correct: 2, explanation: "هذه العوامل من الأسباب البيئية (التنشئة) التي تساهم في اضطرابات الشخصية.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تبين لبعض الباحثين أن عدم نضج السلوك يساير عدم نضج المخ ويظهر في رسم المخ الكهربي، وهذا يتضح جلياً في اضطراب الشخصية:", options: ["التجنبية.", "المعادية للمجتمع (المضادة للمجتمع).", "الاعتمادية.", "البارانويدية."], correct: 1, explanation: "عدم نضج السلوك والمخ يظهر بوضوح في اضطراب الشخصية المعادية للمجتمع (Antisocial).", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تأثير اضطرابات الشخصية على الكيفية التي يؤدي بها الشخص عمله، ويتخذ بها قراراته، ويستجيب للنقد، يندرج تحت مجال:", options: ["الذات.", "العلاقات البينشخصية.", "العمل.", "المعرفة."], correct: 2, explanation: "تأثير اضطرابات الشخصية على أداء العمل واتخاذ القرار واستجابة النقد يندرج تحت مجال العمل.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تأثير اضطرابات الشخصية على قدرة الفرد على الاستجابة للعالم من حوله بطريقة صحيحة يندرج تحت مجال:", options: ["المشاعر.", "ضبط الدوافع.", "إدراك الواقع.", "العلاقات."], correct: 2, explanation: "الاستجابة للعالم من حوله بطريقة صحيحة يندرج تحت مجال إدراك الواقع.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يُعرّف \"كود\" (1953) ........ بأنها مشكلة تشمل الأطفال الذين لا يعتمدون على أنفسهم:", options: ["الاتكالية (الاعتمادية).", "النرجسية.", "الاندفاعية.", "العدوانية."], correct: 0, explanation: "كود (1953) عرّف الاتكالية بأنها مشكلة تشمل الأطفال الذين لا يعتمدون على أنفسهم.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "حالة طلب الفرد مساعدة الآخرين أو الدعم المادي منهم لضعف ثقته بنفسه تُعرّف وفقاً لـ \"انكلش وانكلش\" بأنها:", options: ["اضطراب الشخصية المعادية للمجتمع.", "الاتكالية.", "اضطراب الهوية.", "النرجسية."], correct: 1, explanation: "انكلش وانكلش عرّفا الاتكالية بطلب مساعدة الآخرين لضعف الثقة بالنفس.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يتصف الشخص ذو الشخصية الاعتمادية (الاتكالية) بجميع ما يلي *ما عدا*:", options: ["السلبية والتشاؤم والخمول.", "المبادرة والقدرة على القيادة.", "الاستسلام للآخرين لإدارة شؤون حياته.", "الخوف من الوحدة."], correct: 1, explanation: "الشخص الاعتمادي يتصف بالسلبية وعدم المبادرة، ولا يتمتع بالقدرة على القيادة.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "في الشخصية الاعتمادية، يتم اتخاذ القرارات المهمة والأساسية في حياة الفرد من قِبل:", options: ["الفرد نفسه بعد تفكير عميق.", "الآخرين.", "الفرد نفسه بشجاعة واستقلالية.", "بمشورة الأصدقاء فقط."], correct: 1, explanation: "في الشخصية الاعتمادية، يترك الفرد اتخاذ القرارات المهمة للآخرين.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "من خصائص الشخص الاعتمادي أنه ........ آراء وأفكار الآخرين حتى لو كان مقتنعاً بأنهم على خطأ:", options: ["يعارض.", "يتجاهل.", "يوافق على.", "ينتقد."], correct: 2, explanation: "الشخص الاعتمادي يوافق على آراء الآخرين حتى لو كان يعتقد أنهم على خطأ.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "الشخص ذو الاضطراب الاعتمادي يقبل تنفيذ طلبات الآخرين حتى وإن كانت مزعجة له بهدف:", options: ["إرضاء الآخرين.", "الحصول على ترقية.", "استغلالهم لاحقاً.", "إثبات قدراته."], correct: 0, explanation: "الشخص الاعتمادي يقبل طلبات الآخرين المزعجة لإرضائهم وكسب دعمهم.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "ردود فعل الشخص الاعتمادي عندما تصل علاقاته بالآخرين إلى القطيعة النهائية تكون غالباً:", options: ["هادئة ولا يبالي.", "عنيفة وشديدة.", "إيجابية ومحفزة للتغيير.", "متقبلة للواقع."], correct: 1, explanation: "رد فعل الشخص الاعتمادي عند القطيعة النهائية تكون عنيفة وشديدة لأنه يعتمد على الآخرين بشكل مفرط.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يتميز مريض الشخصية الاعتمادية بأنه ........ الوحدة:", options: ["يستمتع بـ.", "لا يتحمل.", "يبحث دائماً عن.", "يتقبلها بسهولة."], correct: 1, explanation: "الشخص الاعتمادي لا يتحمل الوحدة ويشعر بالقلق عند تركه بمفرده.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "وجدت العديد من الدراسات أن هناك علاقة موجبة بين الاتكالية و ........ بسبب إعاقة دوافع الفرد من التحقق:", options: ["العدوان.", "الذكاء.", "التسامح.", "المرونة."], correct: 0, explanation: "توجد علاقة موجبة بين الاتكالية والعدوان بسبب إعاقة دوافع الفرد من تحقيق ذاته.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "في دراسة \"باندورا\"، توصل إلى أن الإفراط والتذبذب في ........ الوالدية تثبتان الاتكالية عند الأطفال:", options: ["الدفء والعاطفة.", "العقاب البدني.", "التجاهل التام.", "الإعطاء المادي."], correct: 0, explanation: "باندورا وجد أن التذبذب في الدفء والعاطفة الوالدية يثبت الاتكالية عند الأطفال.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "دلت الدراسات على أن غياب الأب له أثر في ........ السلوك الاتكالي مقارنة بالأطفال الذين لم يغب آباؤهم:", options: ["تقليل.", "زيادة.", "انعدام.", "عدم تأثير."], correct: 1, explanation: "غياب الأب يؤدي إلى زيادة السلوك الاتكالي لدى الأطفال.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
    {text: "توصلت دراسة \"معروف\" (1972) إلى أن أطفال الطبقة ........ يظهرون اتكالاً قليلاً أو لا يظهرون:", options: ["الفقيرة.", "المتوسطة.", "العالية.", "الكادحة."], correct: 0, explanation: "دراسة معروف وجدت أن أطفال الطبقة الفقيرة يظهرون اتكالاً قليلاً أو معدوماً.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "حسب دراسة \"معروف\" (1972)، الأطفال الذين يظهرون كثيراً من الاتكال هم غالباً من الطبقتين:", options: ["الفقيرة والمتوسطة.", "المتوسطة والعالية.", "الفقيرة والمعدمة.", "العالية والكادحة."], correct: 1, explanation: "أطفال الطبقة المتوسطة والعالية هم من يظهرون كثيراً من الاتكال حسب دراسة معروف.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "توصلت دراسة \"عقراوي\" (1965) إلى أن أطفال الأمهات اللواتي ينتمين للطبقة ........ يريدون كثيراً من الانتباه:", options: ["العالية.", "المنخفضة.", "المتوسطة.", "الفقيرة."], correct: 0, explanation: "دراسة عقراوي وجدت أن أطفال أمهات الطبقة العالية يريدون كثيراً من الانتباه.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "وُجد أن السلوك الاتكالي يتأثر بمتغير الجنس، حيث إن المجتمع يتسامح مع ........ الاتكالية:", options: ["البنت.", "الولد.", "البنت والولد على حد سواء.", "لا يتسامح مع أي منهما."], correct: 0, explanation: "المجتمع يتسامح مع الاتكالية لدى البنات أكثر من الولد.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تؤدي النزعة الاتكالية إلى شعور الفرد بـ ........ عند شعوره بأنه مهجور:", options: ["الاستقلالية.", "القلق.", "السعادة.", "الراحة."], correct: 1, explanation: "النزعة الاتكالية تؤدي إلى شعور الفرد بالقلق عند شعوره بالهجران أو التخلي.", category: "mcq", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تُعد دراسة سيكولوجية الشخصية القاسم المشترك لمعظم فروع علم النفس الأخرى كعلم النفس الاجتماعي والإكلينيكي.", options: ["صح", "خطأ"], correct: 0, explanation: "دراسة الشخصية هي القاسم المشترك لمعظم فروع علم النفس.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "سلوك الفرد في المواقف الاجتماعية هو مجرد انعكاس للبيئة ولا علاقة له بشخصيته وتصوراته الداخلية.", options: ["صح", "خطأ"], correct: 1, explanation: "السلوك مرتبط بالشخصية والتصورات الداخلية وليس بالبيئة فقط.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "عرّف \"ألبورت\" الشخصية بأنها التنظيم الدينامي في الفرد للأجهزة الجسمية النفسية التي تحدد توافقه مع بيئته.", options: ["صح", "خطأ"], correct: 0, explanation: "هذا هو تعريف ألبورت للشخصية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "اضطرابات الشخصية هي استجابات مرنة وسريعة التكيف تتغير بسهولة حسب الموقف الاجتماعي.", options: ["صح", "خطأ"], correct: 1, explanation: "اضطرابات الشخصية تتميز بكونها غير مرنة وصلبة.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "من معايير تشخيص اضطرابات الشخصية أن يكون النمط السلوكي غير متداخل ولا تنطبق أعراضه على الاضطرابات النفسية الأخرى.", options: ["صح", "خطأ"], correct: 0, explanation: "يُشترط أن يكون النمط السلوكي مميزاً وغير مرتبط باضطرابات نفسية أخرى.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يمكن تشخيص اضطراب الشخصية إذا كان النمط السلوكي ناتجاً بشكل مباشر عن تعاطي المخدرات أو إصابة حديثة في الدماغ.", options: ["صح", "خطأ"], correct: 1, explanation: "يُستبعد التشخيص إذا كان النمط ناتجاً عن تعاطي مخدرات أو إصابة دماغية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "الوراثة لا تلعب أي دور في الإصابة باضطرابات الشخصية.", options: ["صح", "خطأ"], correct: 1, explanation: "الوراثة تلعب دوراً مهماً في الإصابة باضطرابات الشخصية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "عدم نضج المخ (كما يظهر في رسم المخ الكهربي) يُعد من الأسباب العضوية التي رُصدت في اضطراب الشخصية المعادية للمجتمع.", options: ["صح", "خطأ"], correct: 0, explanation: "عدم نضج المخ سبب عضوي مرتبط بالشخصية المعادية للمجتمع.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "تؤثر اضطرابات الشخصية على مجال العلاقات البينشخصية مما يؤذي الصداقات ويمنع الفرد من إدارة حياة أسرية صحية.", options: ["صح", "خطأ"], correct: 0, explanation: "اضطرابات الشخصية تؤثر بشكل كبير على العلاقات البينشخصية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "الشخص ذو الشخصية الاعتمادية يتسم بالنشاط والمبادرة واتخاذ القرارات الحاسمة في حياته اليومية بصورة مستقلة.", options: ["صح", "خطأ"], correct: 1, explanation: "الشخص الاعتمادي يتسم بالسلبية وعدم المبادرة وعدم الاستقلالية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يوافق الشخص الاتكالي على آراء وأفكار الآخرين حتى لو كان مقتنعاً في داخله بأنهم على خطأ.", options: ["صح", "خطأ"], correct: 0, explanation: "الشخص الاتكالي يوافق على آراء الآخرين لتجنب النزاع والحفاظ على العلاقات.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يقبل المريض بالاضطراب الاعتمادي تنفيذ طلبات الآخرين المزعجة له فقط من أجل إرضائهم.", options: ["صح", "خطأ"], correct: 0, explanation: "يقبل الاتكالي تنفيذ طلبات الآخرين المزعجة بهدف إرضائهم وكسب دعمهم.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يتحمل الشخص الاعتمادي الوحدة بسهولة ولا يشعر بالقلق أبداً عند تركه بمفرده.", options: ["صح", "خطأ"], correct: 1, explanation: "الشخص الاعتمادي لا يتحمل الوحدة ويشعر بالقلق عند تركه بمفرده.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يتألم الشخص الاعتمادي بسهولة شديدة عند تعرضه للنقد أو الإهمال من الآخرين.", options: ["صح", "خطأ"], correct: 0, explanation: "الشخص الاعتمادي يتألم بسهولة شديدة عند النقد أو الإهمال.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "أوضحت الدراسات وجود علاقة سالبة وعكسية بين الاتكالية والعدوان.", options: ["صح", "خطأ"], correct: 1, explanation: "العلاقة بين الاتكالية والعدوان هي علاقة موجبة (طردية) وليست سالبة.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "الدفء والتقبل المعتدل من الأبوين يؤدي إلى تكوين سمات شخصية مرغوبة كالمشاركة وقوة الضمير.", options: ["صح", "خطأ"], correct: 0, explanation: "الدفء والتقبل المعتدل يساعد في تكوين شخصية سوية.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "غياب الأب في الأسرة يقلل من ظهور السلوك الاتكالي لدى الأطفال مقارنة بالأطفال الذين يعيشون مع آبائهم.", options: ["صح", "خطأ"], correct: 1, explanation: "غياب الأب يزيد من ظهور السلوك الاتكالي وليس يقلله.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "بينت دراسة \"معروف\" أن أطفال الطبقة الفقيرة يُظهرون الكثير من الاتكال مقارنة بأطفال الطبقة العالية.", options: ["صح", "خطأ"], correct: 1, explanation: "أطفال الطبقة الفقيرة يظهرون اتكالاً قليلاً أو معدوماً.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "أكدت دراسة \"عقراوي\" أن أطفال الأمهات من الطبقة العالية يطلبون اهتماماً وانتباهاً أكثر من أطفال الطبقة المنخفضة.", options: ["صح", "خطأ"], correct: 0, explanation: "دراسة عقراوي أكدت أن أطفال أمهات الطبقة العالية يطلبون اهتماماً أكثر.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يتسامح المجتمع عادة مع الولد الاتكالي أكثر بكثير مما يتسامح مع البنت الاتكالية.", options: ["صح", "خطأ"], correct: 1, explanation: "المجتمع يتسامح مع البنت الاتكالية أكثر من الولد.", category: "truefalse", chapter: "الفصل الرابع: اضطرابات الشخصية"},
  {text: "يُعد ........ أمراً بالغ الأهمية لرفاهية الأطفال وأسرهم في حالة اضطرابات النمو:", options: ["الكشف المبكر.", "العزل الاجتماعي.", "العلاج بالصدمات الكهربائية.", "التجاهل."], correct: 0, explanation: "الكشف المبكر عن اضطرابات النمو أمر بالغ الأهمية لرفاهية الأطفال وأسرهم.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الكشف المبكر عن اضطرابات النمو يُعد وظيفة متكاملة للرعاية الصحية الأولية ومسؤولية:", options: ["الوالدين فقط.", "جميع المتخصصين في الرعاية الصحية للأطفال.", "معلمي المدارس الابتدائية حصراً.", "الأطباء النفسيين فقط."], correct: 1, explanation: "الكشف المبكر مسؤولية جميع المتخصصين في الرعاية الصحية للأطفال وليس فئة واحدة.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تأخر النمو أو اضطرابه قد يشير إلى:", options: ["زيادة مستوى الذكاء بشكل يفوق المعدل.", "زيادة خطر حدوث مضاعفات طبية أو اضطرابات سلوكية.", "عدم الحاجة لأي تدخل علاجي.", "صحة مثالية."], correct: 1, explanation: "تأخر النمو قد يشير إلى زيادة خطر حدوث مضاعفات طبية أو اضطرابات سلوكية.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "المصطلحات \"تأخر النمو\"، \"النمو المضطرب\"، و\"الشذوذ النمائي\" تُستخدم:", options: ["كمصطلحات متناقضة.", "بشكل مترادف (تحمل نفس المعنى).", "للتعبير عن أمراض كبار السن فقط.", "للوصف السريري فقط."], correct: 1, explanation: "هذه المصطلحات تُستخدم بشكل مترادف وتحمل نفس المعنى العام.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "مصطلح \"اضطراب النمو\" أو \"الإعاقة النمائية\" يشير إلى إعاقة ........ في مرحلة الطفولة تؤدي لقيود وظيفية كبيرة:", options: ["عقلية أو جسدية.", "بصرية فقط.", "سمعية فقط.", "حركية فقط."], correct: 0, explanation: "اضطراب النمو يشير إلى إعاقة عقلية أو جسدية تؤدي لقيود وظيفية كبيرة.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "أول دراسة وبائية عن مرض التوحد عند الأطفال تم نشرها في:", options: ["الولايات المتحدة الأمريكية.", "المملكة المتحدة.", "ألمانيا.", "السويد."], correct: 1, explanation: "أول دراسة وبائية عن التوحد نُشرت في المملكة المتحدة.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "في السبعينيات، كان اضطراب التوحد يُعتبر حالة نادرة جداً، حيث بلغ معدل انتشاره حوالي:", options: ["2 لكل 10,000 طفل.", "10 لكل 1,000 طفل.", "116 لكل 10,000 طفل.", "500 لكل 10,000 طفل."], correct: 0, explanation: "في السبعينيات كان معدل انتشار التوحد 2 لكل 10,000 طفل.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "أظهر المسح الإنجليزي المنشور عام 2006 (والذي شمل أطفالاً بين 9 و 10 سنوات) أن معدل انتشار الاضطرابات النمائية الشاملة (PDD) ارتفع ليصبح:", options: ["2 لكل 10,000 شخص.", "116.1 لكل 10,000 شخص.", "500 لكل 10,000 شخص.", "50 لكل 10,000 شخص."], correct: 1, explanation: "المسح الإنجليزي عام 2006 أظهر أن معدل انتشار اضطرابات النمائية الشاملة ارتفع إلى 116.1 لكل 10,000.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الارتفاع الواضح في معدلات الإصابة بالتوحد بدءاً من التسعينيات قد يرجع إلى:", options: ["زيادة فعلية في المرض فقط.", "اختلافات منهجية في التشخيص وزيادة الوعي العام.", "انتشار الفيروسات.", "تلوث بيئي حاد."], correct: 1, explanation: "الارتفاع قد يرجع إلى اختلافات منهجية في التشخيص وزيادة الوعي العام وتوسيع المفاهيم.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "حددت منظمة الصحة العالمية (WHO) ........ كواحدة من اضطرابات النمو المنتشرة (طيف التوحد):", options: ["متلازمة داون.", "متلازمة أسبرجر.", "التخلف العقلي الشديد.", "الفصام."], correct: 1, explanation: "منظمة الصحة العالمية حددت متلازمة أسبرجر كواحدة من اضطرابات النمو المنتشرة.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تتصف متلازمة أسبرجر بـ:", options: ["ضعف التفاعل الاجتماعي والتواصل غير اللفظي.", "الشلل النصفي وصعوبة المشي.", "فقدان الذاكرة والهلاوس.", "تأخر شديد في الكلام والذكاء."], correct: 0, explanation: "متلازمة أسبرجر تتصف بضعف التفاعل الاجتماعي مع احتفاظ نسبي باللغة والذكاء.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تم وصف \"اضطراب ريت\" لأول مرة باللغة الألمانية عام 1966م من قِبل طبيب الأطفال:", options: ["ثيودور هيلر.", "أندرياس ريت.", "بينجت هاجبرج.", "ليو كانر."], correct: 1, explanation: "أندرياس ريت وصف اضطراب ريت لأول مرة بالألمانية عام 1966.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
