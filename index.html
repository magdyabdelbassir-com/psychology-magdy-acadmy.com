          6: {

        // --- المكون الرئيسي ---
        function App() {
          const [currentChapter, setCurrentChapter] = useState(null);
          const [viewState, setViewState] = useState('intro'); // 'intro', 'home', 'summary', 'quiz', 'result'
          const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
          const [score, setScore] = useState(0);
          
          // Modal State
          const [showFeedback, setShowFeedback] = useState(false);
          const [isCorrect, setIsCorrect] = useState(false);
          const [selectedOptionText, setSelectedOptionText] = useState('');
          const [feedbackMeme, setFeedbackMeme] = useState({text: '', emoji: ''});

          // رابط اللوجو الخاص بك (إذا رفعته على موقع رفع صور استبدل هذا الرابط)
          const logoUrl = "Untitled%20design%20(5).jpg"; 

          const handleStartChapter = (ch) => {
            setCurrentChapter(ch);
            setViewState('summary');
          };

          const startQuiz = () => {
            setCurrentQuestionIdx(0);
            setScore(0);
            setViewState('quiz');
          };

          const handleOptionClick = (optionIdx, optionText) => {
            const chapterData = chaptersData[currentChapter];
            const currentQ = chapterData.questions[currentQuestionIdx];
            const correctIdx = currentQ[2];
            
            const correct = optionIdx === correctIdx;
            setIsCorrect(correct);
            setSelectedOptionText(optionText);
            setFeedbackMeme(getRandomMeme(correct));
            
            if (correct) {
              setScore(score + 1);
            }
            
            setShowFeedback(true);
          };

          const handleNextQuestion = () => {
            setShowFeedback(false);
            const chapterData = chaptersData[currentChapter];
            if (currentQuestionIdx + 1 < chapterData.questions.length) {
              setCurrentQuestionIdx(currentQuestionIdx + 1);
            } else {
              setViewState('result');
            }
          };

          const resetHome = () => {
            setCurrentChapter(null);
            setViewState('home');
          };

          return (
            <div className="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-white to-purple-50 font-sans text-slate-800 flex flex-col" dir="rtl">
              
              {/* Header */}
              {viewState !== 'intro' && (
                <header className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 shadow-lg sticky top-0 z-10">
                  <div className="max-w-4xl mx-auto flex justify-between items-center">
                    <div className="flex items-center gap-3 cursor-pointer" onClick={resetHome}>
                      <div className="bg-white p-1 rounded-full overflow-hidden w-10 h-10 shadow-sm flex items-center justify-center relative">
                         <img 
                            src={logoUrl}
                            alt="Logo" 
                            className="w-full h-full object-cover" 
                            onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }}
                         />
                         <Brain size={24} className="text-indigo-600 hidden" />
                      </div>
                      <h1 className="text-2xl font-bold tracking-wide text-white">منصة تدريب مادة مناهج بحث </h1>
                    </div>
                    {currentChapter && viewState !== 'home' && (
                      <button onClick={resetHome} className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-full transition-all flex items-center gap-2 text-sm font-bold shadow-sm hover:shadow-md">
                        <RotateCcw size={16} /> الرئيسية
                      </button>
                    )}
                  </div>
                </header>
              )}

              <main className="flex-1 w-full max-w-4xl mx-auto p-4 sm:p-6 pb-24 relative">
                
                {/* --- واجهة الإنترو الجذابة --- */}
                {viewState === 'intro' && (
                  <div className="flex flex-col items-center justify-center min-h-[85vh] animate-fade-in px-4">
                    <div className="relative mb-10 transform hover:scale-110 transition-transform duration-700 cursor-pointer flex justify-center items-center">
                      <div className="absolute inset-0 bg-purple-500 blur-2xl opacity-30 rounded-full animate-pulse"></div>
                      <img 
                        src={logoUrl}
                        alt="Magdy Abdel Basir Logo" 
                        className="w-64 h-64 md:w-80 md:h-80 object-contain relative z-10 drop-shadow-2xl rounded-full bg-white/40 p-2" 
                        onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
                      />
                      <div className="hidden flex-col items-center justify-center w-64 h-64 md:w-80 md:h-80 bg-white/80 rounded-full relative z-10 drop-shadow-2xl">
                         <Brain size={80} className="text-indigo-600 mb-4" />
                         <span className="font-bold text-indigo-900 text-xl">Magdy Abdel Basir</span>
                      </div>
                    </div>
                    <h1 className="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-6 text-center animate-slide-up">
                      منصة الباحث الشامل
                    </h1>
                    <p className="text-lg md:text-xl text-slate-600 mb-10 text-center max-w-lg leading-relaxed animate-fade-in delay-150">
                       استعد لإتقان مناهج البحث العلمي وتذكر ان السعي منا و التوفيق من الله! 🧠✨
                    </p>
                    <button
                      onClick={() => setViewState('home')}
                      className="px-10 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-full font-bold text-xl shadow-xl shadow-indigo-200 hover:shadow-indigo-400 transform hover:-translate-y-1 transition-all duration-300 flex items-center gap-3 animate-slide-up delay-300"
                    >
                      ابدأ رحلتك الآن <Play className="fill-current" size={24} />
                    </button>
                  </div>
                )}

                {/* --- واجهة اختيار الفصول --- */}
                {viewState === 'home' && (
                  <div className="space-y-6 animate-fade-in">
                    <div className="text-center py-8">
                      <h2 className="text-3xl font-bold text-slate-800 mb-4">أهلاً بك يا باحث المستقبل 🎓</h2>
                      <p className="text-slate-600 max-w-2xl mx-auto">
                        اختر الفصل الذي تود التدرب عليه. ستجد ملخصاً سريعاً لأهم النقاط قبل بدء الاختبار لتنشيط الذاكرة، ثم اختباراً تفاعلياً                       </p>
                    </div>
                    
                    <div className="grid md:grid-cols-2 gap-6">
                      {[3, 4, 5, 6].map((ch) => (
                        <button
                          key={ch}
                          onClick={() => handleStartChapter(ch)}
                          className="bg-white/70 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-indigo-100 hover:shadow-xl hover:-translate-y-1 hover:border-purple-300 transition-all duration-300 text-right group flex flex-col justify-between"
                        >
                          <div>
                            <h3 className="text-xl font-bold text-indigo-700 mb-2">{chaptersData[ch].title}</h3>
                            <p className="text-slate-500 text-sm flex items-center gap-2">
                              <Zap size={16} className="text-amber-500" />
                              يحتوي على {chaptersData[ch].questions.length} سؤال تدريبي
                            </p>
                          </div>
                          <div className="mt-6 flex justify-end">
                            <span className="text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full flex items-center gap-1 font-bold group-hover:bg-gradient-to-r group-hover:from-indigo-600 group-hover:to-purple-600 group-hover:text-white transition-all duration-300">
                              ابدأ المراجعة <ChevronRight size={18} />
                            </span>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* --- واجهة ملخص الفصل --- */}
                {viewState === 'summary' && currentChapter && (
                  <div className="bg-white/80 backdrop-blur-sm rounded-3xl shadow-xl border border-indigo-50 p-6 md:p-8 animate-fade-in relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-purple-200 rounded-full blur-3xl opacity-50 -mr-10 -mt-10"></div>
                    <h2 className="text-3xl font-extrabold text-slate-800 border-b-2 border-indigo-100 pb-4 mb-6 relative z-10">{chaptersData[currentChapter].title}</h2>
                    
                    <div className="bg-gradient-to-l from-amber-50 to-orange-50 border-r-4 border-amber-400 p-6 rounded-l-2xl mb-8 relative z-10 shadow-inner">
                      <h3 className="flex items-center gap-2 text-xl font-bold text-amber-800 mb-3">
                        <AlertCircle size={24} /> كبسولة الفصل (الشرح التفصيلي)
                      </h3>
                      <p className="text-amber-900 leading-loose whitespace-pre-line text-sm md:text-base font-medium">
                        {chaptersData[currentChapter].summary}
                      </p>
                    </div>

                    <div className="flex justify-center relative z-10">
                      <button 
                        onClick={startQuiz}
                        className="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-10 py-4 rounded-full font-bold text-xl flex items-center gap-3 transition-all transform hover:scale-105 shadow-xl shadow-indigo-200"
                      >
                        <Play className="fill-current" size={20} /> يلا نبدأ الاختبار!
                      </button>
                    </div>
                  </div>
                )}

                {/* --- واجهة الاختبار --- */}
                {viewState === 'quiz' && currentChapter && (
                  <div className="animate-fade-in">
                    {/* Progress */}
                    <div className="flex justify-between items-center mb-3 text-sm font-bold text-indigo-800 bg-indigo-50 px-4 py-2 rounded-full">
                      <span>السؤال {currentQuestionIdx + 1} من {chaptersData[currentChapter].questions.length}</span>
                      <span className="flex items-center gap-1"><Award size={16} className="text-amber-500" /> النقاط: {score}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-3 mb-8 shadow-inner overflow-hidden">
                      <div 
                        className="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-500 ease-out"
                        style={{ width: `${((currentQuestionIdx) / chaptersData[currentChapter].questions.length) * 100}%` }}
                      ></div>
                    </div>

                    {/* Question Card */}
                    <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-lg border border-indigo-50 p-6 md:p-8">
                      <h3 className="text-xl md:text-2xl font-extrabold text-slate-800 mb-8 leading-relaxed">
                        {chaptersData[currentChapter].questions[currentQuestionIdx][0]}
                      </h3>
                      
                      <div className="grid gap-4">
                        {chaptersData[currentChapter].questions[currentQuestionIdx][1].map((option, idx) => (
                          <button
                            key={idx}
                            onClick={() => handleOptionClick(idx, option)}
                            className="text-right p-5 rounded-2xl border-2 border-slate-100 hover:border-indigo-400 hover:bg-gradient-to-r hover:from-indigo-50 hover:to-purple-50 transition-all duration-200 font-bold text-slate-700 hover:text-indigo-800 hover:-translate-y-1 hover:shadow-md"
                          >
                            {option}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* --- واجهة النتيجة النهائية --- */}
                {viewState === 'result' && currentChapter && (
                  <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-indigo-50 p-10 text-center animate-fade-in relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <Award size={80} className="mx-auto text-yellow-400 mb-6 drop-shadow-lg animate-bounce" />
                    <h2 className="text-4xl font-extrabold text-slate-800 mb-3 relative z-10">انتهى الاختبار!</h2>
                    <p className="text-slate-500 mb-8 text-lg relative z-10">نتيجة تدريبك على {chaptersData[currentChapter].title}</p>
                    
                    <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-8 relative z-10 drop-shadow-sm">
                      {score} <span className="text-3xl text-slate-400">/ {chaptersData[currentChapter].questions.length}</span>
                    </div>

                    <p className="text-xl font-bold text-slate-700 mb-10 relative z-10 bg-slate-50 inline-block px-6 py-3 rounded-2xl border border-slate-100">
                      {score === chaptersData[currentChapter].questions.length ? "علامة كاملة! دكتور جامعة متخفي ما شاء الله 🎓🔥" :
                       score >= chaptersData[currentChapter].questions.length * 0.8 ? "عاش جداً! مستوى ممتاز ومحتاج تركيز بسيط وتقفلها 💪" :
                       score >= chaptersData[currentChapter].questions.length * 0.5 ? "مجهود طيب، بس المرة الجاية أحسن أكيد! 🚀" :
                       "معلش، التدريب بيعلم الشطار.. راجع الكبسولة وجرب تاني 📚"}
                    </p>

                    <div className="flex flex-col sm:flex-row justify-center gap-4 relative z-10">
                      <button onClick={startQuiz} className="bg-indigo-50 text-indigo-700 border-2 border-indigo-100 px-8 py-4 rounded-full font-bold hover:bg-indigo-100 transition-colors shadow-sm">
                        إعادة الاختبار
                      </button>
                      <button onClick={resetHome} className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-4 rounded-full font-bold hover:from-indigo-700 hover:to-purple-700 transition-colors shadow-lg">
                        اختيار فصل آخر
                      </button>
                    </div>
                  </div>
                )}

              </main>

              {/* --- Footer الثابت --- */}
              <footer className="fixed bottom-0 left-0 right-0 bg-slate-900 text-white text-center py-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40 border-t-2 border-indigo-500 backdrop-blur-md bg-opacity-95">
                <div className="flex items-center justify-center gap-2">
                   <span className="text-indigo-400 animate-pulse">✨</span>
                   <span className="font-extrabold text-sm md:text-base tracking-wide">إعداد: مجدي عبد البصير</span>
                   <span className="text-purple-400 animate-pulse">✨</span>
                </div>
              </footer>

              {/* --- Modal (التغذية الراجعة والتعليل) --- */}
              {showFeedback && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                  <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden animate-slide-up border-4 border-white/20">
                    
                    {/* Header (Correct/Incorrect) */}
                    <div className={`p-8 text-center ${isCorrect ? 'bg-gradient-to-b from-green-100 to-white' : 'bg-gradient-to-b from-red-100 to-white'}`}>
                      <div className="flex justify-center mb-4 text-7xl md:text-8xl drop-shadow-xl animate-bounce">
                        {feedbackMeme.emoji}
                      </div>
                      <h3 className={`text-3xl font-black mt-2 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                        {feedbackMeme.text}
                      </h3>
                    </div>

                    {/* Body (Explanation) */}
                    <div className="p-6 md:p-8">
                      {!isCorrect && (
                        <div className="mb-6 text-slate-700 bg-red-50 p-4 rounded-2xl border border-red-100 text-sm md:text-base">
                          <span className="font-bold text-red-600 flex items-center gap-1 mb-1"><XCircle size={16}/> إجابتك:</span> 
                          {selectedOptionText}
                          <div className="h-px bg-red-200 my-2"></div>
                          <span className="font-bold text-green-600 flex items-center gap-1 mt-2 mb-1"><CheckCircle size={16}/> الإجابة الصحيحة:</span> 
                          {chaptersData[currentChapter].questions[currentQuestionIdx][1][chaptersData[currentChapter].questions[currentQuestionIdx][2]]}
                        </div>
                      )}
                      
                      <div className="bg-indigo-50 border-r-4 border-indigo-500 p-5 rounded-l-2xl shadow-inner">
                        <span className="flex items-center gap-2 font-bold text-indigo-800 mb-2">
                          <AlertCircle size={18} /> التعليل من المذكرة:
                        </span>
                        <span className="text-indigo-900 leading-relaxed font-medium block">
                          {chaptersData[currentChapter].questions[currentQuestionIdx][3]}
                        </span>
                      </div>

                      <button 
                        onClick={handleNextQuestion}
                        className={`w-full mt-8 py-4 rounded-full font-black text-lg text-white transition-all transform hover:scale-105 active:scale-95 shadow-xl ${isCorrect ? 'bg-gradient-to-r from-green-500 to-emerald-600 hover:shadow-green-200' : 'bg-gradient-to-r from-red-500 to-rose-600 hover:shadow-red-200'}`}
                      >
                        {currentQuestionIdx + 1 === chaptersData[currentChapter].questions.length ? "عرض النتيجة النهائية" : "السؤال التالي"}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
