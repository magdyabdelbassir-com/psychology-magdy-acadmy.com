    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .stars {
            display: inline-block;
        }
        .stars::before, .stars::after {
            content: '⭐';
            display: inline-block;
            animation: twinkle 1.5s infinite ease-in-out;
            margin: 0 8px;
        }
        .stars::after {
            animation-delay: 0.75s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }

<body class="bg-gray-50 text-gray-800 antialiased overflow-x-hidden selection:bg-indigo-300 selection:text-indigo-900 pb-20">

    <script type="text/babel">
        // --- 1. Data Source (Strictly extracted from the provided files without truncation) ---
        const questionsData = [
            { question: "من مكونات المقابلة:", options: ["Specific interviewer responses", "Technique", "Rapport", "All of the above"], correct: 3, explanation: "تشمل المقابلة ثلاثة مكونات أساسية: الألفة (Rapport)، التقنية (Technique)، والتلخيص (Summarizing)." },
            { question: "Translate: Before leaping into any interview, the interviewer should have acquired some skills", options: ["ليس شئ مما سبق", "قبل الانتقال لأي مقابلة يجب أن يكون القائم بالمقابلة قد اكتسب بعض القدرات", "قبل القفز إلى أي مقابلة يجب أن يكون القائم بالمقابلة قد اكتسب بعض المهارات", "قبل القفز إلى مقابلة يجب أن تحتوي المقابلة على بعض المهارات"], correct: 2, explanation: "الترجمة الدقيقة لـ skills هي مهارات، و leaping تعني القفز أو البدء، مما يعكس أهمية المهارات العامة قبل أي سياق إكلينيكي." },
            { question: "A pattern of social inhibition, feelings of inadequacy, and hypersensitivity to negative evaluation", options: ["الشخصية الهستيرية", "الشخصية النرجسية", "الشخصية الاستقلالية", "الشخصية التجنبية"], correct: 3, explanation: "اضطراب الشخصية التجنبية (Avoidant PD) يتميز بنمط من التثبيط الاجتماعي والشعور بالنقص والحساسية المفرطة للتقييم السلبي." },
            { question: "تعبر عن تتبع كلمات العميل ومقتطفات مختارة من المقابلة:", options: ["Note Taking", "Rapport", "General Skills", "Verbal Tracking"], correct: 3, explanation: "التتبع اللفظي (Verbal Tracking) هو تكرار الكلمات المهمة ومتابعة أفكار العميل بسلاسة." },
            { question: "It is a specific behavior that requires cultural knowledge:", options: ["Eye contact", "Verbal tracking", "Specific behavior", "Body language"], correct: 0, explanation: "التواصل البصري (Eye contact) يعتمد بشكل كبير على الثقافة؛ في بعض الثقافات قد يعني التهديد، وفي أخرى يعني الانتباه." },
            { question: "The clinical interview mean:", options: ["كل ما سبق", "هي قادرة على تكرار الكلمات والعبارات الرئيسية...", "هي مقابلة تشخيصية وتتضمن أسئلة تتعلق بمعايير الدليل التشخيصي...", "هو أي اسلوب تقييمي يستخدمه علم النفس الكلينكي ويحتوي علي الصدق والثبات"], correct: 3, explanation: "أي أداة تقييم في علم النفس الإكلينيكي يجب أن تتسم بالصدق والثبات والفائدة الإكلينيكية، والمقابلة هي الأداة الأساسية." },
            { question: "Is an enduring pattern of inner experience and behavior that deviates markedly from the expectations...", options: ["Body Language", "Borderline personality disorder", "The clinical interview", "A personality disorder"], correct: 3, explanation: "هذا هو التعريف الشامل لاضطراب الشخصية (Personality Disorder) كما ورد في الدليل التشخيصي." },
            { question: "Quieting yourself, being self-aware, and developing positive working relationships:", options: ["Note Taking", "General Skills", "Technique", "Verbal Tracking"], correct: 1, explanation: "هذه المهارات تعتبر المهارات العامة (General Skills) المطلوبة كقاعدة لأي مقابلة." },
            { question: "يجب على القائمين بالمقابلة أن يدركوا العلاقة بين الاستماع اليقظ والتواصل البصري:", options: ["General Skills", "Verbal Tracking", "Eye contact", "Body language"], correct: 2, explanation: "التواصل البصري (Eye contact) ليس فقط يسهل الاستماع، بل ينقله ويُشعر العميل بأنه مسموع." },
            { question: "General rules for the interviewer:", options: ["All of the above", "minimize restlessness", "appear attentive", "face the client"], correct: 0, explanation: "مواجهة العميل، الانتباه، وتقليل الحركة الزائدة هي القواعد العامة للغة الجسد للمُقابل." },
            { question: "المحاورون الفعالون قادرون على تكرار مفتاح كلمات وعبارات تعود لعملائهم لضمان أنهم تم سماعهم بدقة", options: ["Not at all", "Rapport", "General Skills", "Verbal Tracking (التتبع اللفظي)"], correct: 3, explanation: "التتبع اللفظي يتيح إشعار العميل بأن كلماته ومفاهيمه تُسمع بدقة، دون أن يكون التكرار آلياً." },
            { question: "The extent that measures what it claims to measure:", options: ["لا شئ مما سبق", "الصدق", "المقابلة الإكلينيكية", "الثبات"], correct: 1, explanation: "الصدق (Validity) يعني أن الأداة تقيس بالفعل ما تدعي قياسه." },
            { question: "The most pivotal element of a clinical interview:", options: ["الوعي بالذات", "الهدوء النفسي", "العميل", "القائم بالمقابلة"], correct: 3, explanation: "المُقابل (The Interviewer) هو العنصر الأهم، فهو من يوجه الحوار ويطبق المهارات الفنية ويتفهم التفاعل الإنساني." },
            { question: "Translate: A skilled interviewer is a master of the technical and practical aspects of the interview", options: ["يركز القائم بالمقابلة على الاطار الذهني الخاص بالمقابلة", "قبل القفز إلى المقابلة يجب ان يمتلك القائم بالمقابلة بعض المهارات", "القائم على المقابلة الماهر هو شخص خبير بالجوانب العملية والتقنية للمقابلة", "القائم بالمقابلة هو شخص يمتلك مهارات عامة"], correct: 2, explanation: "الترجمة تعني أن القائم بالمقابلة الماهر يتقن الجوانب العملية والتقنية، بالإضافة إلى الفهم الواسع للتفاعل الإنساني." },
            { question: "It communicates listening and the client feels heard", options: ["Self-aware", "General skills", "Eye contact", "Body language"], correct: 2, explanation: "التواصل البصري (Eye Contact) يشعر العميل بالاستماع ويؤكد المتابعة." },
            { question: "يمكن للثقافة تشكيل دلالات...........", options: ["General skills", "Technique", "Taking notice", "Body language"], correct: 3, explanation: "لغة الجسد (Body language) يمكن أن تشكلها الثقافة، فما يُعد احتراماً في ثقافة قد يكون إهانة في أخرى." },
            { question: "One of the general rules for the interviewer", options: ["Body language", "Self-aware", "Eye contact", "Face the client"], correct: 3, explanation: "من قواعد لغة الجسد: مواجهة العميل (Face the client)، الظهور بيقظة، وتقليل القلق." },
            { question: "يمكن أن يساء تفسيرها من قبل المحاور الذي تكون معرفته بالخلفية الثقافية للعميل ناقصة", options: ["Technique", "Body language", "Rapport", "Self-aware"], correct: 1, explanation: "لغة الجسد للعميل قد تُفهم خطأ إذا كان المُقابل يفتقر إلى الوعي بالخلفية الثقافية." },
            { question: "هو نمط دائم من التجربة الداخلية والسلوك الذي ينحرف بشكل ملحوظ عن توقعات ثقافة الأفراد", options: ["antisocial personality", "Narcissistic personality", "Paranoid personality", "personality disorder"], correct: 3, explanation: "هذا هو التعريف العام لاضطرابات الشخصية (Personality disorder)." },
            { question: "..... and suspiciousness such that others' motives are interpreted as malevolent", options: ["Borderline", "Narcissistic", "Schizoid", "paranoid"], correct: 3, explanation: "الشخصية البارانوية (Paranoid) تتسم بعدم الثقة والشك وتفسير دوافع الآخرين بالخبث." },
            { question: "نمط من الانفصال عن العلاقات الاجتماعية ومجموعة محدودة من التعبير العاطفي", options: ["Schizoid", "Borderline", "Narcissistic", "paranoid"], correct: 0, explanation: "الشخصية الفصامية (Schizoid) تتسم بالانفصال وبرود التعبير العاطفي." },
            { question: "..... is a pattern of acute discomfort in close relationships, cognitive or perceptual distortions, and eccentricities of behavior", options: ["الشخصية الهستيرية", "الشخصية الحدية", "الشخصية شبه الفصامية", "الشخصية الفصامية"], correct: 2, explanation: "الشخصية شبه الفصامية (Schizotypal) تعاني من تشوهات إدراكية وغرابة في السلوك." },
            { question: "من الاضطرابات التي تظهر في الطفولة وتسبب الشخصية المعادية للمجتمع", options: ["التبول الليلي", "اضطراب المسلك", "القلق", "تشتت الانتباه وفرط الحركة"], correct: 1, explanation: "اضطراب المسلك (Conduct disorder) في الطفولة يعتبر مؤشراً قوياً ومقدمة لاضطراب الشخصية المعادية للمجتمع." },
            { question: "Defined as any consequence that makes a behavior less likely to recur in the future", options: ["ادارة حالات الطوارئ", "التعزيز", "العلاج بالتعرض", "العقاب"], correct: 3, explanation: "العقاب (Punishment) هو النتيجة التي تقلل من احتمالية تكرار السلوك." },
            { question: "There are .... types of Adaptation (Conditioning)", options: ["1", "2", "3", "4"], correct: 1, explanation: "يوجد نوعان أساسيان من التكيف: التكيف الكلاسيكي (Classical) والتكيف الفعال (Operant)." },
            { question: "هو علاج يستخدم أيضا في المقام الأول للرهاب والاضطرابات القلق الأخرى، يشبه تماما العلاج بالتعرض", options: ["Systematic Desensitization", "Contingency Management", "Assertiveness Training", "Exposure Therapy"], correct: 0, explanation: "التقليل المنظم للحساسية (Systematic Desensitization) يشبه التعرض لكنه يربط المثير المخيف باستجابة استرخاء جديدة." },
            { question: "يستخدم الاسترخاء كاستجابة جديدة تحل محل استجابة الخوف في .............", options: ["التعزيز", "التدريب على تأكيد الذات", "التقليل المنظم للحساسية", "العلاج بالتعرض"], correct: 2, explanation: "التقليل المنظم للحساسية يربط الاسترخاء كاستجابة جديدة تمنع الخوف." },
            { question: "Is the clinical psychologist version of 'facing your fears'.", options: ["Assertiveness Training", "Exposure Therapy", "Systematic Desensitization", "Contingency Management"], correct: 1, explanation: "العلاج بالتعرض (Exposure Therapy) هو تطبيق مباشر لمواجهة المخاوف لفك الارتباط الشرطي." },
            { question: "يستخدم فيه سلوك النمذجة (Modeling)", options: ["العلاج بالتعرض", "التقليل المنظم للحساسية", "التدريب على تأكيد الذات", "العقاب"], correct: 2, explanation: "في التدريب على تأكيد الذات (Assertiveness Training)، يقوم المعالج بنمذجة السلوك السليم ليتبعه العميل." },
            { question: "The symptom of 'Is preoccupied with fantasies of unlimited success, power, brilliance, beauty, or ideal love' is a diagnostic criterion of ... PD.", options: ["Avoidant", "Narcissistic", "Paranoid", "Antisocial"], correct: 1, explanation: "الانشغال بأوهام العظمة والنجاح اللامحدود هو من سمات الشخصية النرجسية." },
            { question: "The symptom of 'Deceitfulness, as indicated by repeated lying' is a diagnostic criterion of ... PD.", options: ["Antisocial", "Narcissistic", "Paranoid", "Avoidant"], correct: 0, explanation: "الخداع والكذب المتكرر واستغلال الآخرين سمات أساسية للشخصية المعادية للمجتمع (Antisocial)." },
            { question: "One of the General Personality Disorder Criteria is the disturbance in:", options: ["Cognition", "self-control", "rigidity", "anxiousness"], correct: 0, explanation: "المعايير العامة لاضطرابات الشخصية تشمل اضطراباً في المعرفة (Cognition)، والوجدان، والأداء الشخصي والاندفاعية." },
            { question: "... which involves reinforcing successive approximations of the target behavior.", options: ["token economy", "shaping", "treatment", "Punishment"], correct: 1, explanation: "التشكيل (Shaping) هو تعزيز 'خطوات الطفل' التدريجية نحو السلوك المستهدف." },
            { question: "Other meaning of Observational Learning is:", options: ["token economy", "shaping", "treatment", "modeling"], correct: 3, explanation: "التعلم بالملاحظة يُعرف أيضاً بالنمذجة (Modeling) حيث يتعلم الفرد بمراقبة سلوك الآخرين." },
            { question: "... personality disorder is a pattern of excessive emotionality and attention seeking.", options: ["Histrionic", "Narcissistic", "Paranoid", "Avoidant"], correct: 0, explanation: "الشخصية الهستيرية (Histrionic) تسعى دائماً لجذب الانتباه وتبالغ في إظهار المشاعر." },
            { question: "... personality disorder is a pattern of preoccupation with orderliness, perfectionism, and control.", options: ["Dependent", "Obsessive-compulsive", "Avoidant", "Paranoid"], correct: 1, explanation: "الشخصية الوسواسية القهرية تنشغل بشكل مفرط بالنظام والمثالية والسيطرة." },
            { question: "The symptom of 'Frantic efforts to avoid real or imagined abandonment' is a diagnostic criterion of ... PD.", options: ["Borderline", "Avoidant", "Dependent", "Paranoid"], correct: 0, explanation: "الجهود المحمومة لتجنب الهجر هي السمة الجوهرية لاضطراب الشخصية الحدية (Borderline)." },
            { question: "The problems in the range, intensity, lability, and appropriateness of emotional response are belonging to:", options: ["impulse control", "Cognition", "Affectivity", "inflexibility"], correct: 2, explanation: "الاضطراب في مدى وشدة وملاءمة الاستجابة العاطفية يُعرف بالوجدان (Affectivity)." },
            { question: "Phobias, according to the behavioral therapist, are best understood as the result of:", options: ["disorder", "operant conditioning", "Classical conditioning", "wrong conditions"], correct: 2, explanation: "تُفهم المخاوف المرضية سلوكياً على أنها نتيجة للتكيف الكلاسيكي (Classical conditioning) حيث يرتبط المثير المخيف بنتيجة سلبية." },
            { question: "... is defined as any consequence that makes a behavior more likely to recur in the future.", options: ["Stimulation", "Punishment", "Reinforcement", "adjustment"], correct: 2, explanation: "التعزيز (Reinforcement) يزيد من احتمالية تكرار السلوك مستقبلاً." },
            { question: "... refers to the removal of an expected reinforcement that results in a decrease in the frequency of a behavior.", options: ["Punishment", "exposure", "treatment", "extinction"], correct: 3, explanation: "الانقراض (Extinction) هو زوال الاستجابة بسبب توقف التعزيز المتوقع." },
            { question: "A skilled interviewer is not only a master of the technical and practical aspects of the interview.", options: ["True", "False"], correct: 0, explanation: "صحيح، المقابل الماهر يجب أن يمتلك أيضاً فهماً واسعاً لطبيعة التفاعل الإنساني والمهارات العامة." },
            { question: "The client's body language can be misinterpreted by an interviewer whose knowledge of the client's cultural background is deficient.", options: ["True", "False"], correct: 0, explanation: "صحيح، الاختلافات الثقافية قد تؤدي لتفسير لغة الجسد بشكل خاطئ إذا غاب الوعي الثقافي." },
            { question: "يعد التعرض للمنبهات المثيرة للقلق أحد المكونات الرئيسية للتقليل المنظم للحساسية.", options: ["True", "False"], correct: 0, explanation: "صحيح، لكنه يتضمن إضافة استجابة استرخاء لمنع القلق بدلاً من التعرض المجرد." },
            { question: "Borderline personality disorder is a pattern of instability in interpersonal relationships, self-image, and affects, and marked impulsivity.", options: ["True", "False"], correct: 0, explanation: "صحيح، هذا هو التعريف الدقيق للشخصية الحدية بالدليل التشخيصي." }
        ];

        const Footer = () => (
            <div className="fixed bottom-0 w-full bg-gray-900 text-white py-3 shadow-inner z-50 text-center">
                <p className="text-sm md:text-lg font-bold stars">إعداد: مجدي عبد البصير</p>
            </div>
        );

        // Intro Screen Component
        const IntroScreen = ({ onStart }) => (
            <div className="flex flex-col items-center justify-center min-h-[80vh] px-4 animate-slide-up">
                <div className="bg-white p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-xl w-full border border-gray-100">
                    <div className="mx-auto bg-gradient-to-tr from-indigo-500 to-purple-500 w-32 h-32 rounded-full mb-6 flex items-center justify-center shadow-lg relative overflow-hidden">
                        <img 
                            src="logo.jpg" 
                            className="object-cover w-full h-full"
                            onError={(e) => {
                                e.target.style.display = 'none';
                                e.target.nextSibling.style.display = 'flex';
                            }}
                        />
                        <div style={{display: 'none'}} className="absolute inset-0 flex items-center justify-center bg-indigo-500">
                            <IconFallbackLogo />
                        </div>
                    </div>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-gray-800 mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                        مرحباً بك في المنصة!
                    </h2>
                    <p className="text-gray-600 mb-8 text-lg leading-relaxed">
                        استعد لاختبار معلوماتك الإكلينيكية والتدرب على أهم أسئلة المنهج باللغتين العربية والإنجليزية بطريقة تفاعلية وممتعة.
                    </p>
                    <button 
                        onClick={onStart}
                        className="group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 bg-gradient-to-r from-indigo-600 to-purple-600 font-pj rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600 hover:scale-105 shadow-xl hover:shadow-2xl"
                    >
                        <span className="flex items-center text-lg">
                            <IconPlay />
                            ابدأ رحلتك الآن
                        </span>
                    </button>
                </div>
            </div>
        );

        // Capsule Screen Component
        const CapsuleScreen = ({ onProceed }) => (
            <div className="max-w-4xl mx-auto p-4 py-8 animate-slide-up">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border-t-4 border-indigo-500">
                    <div className="bg-indigo-50 p-6 border-b border-indigo-100 flex items-center">
                        <IconBook />
                        <h2 className="text-2xl font-bold text-indigo-900">كبسولة المراجعة السريعة</h2>
                    </div>
                    <div className="p-6 md:p-8 space-y-6 text-gray-700 leading-relaxed">
                        <div className="p-4 bg-purple-50 rounded-lg border-r-4 border-purple-500">
                            <h3 className="font-bold text-lg text-purple-900 mb-2">1. المقابلة الإكلينيكية (The Clinical Interview)</h3>
                            <ul className="list-disc list-inside space-y-1">
                                <li>المُقابل هو أهم عنصر، ويجب أن يمتلك <strong>General Skills</strong> (تهدئة الذات، الوعي بالذات، بناء العلاقة).</li>
                                <li><strong>السلوكيات المحددة:</strong> التواصل البصري ولغة الجسد تعتمد بشدة على <strong>الثقافة (Culture)</strong>.</li>
                                <li><strong>التتبع اللفظي (Verbal Tracking):</strong> تكرار الكلمات المهمة بسلاسة لإشعار العميل بالاستماع.</li>
                                <li>أي أداة تقييم يجب أن تتمتع بـ: <strong>الصدق (Validity)</strong> و <strong>الثبات (Reliability)</strong>.</li>
                            </ul>
                        </div>
                        <div className="p-4 bg-indigo-50 rounded-lg border-r-4 border-indigo-500">
                            <h3 className="font-bold text-lg text-indigo-900 mb-2">2. اضطرابات الشخصية (Personality Disorders)</h3>
                            <ul className="list-disc list-inside space-y-1">
                                <li><strong>النرجسية (Narcissistic):</strong> عظمة وحاجة للإعجاب.</li>
                                <li><strong>المعادية للمجتمع (Antisocial):</strong> انتهاك حقوق الآخرين وكذب متكرر (تبدأ غالباً باضطراب المسلك).</li>
                                <li><strong>التجنبية (Avoidant):</strong> تثبيط اجتماعي وحساسية للتقييم السلبي.</li>
                                <li><strong>الحدية (Borderline):</strong> عدم استقرار في العلاقات والمزاج واندفاعية، وجهود لتجنب الهجر.</li>
                            </ul>
                        </div>
                        <div className="p-4 bg-blue-50 rounded-lg border-r-4 border-blue-500">
                            <h3 className="font-bold text-lg text-blue-900 mb-2">3. التكيف والعلاج السلوكي (Conditioning)</h3>
                            <ul className="list-disc list-inside space-y-1">
                                <li>المخاوف المرضية تنتج من <strong>التكيف الكلاسيكي</strong>.</li>
                                <li><strong>التعرض (Exposure):</strong> مواجهة المثير للقضاء على الخوف.</li>
                                <li><strong>التقليل المنظم للحساسية:</strong> استبدال الخوف بالاسترخاء.</li>
                                <li><strong>التعزيز (Reinforcement):</strong> يزيد السلوك. <strong>العقاب (Punishment):</strong> يقلل السلوك.</li>
                            </ul>
                        </div>
                    </div>
                    <div className="p-6 bg-gray-50 text-center border-t border-gray-100">
                        <button 
                            onClick={onProceed}
                            className="inline-flex items-center justify-center px-8 py-3 text-lg font-bold text-white transition-all bg-indigo-600 rounded-lg hover:bg-indigo-700 hover:scale-105 shadow-md"
                        >
                            انتقل للاختبار 🚀
                        </button>
                    </div>
                </div>
            </div>
        );

        // Quiz Screen Component
        const QuizScreen = () => {
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [modalState, setModalState] = React.useState({ show: false, isCorrect: false, selectedOption: null });
            const [quizFinished, setQuizFinished] = React.useState(false);

            const question = questionsData[currentQIndex];

            const handleOptionClick = (index) => {
                const isCorrect = (index === question.correct);
                if (isCorrect) setScore(prev => prev + 1);
                
                setModalState({ show: true, isCorrect, selectedOption: index });
            };

            const handleNextQuestion = () => {
                setModalState({ show: false, isCorrect: false, selectedOption: null });
                if (currentQIndex + 1 < questionsData.length) {
                    setCurrentQIndex(prev => prev + 1);
                } else {
                    setQuizFinished(true);
                }
            };

            const getRandomMeme = (isCorrect) => {
                const arr = isCorrect ? correctPhrases : wrongPhrases;
                return arr[Math.floor(Math.random() * arr.length)];
            };

            if (quizFinished) {
                const percentage = Math.round((score / questionsData.length) * 100);
                return (
                    <div className="flex flex-col items-center justify-center min-h-[70vh] px-4 animate-slide-up">
                        <div className="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-lg w-full">
                            <div className="text-8xl mb-6 animate-bounce-in">{percentage >= 50 ? '🏆' : '📚'}</div>
                            <h2 className="text-3xl font-bold text-indigo-900 mb-2">انتهى الاختبار!</h2>
                            <p className="text-xl text-gray-600 mb-6">لقد أجبت بشكل صحيح على <span className="font-bold text-indigo-600">{score}</span> من أصل <span className="font-bold">{questionsData.length}</span> سؤال.</p>
                            
                            <div className="w-full bg-gray-200 rounded-full h-4 mb-8">
                                <div className={`h-4 rounded-full ${percentage >= 50 ? 'bg-green-500' : 'bg-red-500'}`} style={{ width: `${percentage}%` }}></div>
                            </div>
                            
                            <button 
                                onClick={() => window.location.reload()}
                                className="px-8 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-full hover:scale-105 transition-transform shadow-lg"
                            >
                                إعادة الاختبار 🔄
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto p-4 py-8 relative">
                    {/* Progress */}
                    <div className="mb-6 flex justify-between items-center text-sm md:text-base font-semibold text-gray-600">
                        <span>السؤال {currentQIndex + 1} من {questionsData.length}</span>
                        <span className="bg-indigo-100 text-indigo-800 py-1 px-3 rounded-full">النقاط: {score}</span>
                    </div>

                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden animate-slide-up">
                        <div className="bg-indigo-600 p-6 text-white min-h-[120px] flex items-center justify-center text-center shadow-inner">
                            <h2 className="text-xl md:text-2xl font-bold leading-relaxed">{question.question}</h2>
                        </div>
                        <div className="p-4 md:p-8 space-y-4 bg-gray-50">
                            {question.options.map((opt, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => handleOptionClick(idx)}
                                    disabled={modalState.show}
                                    className={`w-full text-right p-4 rounded-xl border-2 font-semibold text-gray-700 transition-all duration-200 hover:bg-indigo-50 hover:border-indigo-400 hover:-translate-y-1 hover:shadow-md focus:outline-none
                                        ${modalState.show && idx === question.correct ? 'bg-green-100 border-green-500 text-green-900' : ''}
                                        ${modalState.show && idx === modalState.selectedOption && !modalState.isCorrect ? 'bg-red-100 border-red-500 text-red-900' : ''}
                                        ${!modalState.show ? 'bg-white border-gray-200' : 'opacity-80'}
                                    `}
                                >
                                    <div className="flex items-center justify-between">
                                        <span>{opt}</span>
                                        <div className="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center text-transparent">
                                            ✓
                                        </div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Feedback Modal */}
                    {modalState.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-slide-up border-t-8 border-t-indigo-600">
                                <div className="p-8 text-center">
                                    {(() => {
                                        const meme = getRandomMeme(modalState.isCorrect);
                                        return (
                                            <>
                                                <div className="text-7xl mb-4 animate-bounce-in drop-shadow-xl">{meme.emoji}</div>
                                                <h3 className={`text-2xl font-black mb-6 ${modalState.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                                    {meme.text}
                                                </h3>
                                            </>
                                        );
                                    })()}
                                    
                                    {!modalState.isCorrect && (
                                        <div className="mb-6 p-3 bg-green-50 border border-green-200 rounded-lg text-green-800 text-sm">
                                            <span className="font-bold block mb-1">الإجابة الصحيحة:</span>
                                            {question.options[question.correct]}
                                        </div>
                                    )}

                                    <div className="bg-indigo-50 text-indigo-900 p-4 rounded-xl text-right text-sm leading-relaxed border border-indigo-100 shadow-inner mb-6">
                                        <strong className="block mb-2 text-indigo-700">التعليل:</strong>
                                        {question.explanation}
                                    </div>

                                    <button 
                                        onClick={handleNextQuestion}
                                        className="w-full py-4 bg-gradient-to-r from-gray-800 to-gray-900 text-white font-bold rounded-xl hover:bg-gray-800 transition-colors shadow-lg text-lg"
                                    >
                                        السؤال التالي
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [stage, setStage] = React.useState('intro'); // intro, capsule, quiz

            return (
                <div className="min-h-screen flex flex-col">
                    <Header />
                    <div className="flex-grow">
                        {stage === 'intro' && <IntroScreen onStart={() => setStage('capsule')} />}
                        {stage === 'capsule' && <CapsuleScreen onProceed={() => setStage('quiz')} />}
                        {stage === 'quiz' && <QuizScreen />}
                    </div>
                    <Footer />
                </div>
            );
        };

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
