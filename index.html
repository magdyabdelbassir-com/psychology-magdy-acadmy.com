function getRandomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// Custom hook for quiz logic
function useQuiz() {
  const [currentView, setCurrentView] = React.useState("intro");
  const [selectedChapter, setSelectedChapter] = React.useState(null);
  const [questions, setQuestions] = React.useState([]);
  const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);
  const [score, setScore] = React.useState(0);
  const [answers, setAnswers] = React.useState([]);
  const [showFeedback, setShowFeedback] = React.useState(false);
  const [isCorrect, setIsCorrect] = React.useState(false);
  const [feedbackPhrase, setFeedbackPhrase] = React.useState("");
  const [feedbackEmoji, setFeedbackEmoji] = React.useState("");
  const [explanation, setExplanation] = React.useState("");
  const [selectedOption, setSelectedOption] = React.useState(null);
  const [isQuizComplete, setIsQuizComplete] = React.useState(false);

  const selectChapter = (chapterKey) => {
    setSelectedChapter(chapterKey);
    const filtered = allQuestions.filter(q => q.chapter === chapterKey);
    // Shuffle questions
    const shuffled = [...filtered].sort(() => Math.random() - 0.5);
    // Limit to 30 questions max per chapter
    const limited = shuffled.slice(0, 30);
    setQuestions(limited);
    setCurrentQuestionIndex(0);
    setScore(0);
    setAnswers([]);
    setIsQuizComplete(false);
    setSelectedOption(null);
  };

  const answerQuestion = (optionIndex) => {
    if (showFeedback || selectedOption !== null) return;

    setSelectedOption(optionIndex);
    const currentQ = questions[currentQuestionIndex];
    const correct = optionIndex === currentQ.correct;

    setIsCorrect(correct);
    setFeedbackPhrase(getRandomItem(correct ? correctPhrases : wrongPhrases));
    setFeedbackEmoji(getRandomItem(correct ? correctEmojis : wrongEmojis));
    setExplanation(currentQ.explanation);

    if (correct) {
      setScore(s => s + 1);
    }

    setAnswers(prev => [...prev, { question: currentQ.text, correct, selected: optionIndex, correctAnswer: currentQ.correct, explanation: currentQ.explanation }]);
    setShowFeedback(true);
  };

  const nextQuestion = () => {
    setShowFeedback(false);
    setSelectedOption(null);
    setExplanation("");

    if (currentQuestionIndex + 1 >= questions.length) {
      setIsQuizComplete(true);
      setCurrentView("results");
    } else {
      setCurrentQuestionIndex(i => i + 1);
    }
  };

  const restartQuiz = () => {
    setCurrentView("intro");
    setSelectedChapter(null);
    setQuestions([]);
    setCurrentQuestionIndex(0);
    setScore(0);
    setAnswers([]);
    setShowFeedback(false);
    setIsCorrect(false);
    setFeedbackPhrase("");
    setFeedbackEmoji("");
    setExplanation("");
    setSelectedOption(null);
    setIsQuizComplete(false);
  };

  const goToChapters = () => {
    setCurrentView("chapters");
  };

  const startChapter = (chapterKey) => {
    selectChapter(chapterKey);
    setCurrentView("capsule");
  };

  const startQuiz = () => {
    setCurrentView("quiz");
  };

  return {
    currentView, selectedChapter, questions, currentQuestionIndex, score,
    answers, showFeedback, isCorrect, feedbackPhrase, feedbackEmoji, explanation,
    selectedOption, isQuizComplete,
    answerQuestion, nextQuestion, restartQuiz, goToChapters, startChapter, startQuiz
  };
}

// Quiz Screen Component
function QuizScreen({ quiz }) {
  const { questions, currentQuestionIndex, score, showFeedback, isCorrect, feedbackPhrase, feedbackEmoji, explanation, selectedOption, answerQuestion, nextQuestion } = quiz;

  const currentQ = questions[currentQuestionIndex];
  const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

  // Color mapping for options (A, B, C, D)
  const optionColors = [
    "from-blue-500/80 to-blue-600/80 hover:from-blue-500 hover:to-blue-600",
    "from-purple-500/80 to-purple-600/80 hover:from-purple-500 hover:to-purple-600",
    "from-pink-500/80 to-pink-600/80 hover:from-pink-500 hover:to-pink-600",
    "from-indigo-500/80 to-indigo-600/80 hover:from-indigo-500 hover:to-indigo-600"
  ];

  const optionLabels = ["أ", "ب", "ج", "د"];

  const getOptionStyle = (index) => {
    if (selectedOption === null) return optionColors[index];
    if (index === currentQ.correct) return "from-green-500 to-green-600 ring-2 ring-green-400";
    if (index === selectedOption && index !== currentQ.correct) return "from-red-500 to-red-600 ring-2 ring-red-400";
    return "from-gray-600/50 to-gray-700/50 opacity-60";
  };

  return (
    <div className="min-h-screen px-4 py-6">
      <div className="max-w-3xl mx-auto">
        {/* Header */}
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-2 text-purple-200">
            <Icons.Star />
            <span className="font-bold text-lg">{score}</span>
          </div>
          <div className="text-purple-200 text-sm">
            سؤال {currentQuestionIndex + 1} من {questions.length}
          </div>
          <div className="flex items-center gap-2 text-purple-200">
            <Icons.Clock />
            <span>{Math.round(progress)}%</span>
          </div>
        </div>

        {/* Progress Bar */}
        <div className="w-full h-3 bg-white/10 rounded-full mb-8 overflow-hidden">
          <div 
            className="h-full bg-gradient-to-r from-purple-500 via-pink-500 to-indigo-500 rounded-full progress-bar"
            style={{ width: `${progress}%` }}
          />
        </div>

        {/* Question Card */}
        <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 md:p-8 border border-white/20 shadow-2xl mb-6 animate-fade-in">
          <div className="mb-2">
            <span className="text-xs bg-purple-500/30 text-purple-200 px-3 py-1 rounded-full">
              {currentQ.category === "mcq" ? "اختيار من متعدد" : "صح / خطأ"}
            </span>
          </div>
          <h3 className="text-xl md:text-2xl font-bold text-white leading-relaxed mb-8">
            {currentQ.text}
          </h3>

          {/* Options */}
          <div className="grid grid-cols-1 gap-4">
            {currentQ.options.map((option, index) => (
              <button
                key={index}
                onClick={() => answerQuestion(index)}
                disabled={selectedOption !== null}
                className={`option-card relative w-full text-right bg-gradient-to-r ${getOptionStyle(index)} text-white font-medium text-lg px-6 py-4 rounded-xl shadow-lg transition-all duration-300 flex items-center gap-4 ${selectedOption === null ? 'cursor-pointer' : 'cursor-default'}`}
              >
                <span className="flex-shrink-0 w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold text-sm">
                  {optionLabels[index]}
                </span>
                <span className="flex-1">{option}</span>
                {selectedOption !== null && index === currentQ.correct && (
                  <Icons.CheckCircle />
                )}
                {selectedOption !== null && index === selectedOption && index !== currentQ.correct && (
                  <Icons.XCircle />
                )}
              </button>
            ))}
          </div>
        </div>

        {/* Feedback Modal */}
        {showFeedback && (
          <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-gradient-to-br from-indigo-900 via-purple-900 to-indigo-950 rounded-3xl p-8 max-w-lg w-full border border-purple-400/30 shadow-2xl animate-bounce-in">
              {/* Emoji */}
              <div className="text-center mb-4">
                <div className="text-8xl mb-2 animate-bounce">
                  {feedbackEmoji}
                </div>
              </div>

              {/* Phrase */}

              <p className="text-xl text-center text-purple-200 mb-6 font-medium">
                {feedbackPhrase}
              </p>

              {/* Explanation */}
              <div className="bg-white/10 rounded-2xl p-5 mb-6 border border-white/10">
                <h4 className="text-pink-300 font-bold mb-2 flex items-center gap-2">
                  <Icons.LightBulb />
                  التعليل
                </h4>
                <p className="text-purple-100 leading-relaxed text-sm">{explanation}</p>
              </div>

              {/* Correct Answer */}
              {!isCorrect && (
                <div className="bg-green-500/20 rounded-xl p-4 mb-6 border border-green-500/30">
                  <p className="text-green-300 font-bold text-center">
                    الإجابة الصحيحة: {currentQ.options[currentQ.correct]}
                  </p>
                </div>

              {/* Next Button */}
              <button
                onClick={nextQuestion}
                className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:shadow-purple-500/40 transition-all duration-300 hover:scale-[1.02]"
              >
                {currentQuestionIndex + 1 >= questions.length ? "عرض النتيجة" : "السؤال التالي"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// Results Screen Component
function ResultsScreen({ quiz, onRestart, onGoHome }) {
  const { score, answers, questions } = quiz;
  const percentage = Math.round((score / questions.length) * 100);

  let message = "";
  let subMessage = "";
  let color = "";

  if (percentage >= 90) {
    message = "ممتاز!";
    subMessage = "إنت فخر المناهج يا بطل!";
    color = "from-green-400 to-emerald-500";
  } else if (percentage >= 70) {
    message = "جيد جداً!";
    subMessage = "كده كده يا عميد، استمر!";
    color = "from-blue-400 to-cyan-500";
  } else if (percentage >= 50) {
    message = "مقبول";
    subMessage = "محتاج تراجع شوية، إنت قادر!";
    color = "from-yellow-400 to-orange-500";
  } else {
    message = "يحتاج مراجعة";
    subMessage = "لا تيأس، راجع المذكرة وحاول تاني!";
    color = "from-red-400 to-pink-500";
  }

  return (
    <div className="min-h-screen px-4 py-8">
      <div className="max-w-3xl mx-auto">
        <div className="text-center mb-8 animate-fade-in">
          {/* Trophy */}
          <div className="inline-block mb-6 animate-bounce-in">
            <div className="w-28 h-28 mx-auto bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center shadow-2xl">
              <Icons.Trophy />
            </div>
          </div>

          <h2 className={`text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r ${color} mb-3`}>
            {message}
          </h2>
          <p className="text-xl text-purple-200 mb-6">{subMessage}</p>

          {/* Score Circle */}
          <div className="relative w-48 h-48 mx-auto mb-8">
            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="8"/>
              <circle 
                cx="50" 
                cy="50" 
                r="40" 
                fill="none" 
                stroke="url(#gradient)" 
                strokeWidth="8"
                strokeDasharray={`${2 * Math.PI * 40}`}
                strokeDashoffset={`${2 * Math.PI * 40 * (1 - percentage / 100)}`}
                strokeLinecap="round"
                className="transition-all duration-1000 ease-out"
              />
              <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#a855f7"/>
                  <stop offset="100%" stopColor="#ec4899"/>
                </linearGradient>
              </defs>
            </svg>
            <div className="absolute inset-0 flex items-center justify-center">
              <div className="text-center">
                <span className="text-4xl font-black text-white">{percentage}%</span>
                <p className="text-sm text-purple-300">{score} / {questions.length}</p>
              </div>
            </div>
          </div>
        </div>

        {/* Answer Review */}
        <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 border border-white/20 mb-8">
          <h3 className="text-xl font-bold text-pink-300 mb-6 flex items-center gap-2">
            <Icons.BookOpen />
            مراجعة الإجابات
          </h3>

          <div className="space-y-4 max-h-96 overflow-y-auto scrollbar-hide">
            {answers.map((ans, index) => (
              <div 
                key={index} 
                className={`p-4 rounded-xl border ${ans.correct ? 'bg-green-500/10 border-green-500/30' : 'bg-red-500/10 border-red-500/30'} transition-all hover:scale-[1.01]`}
              >
                <div className="flex items-start gap-3">
                  <span className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${ans.correct ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                    {index + 1}
                  </span>
                  <div className="flex-1">
                    <p className="text-white font-medium mb-2 text-sm">{ans.question}</p>
                    <div className="flex flex-wrap gap-2 text-xs">
                      <span className={ans.correct ? 'text-green-400' : 'text-red-400'}>
                        {ans.correct ? '✓ صح' : `✗ غلط (الصح: ${String.fromCharCode(1570 + ans.correctAnswer)})`}
                      </span>
                    </div>
                    <p className="text-purple-300 text-xs mt-2 leading-relaxed">{ans.explanation}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Action Buttons */}
        <div className="flex flex-col sm:flex-row gap-4 justify-center">
          <button 
            onClick={onGoHome}
            className="flex items-center justify-center gap-2 bg-white/10 text-white font-bold px-8 py-4 rounded-full border border-white/20 hover:bg-white/20 transition-all"
          >
            <Icons.Home />
            الصفحة الرئيسية
          </button>
          <button 
            onClick={onRestart}
            className="flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold px-8 py-4 rounded-full shadow-lg hover:shadow-purple-500/40 transition-all hover:scale-105"
          >
            <Icons.Play />
            اختبار جديد
          </button>
        </div>
      </div>
    </div>
  );
}

// Star component for footer
function AnimatedStar({ delay }) {
  return (
    <span 
      className="star inline-block text-yellow-400 text-sm mx-1" 
      style={{ animationDelay: `${delay}s` }}
    >
      <Icons.Star />
    </span>
  );
}

// Footer Component
function Footer() {
  return (
    <footer className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-black/70 backdrop-blur-md border-t border-purple-500/20 py-3 px-4 z-40">
      <div className="max-w-4xl mx-auto flex items-center justify-center">
        <div className="flex items-center gap-2">
          <AnimatedStar delay={0} />
          <AnimatedStar delay={0.3} />
          <AnimatedStar delay={0.6} />
          <p className="text-white font-bold text-sm md:text-base mx-3">
            إعداد: مجدي عبد البصير
          </p>
          <AnimatedStar delay={0.9} />
          <AnimatedStar delay={1.2} />
          <AnimatedStar delay={1.5} />
        </div>
      </div>
    </footer>
  );
}

// Main App Component
function App() {
  const quiz = useQuiz();

  return (
    <div className="min-h-screen pb-20">
      {quiz.currentView === "intro" && (
        <IntroScreen onStart={quiz.goToChapters} />
      )}

      {quiz.currentView === "chapters" && (
        <ChapterSelection onSelectChapter={quiz.startChapter} />
      )}

      {quiz.currentView === "capsule" && (
        <ChapterCapsule 
          chapterKey={quiz.selectedChapter}
          onStartQuiz={quiz.startQuiz}
          onBack={quiz.goToChapters}
        />
      )}

      {quiz.currentView === "quiz" && (
        <QuizScreen quiz={quiz} />
      )}

      {quiz.currentView === "results" && (
        <ResultsScreen 
          quiz={quiz}
          onRestart={quiz.restartQuiz}
          onGoHome={quiz.restartQuiz}
        />
      )}

      <Footer />
    </div>
  );
}

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
