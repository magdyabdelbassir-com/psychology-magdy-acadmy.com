                                        <div className="w-12 h-12 rounded-full gradient-bg flex items-center justify-center text-white font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                            {idx + 1}
                                        </div>
                                        <h3 className="text-xl font-bold text-gray-800 mb-2">{chap.title}</h3>
                                        <p className="text-indigo-600 text-sm font-semibold flex items-center">
                                            {chap.questions.length} سؤال <ArrowLeftIcon />
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'capsule' && (
                        <div className="animate-pop-in bg-white rounded-3xl p-8 card-shadow border-t-4 border-indigo-500">
                            <h2 className="text-3xl font-bold text-dark mb-6 text-center border-b pb-4 shrink-0">💊 كبسولة الفصل: {chaptersData[selectedChapter].title}</h2>
                            <div className="prose lg:prose-xl max-w-none text-gray-700 leading-relaxed mb-8">
                                <p>{chaptersData[selectedChapter].capsule}</p>
                            </div>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => setView('chapters')} className="px-6 py-3 rounded-full text-indigo-600 border-2 border-indigo-600 font-bold hover:bg-indigo-50 transition">
                                    عودة
                                </button>
                                <button onClick={startQuiz} className="px-8 py-3 rounded-full text-white gradient-bg font-bold shadow-lg hover:scale-105 transition">
                                    ابدأ الاختبار
                                </button>
                            </div>
                        </div>
                    )}

                    {view === 'quiz' && (
                        <div className="animate-fade-in relative max-w-3xl mx-auto">
                            <div className="mb-6 flex justify-between items-center bg-white p-4 rounded-2xl card-shadow">
                                <span className="font-bold text-indigo-600 text-lg">السؤال {questionIndex + 1} من {chaptersData[selectedChapter].questions.length}</span>
                                <span className="text-lg font-bold text-purple-600 bg-purple-100 px-4 py-1 rounded-full">النقاط: {score}</span>
                            </div>

                            <div className="bg-white rounded-3xl p-6 md:p-10 card-shadow border border-gray-100 mb-6">
                                <h3 className="text-2xl font-bold text-gray-800 mb-8 leading-tight">
                                    {chaptersData[selectedChapter].questions[questionIndex][0]}
                                </h3>
                                
                                <div className="space-y-4">
                                    {chaptersData[selectedChapter].questions[questionIndex][1].map((option, oIdx) => (
                                        <button 
                                            key={oIdx} 
                                            onClick={() => handleAnswer(oIdx)}
                                            className="w-full text-right p-4 rounded-xl border-2 border-gray-100 hover:border-indigo-500 hover:bg-indigo-50 font-medium text-lg text-gray-700 transition duration-200"
                                        >
                                            <span className="inline-block w-8 h-8 rounded-full bg-gray-200 text-center leading-8 ml-3 text-gray-600">{String.fromCharCode(0x0623 + oIdx)}</span>
                                            {option}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'result' && (
                        <div className="animate-pop-in bg-white rounded-3xl p-10 card-shadow text-center">
                            <div className="text-6xl mb-6">🏆</div>
                            <h2 className="text-4xl font-bold text-transparent bg-clip-text gradient-bg mb-4">اكتمل الاختبار!</h2>
                            <p className="text-2xl font-bold text-gray-700 mb-8">
                                نتيجتك: <span className="text-4xl text-indigo-600 mx-2">{score}</span> من <span className="text-2xl">{chaptersData[selectedChapter].questions.length}</span>
                            </p>
                            <button onClick={startJourney} className="px-8 py-4 rounded-full text-white gradient-bg font-bold text-xl shadow-lg hover:scale-105 transition">
                                العودة للقائمة الرئيسية
                            </button>
                        </div>
                    )}

                    {/* Modal */}
                    {modal.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-70 animate-fade-in backdrop-blur-sm">
                            <div className={`bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl relative animate-pop-in overflow-hidden ${modal.isCorrect ? 'border-4 border-green-400' : 'border-4 border-red-400'}`}>
                                <div className="text-center">
                                    <div className="text-8xl mb-4 animate-bounce-slow">{modal.emoji}</div>
                                    <h3 className={`text-3xl font-bold mb-2 ${modal.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                        {modal.isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة!'}
                                    </h3>
                                    <p className="text-xl font-bold text-gray-800 mb-6">"{modal.text}"</p>
                                    
                                    {!modal.isCorrect && (
                                        <div className="bg-green-50 border border-green-200 rounded-xl p-4 mb-6 text-right">
                                            <p className="text-green-800 font-bold mb-1">الإجابة الصحيحة هي:</p>
                                            <p className="text-green-900 text-lg flex items-center"><CheckIcon /> {modal.correctAnswer}</p>
                                        </div>
                                    )}

                                    <div className="bg-indigo-50 border-r-4 border-indigo-500 rounded-l-xl p-5 mb-8 text-right">
                                        <h4 className="font-bold text-indigo-800 mb-2 flex items-center">
                                            <svg className="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                            التعليل من المذكرة:
                                        </h4>
                                        <p className="text-indigo-900 leading-relaxed text-lg">{modal.explanation}</p>
                                    </div>

                                    <button onClick={handleNextQuestion} className="w-full px-6 py-4 rounded-full text-white gradient-bg font-bold text-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-1">
                                        السؤال التالي
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Footer -->
    <footer className="fixed bottom-0 left-0 w-full bg-dark text-white py-3 shadow-lg z-40 border-t border-indigo-900 border-opacity-50">
        <div className="max-w-4xl mx-auto px-4 flex justify-between items-center text-sm md:text-base font-medium">
            <div className="flex items-center space-x-1 space-x-reverse opacity-90 hover:opacity-100 transition-opacity">
                <span>إعداد:</span>
                <span className="font-bold text-transparent bg-clip-text bg-gradient-to-l from-purple-400 to-indigo-300">مجدي عبد البصير</span>
                <StarIcon /><StarIcon /><StarIcon />
            </div>
            <div className="text-gray-400 text-xs md:text-sm">
                منصة بنك_أسئلة_مقرر_مسببات_الاضطرابات_النفسية &copy; 2026
            </div>
        </div>
    </footer>
</body>
</html>
