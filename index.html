  {text: "أندرياس ريت، الذي وصف اضطراب ريت لأول مرة، هو طبيب أطفال من:", options: ["السويد.", "فيينا (النمسا).", "لندن.", "برلين."], correct: 1, explanation: "أندرياس ريت كان طبيب أطفال من فيينا، النمسا.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "من هو طبيب الأطفال السويدي الذي نشر مقالاً باللغة الإنجليزية عام 1983م وسُميت الحالة باسم \"ريت\"؟", options: ["بينجت هاجبرج.", "أندرياس ريت.", "ثيودور هيلر.", "هانس أسبرجر."], correct: 0, explanation: "بينجت هاجبرج نشر مقالاً بالإنجليزية عام 1983 وسُميت الحالة باسم ريت.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الاضطراب التفككي في مرحلة الطفولة يُعرف أيضاً باسم:", options: ["متلازمة أسبرجر.", "متلازمة ريت.", "متلازمة هيلر.", "متلازمة داون."], correct: 2, explanation: "الاضطراب التفككي في مرحلة الطفولة يُعرف بمتلازمة هيلر (Heller\'s Syndrome).", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "متلازمة هيلر (الاضطراب التفككي في مرحلة الطفولة) هي متلازمة سريرية غير متجانسة نادرة تختلف عن:", options: ["الفصام والبارانويا.", "التوحد ومتلازمة أسبرجر.", "اضطراب الهلع والقلق.", "الاكتئاب والهوس."], correct: 1, explanation: "متلازمة هيلر تختلف عن التوحد ومتلازمة أسبرجر رغم وجود بعض أوجه التشابه.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تتميز \"متلازمة هيلر\" بانحدار نمائي وفقدان للمهارات اللغوية والاجتماعية بعد فترة من التطور الطبيعي لمدة:", options: ["6 أشهر على الأقل.", "سنتين على الأقل.", "عشر سنوات.", "شهر واحد."], correct: 1, explanation: "متلازمة هيلر تتميز بانحدار نمائي بعد فترة تطور طبيعي لمدة سنتين على الأقل.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تم الإبلاغ عن الاضطراب التفككي في مرحلة الطفولة لأول مرة عام 1908 من قِبل العالم:", options: ["بينجت هاجبرج.", "أندرياس ريت.", "ثيودور هيلر.", "ليو كانر."], correct: 2, explanation: "ثيودور هيلر أبلغ عن الاضطراب التفككي في مرحلة الطفولة لأول مرة عام 1908.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "نشر ثيودور هيلر ورقته البحثية عام 1908 حول الاضطراب التفككي تحت عنوان:", options: ["الخرف المبكر (Dementia Praecox).", "خرف الأطفال (Über Dementia Infantilis).", "طيف التوحد (Autism Spectrum).", "الفصام (Schizophrenia)."], correct: 1, explanation: "هيلر نشر ورقته تحت عنوان \"خرف الأطفال\" (Über Dementia Infantilis) عام 1908.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يوصي المعهد الوطني لرعاية صحة الطفل (NFCH) بإجراء الفحص لجميع أطفال المملكة المتحدة في أوقات محددة، منها:", options: ["عند سن 10 سنوات فقط.", "عند الولادة، سن 6 أسابيع، 6-9 أشهر، 18-24 شهراً، و 3-3.5 سنة.", "عند البلوغ فقط.", "عند سن 5 سنوات فقط."], correct: 1, explanation: "NFCH يوصي بفحوصات في أوقات محددة من الولادة حتى سن 3-3.5 سنة.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "عادةً ما يتم إجراء فحوصات الأطفال حديثي الولادة وفحوصات 6 أسابيع من قِبل:", options: ["أطباء الأطفال أو الممارسين العامين.", "الزائرين الصحيين فقط.", "المعلمين في المدارس.", "الأخصائيين النفسيين."], correct: 0, explanation: "فحوصات حديثي الولادة و6 أسابيع تُجرى عادةً من قبل أطباء الأطفال أو الممارسين العامين.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يتم إجراء الفحص لمدة 7 أشهر بشكل أساسي من قِبل:", options: ["الممارسين العامين.", "الزائرين الصحيين (ممرضون متخصصون).", "معالجي النطق.", "أطباء الأعصاب."], correct: 1, explanation: "الفحص عند 7 أشهر يتم إجراؤه بشكل أساسي من قبل الزائرين الصحيين.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الزائرون الصحيون هم:", options: ["أطباء جراحة عامة.", "ممرضون متخصصون من ذوي الخبرة في العمل مع الأطفال والأسر.", "أخصائيون اجتماعيون في المدارس.", "معالجون نفسيون."], correct: 1, explanation: "الزائرون الصحيون هم ممرضون متخصصون من ذوي الخبرة في العمل مع الأطفال والأسر.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يتم إجراء فحوصات الأطفال وفقاً للمبادئ التوجيهية الواردة في تقرير:", options: ["الطب النفسي للأطفال.", "الصحة للجميع.", "الصحة لجميع الأطفال.", "الصحة العالمية."], correct: 2, explanation: "فحوصات الأطفال تتم وفقاً لتقرير \"الصحة لجميع الأطفال\".", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يؤكد تقرير \"الصحة لجميع الأطفال\" على كل ما يلي *ما عدا*:", options: ["استمرارية الرعاية وإبداء الملاحظات.", "الاختبارات الإلزامية الصارمة.", "الابتعاد عن الاختبارات الإلزامية.", "الإرشاد والتوجيه."], correct: 1, explanation: "التقرير يؤكد على الابتعاد عن الاختبارات الإلزامية الصارمة وليس فرضها.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
    {text: "تُعد زيارات ........ في الشهرين والثالث والرابع والثالث عشر فرصة للعاملين في الرعاية الأولية لمناقشة مخاوف نمو الطفل:", options: ["التحصين (التطعيم).", "الطوارئ.", "العمليات الجراحية.", "الزيارات الروتينية."], correct: 0, explanation: "زيارات التحصين (التطعيم) توفر فرصة لمناقشة مخاوف نمو الطفل.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تتم معالجة جميع الإحالات الخاصة بأطفال ما قبل المدرسة وتنسيقها من خلال:", options: ["أقسام الطوارئ بالمستشفيات.", "مراكز تنمية الطفل.", "المدارس الابتدائية.", "المستشفيات النفسية."], correct: 1, explanation: "إحالات أطفال ما قبل المدرسة تتم معالجتها وتنسيقها من خلال مراكز تنمية الطفل.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "شارك في عملية الإحالة للأطفال الأكبر من 3 سنوات مهنيون آخرون مثل:", options: ["معالجي النطق واللغة.", "جراحي الأعصاب.", "أطباء الأسنان.", "المهندسين."], correct: 0, explanation: "معالجو النطق واللغة يشاركون في عملية الإحالة للأطفال الأكبر من 3 سنوات.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يشارك علماء النفس في التشخيص والتصنيف ودعم التخطيط للأشخاص ذوي:", options: ["الإعاقة الذهنية (ID) والإعاقات التنموية.", "أمراض القلب والأوعية الدموية.", "الكسور الجراحية فقط.", "أمراض الجلد."], correct: 0, explanation: "علماء النفس يشاركون في التشخيص والتخطيط لذوي الإعاقة الذهنية والتنموية.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تُعد اضطرابات النمو المنتشرة (PDD) مجموعة من الحالات التي تؤثر بشكل أساسي على:", options: ["الجهاز الهضمي والتنفسي.", "التفاعل الاجتماعي، التواصل، والسلوك.", "نمو العظام والعضلات.", "الجهاز المناعي."], correct: 1, explanation: "اضطرابات النمو المنتشرة تؤثر على التفاعل الاجتماعي، التواصل، والسلوك.", category: "mcq", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الكشف المبكر عن اضطرابات النمو أمر غير ضروري ويمكن تأجيله حتى سن المدرسة.", options: ["صح", "خطأ"], correct: 1, explanation: "الكشف المبكر ضروري جداً ولا يجب تأجيله.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "قد يؤثر تحديد اضطراب النمو ومسبباته الكامنة على تنظيم الأسرة لوالدي الطفل.", options: ["صح", "خطأ"], correct: 0, explanation: "تشخيص اضطراب النمو قد يؤثر على تنظيم الأسرة والحياة الأسرية.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تُستخدم مصطلحات \"تأخر النمو\" و \"النمو المضطرب\" للإشارة إلى معانٍ مختلفة تماماً ولا يُعتبران مترادفين.", options: ["صح", "خطأ"], correct: 1, explanation: "هذه المصطلحات تُستخدم بشكل مترادف.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "كانت معدلات انتشار التوحد في السبعينيات تُقدر بحوالي 2 لكل 10,000 طفل، مما جعله يُعتبر حالة نادرة.", options: ["صح", "خطأ"], correct: 0, explanation: "هذه الإحصائية صحيحة عن معدل انتشار التوحد في السبعينيات.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "أظهر المسح الإنجليزي عام 2006 انخفاضاً حاداً في معدلات الإصابة بالاضطرابات النمائية الشاملة مقارنة بالسبعينيات.", options: ["صح", "خطأ"], correct: 1, explanation: "المسح أظهر ارتفاعاً وليس انخفاضاً في معدلات الإصابة.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الارتفاع الواضح في معدلات التوحد قد يعكس زيادة الوعي العام وارتباطه أحياناً بقدرة فكرية عالية، وليس بالضرورة زيادة فعلية في المرض فقط.", options: ["صح", "خطأ"], correct: 0, explanation: "الارتفاع قد يعكس زيادة الوعي وتحسين منهجيات التشخيص.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "متلازمة أسبرجر تُعد من اضطرابات طيف التوحد وتتميز بضعف التفاعل الاجتماعي والتواصل غير اللفظي.", options: ["صح", "خطأ"], correct: 0, explanation: "متلازمة أسبرجر من اضطرابات طيف التوحد مع ضعف في التفاعل الاجتماعي.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تم وصف اضطراب \"ريت\" لأول مرة باللغة الإنجليزية عام 1966م.", options: ["صح", "خطأ"], correct: 1, explanation: "تم وصفه باللغة الألمانية عام 1966 وليس الإنجليزية.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "العالم \"أندرياس ريت\" هو طبيب أطفال من فيينا هو أول من وصف حالة ريت.", options: ["صح", "خطأ"], correct: 0, explanation: "أندرياس ريت طبيب أطفال من فيينا ووصف الحالة لأول مرة.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "نُشر مقال باللغة الإنجليزية عن متلازمة ريت عام 1983م بواسطة طبيب الأطفال السويدي \"بينجت هاجبرج\".", options: ["صح", "خطأ"], correct: 0, explanation: "هذا صحيح، هاجبرج نشر المقال بالإنجليزية عام 1983.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الاضطراب التفككي في مرحلة الطفولة يُعرف أيضاً بـ \"متلازمة هيلر\".", options: ["صح", "خطأ"], correct: 0, explanation: "الاضطراب التفككي في مرحلة الطفولة = متلازمة هيلر.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الأطفال المصابون بمتلازمة هيلر يظهر عليهم تدهور وفقدان للمهارات منذ يوم الولادة مباشرة.", options: ["صح", "خطأ"], correct: 1, explanation: "الأطفال يظهرون تطوراً طبيعياً لسنتين على الأقل قبل الانحدار.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تحدث متلازمة هيلر (الانحدار النمائي) بعد فترة من التطور الطبيعي للطفل لمدة لا تقل عن سنتين.", options: ["صح", "خطأ"], correct: 0, explanation: "الانحدار يحدث بعد فترة تطور طبيعي لا تقل عن سنتين.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "تم الإبلاغ عن حالة متلازمة هيلر لأول مرة عام 1908م في ورقة بحثية بعنوان (Über Dementia Infantilis).", options: ["صح", "خطأ"], correct: 0, explanation: "هذا صحيح، هيلر نشر ورقته عام 1908.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يوصي المعهد الوطني لرعاية صحة الطفل (NFCH) بالبدء في فحص الأطفال عند وصولهم لسن 3 سنوات فقط.", options: ["صح", "خطأ"], correct: 1, explanation: "الفحص يبدأ من الولادة وليس من سن 3 سنوات.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "فحوصات الأطفال حديثي الولادة وعمر 6 أسابيع تُجرى عادة بواسطة أطباء الأطفال أو الممارسين العامين.", options: ["صح", "خطأ"], correct: 0, explanation: "هذه الفحوصات تُجرى بواسطة أطباء الأطفال أو الممارسين العامين.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "الزائرون الصحيون هم أطباء جراحون متخصصون في عمليات المخ والأعصاب للأطفال.", options: ["صح", "خطأ"], correct: 1, explanation: "الزائرون الصحيون هم ممرضون متخصصون وليسوا أطباء جراحة.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يؤكد تقرير \"الصحة لجميع الأطفال\" على أهمية الاختبارات الإلزامية الصارمة ويبتعد عن تقديم الإرشادات الصحية.", options: ["صح", "خطأ"], correct: 1, explanation: "التقرير يؤكد على الابتعاد عن الاختبارات الإلزامية الصارمة.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "زيارات التحصين (التطعيم) في الأشهر الأولى من عمر الطفل توفر فرصة ذهبية لمناقشة أي مخاوف حول نموه وتطوره.", options: ["صح", "خطأ"], correct: 0, explanation: "زيارات التحصين توفر فرصة لمناقشة مخاوف النمو.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "مراكز تنمية الطفل هي الجهة المسؤولة عن تنسيق جميع الإحالات الخاصة بأطفال ما قبل المدرسة.", options: ["صح", "خطأ"], correct: 0, explanation: "مراكز تنمية الطفل تنسق الإحالات لأطفال ما قبل المدرسة.", category: "truefalse", chapter: "الفصل الخامس: الاضطرابات النمائية الشاملة"},
  {text: "يُشترط لتشخيص حالة \"التخلف العقلي\" توافر ثلاثة معايير أساسية، هي: انخفاض ملحوظ في مستوى الذكاء العام، ظهور الحالة قبل سن 18 عاماً، و........ :", options: ["وجود هلاوس سمعية وبصرية.", "قصور واضح في السلوك التكيفي (Adaptive Behavior).", "وجود خلل في التناسق الحركي فقط.", "وجود اضطرابات نطق."], correct: 1, explanation: "تشخيص التخلف العقلي يتطلب انخفاضاً في الذكاء، وقصوراً في السلوك التكيفي، وأن يظهر قبل سن 18.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يُقصد بـ ........ مجموعة المهارات المفاهيمية والاجتماعية والعملية التي يتعلمها الأفراد لكي يعملوا في حياتهم اليومية:", options: ["الذكاء الأكاديمي.", "السلوك التكيفي (الاجتماعي).", "الإدراك الحسي.", "النضج العاطفي."], correct: 1, explanation: "السلوك التكيفي (Adaptive Behavior) هو مجموعة المهارات المفاهيمية والاجتماعية والعملية للحياة اليومية.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "وفقاً للدليل التشخيصي والإحصائي، يُشخص الفرد بالتخلف العقلي إذا كانت نسبة ذكائه (IQ) تقل عن:", options: ["90", "85", "70", "60"], correct: 2, explanation: "تشخيص التخلف العقلي يتطلب أن يكون IQ أقل من 70.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يصنف التخلف العقلي إلى أربع فئات (بسيط، متوسط، شديد، عميق). فئة التخلف العقلي \"البسيط\" (Mild) تتراوح نسبة ذكائهم بين:", options: ["50-55 وحتى 70.", "35-40 وحتى 50-55.", "20-25 وحتى 35-40.", "أقل من 20-25."], correct: 0, explanation: "التخلف البسيط (Mild) يتراوح IQ بين 50-55 إلى 70.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "فئة التخلف العقلي \"المتوسط\" (Moderate) تتراوح نسبة ذكائهم بين:", options: ["أقل من 20.", "50-55 وحتى 70.", "35-40 وحتى 50-55.", "20-25 وحتى 35-40."], correct: 2, explanation: "التخلف المتوسط (Moderate) يتراوح IQ بين 35-40 إلى 50-55.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "فئة التخلف العقلي \"الشديد\" (Severe) تتراوح نسبة ذكائهم بين:", options: ["20-25 وحتى 35-40.", "35-40 وحتى 50-55.", "50-55 وحتى 70.", "أقل من 20."], correct: 0, explanation: "التخلف الشديد (Severe) يتراوح IQ بين 20-25 إلى 35-40.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "تشكل فئة التخلف العقلي ........ الغالبية العظمى من حالات التخلف العقلي (حوالي 85% من الحالات):", options: ["البسيط (Mild).", "المتوسط (Moderate).", "العميق (Profound).", "الشديد (Severe)."], correct: 0, explanation: "التخلف البسيط يشكل حوالي 85% من الحالات.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "في التصنيف التربوي، يُطلق على فئة التخلف العقلي \"البسيط\" مصطلح:", options: ["القابلين للتدريب (Trainable).", "القابلين للتعلم (Educable).", "الاعتماديين (Custodial).", "المستقلين."], correct: 1, explanation: "فئة التخلف البسيط يُطلق عليهم \"القابلين للتعلم\" (Educable).", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "في التصنيف التربوي، يُطلق على الأطفال ذوي التخلف العقلي \"المتوسط\" مصطلح:", options: ["الاعتماديين.", "القابلين للتعلم.", "القابلين للتدريب (Trainable).", "المستقلين."], correct: 2, explanation: "فئة التخلف المتوسط يُطلق عليهم \"القابلين للتدريب\" (Trainable).", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الأفراد ذوو التخلف العقلي \"العميق\" (Profound) يتميزون بـ:", options: ["نسبة ذكاء أقل من 20-25 وحاجتهم لرعاية وإشراف مستمرين طوال حياتهم.", "قدرتهم على إنهاء المرحلة الابتدائية بنجاح.", "استقلاليتهم التامة في المهارات المهنية.", "قدرتهم على العمل بشكل مستقل."], correct: 0, explanation: "التخلف العميق يتراوح IQ أقل من 20-25 ويحتاجون لرعاية مستمرة طوال الحياة.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "من أشهر أسباب التخلف العقلي الناتجة عن \"شذوذ الكروموسومات\" (تثلث الكروموسوم 21):", options: ["متلازمة داون (Down Syndrome).", "الفينيل كيتون يوريا (PKU).", "استسقاء الدماغ (Hydrocephalus).", "متلازمة الكحول الجنينية."], correct: 0, explanation: "متلازمة داون تنتج عن تثلث الكروموسوم 21 (Trisomy 21).", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "حالة \"الفينيل كيتون يوريا (PKU)\" التي تؤدي إلى تخلف عقلي تنتج عن:", options: ["صدمة على الرأس بعد الولادة.", "اضطراب وراثي في التمثيل الغذائي (الأيض) يمنع هضم بروتين معين.", "إدمان الأم الحامل للكحول.", "نقص الأكسجين أثناء الولادة."], correct: 1, explanation: "PKU هو اضطراب وراثي في التمثيل الغذائي يمنع هضم الفينيل ألانين.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يُعرف كبر حجم الجمجمة نتيجة تجمع السائل المخي الشوكي حول الدماغ مما يضغط على خلايا المخ ويسبب التخلف العقلي بـ:", options: ["صغر الجمجمة (Microcephaly).", "استسقاء الدماغ (Hydrocephalus).", "متلازمة إكس الهش (Fragile X).", "متلازمة داون."], correct: 1, explanation: "استسقاء الدماغ (Hydrocephalus) هو تجمع السائل المخي الشوكي حول الدماغ.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "إصابة الأم الحامل بمرض ........ في الأشهر الثلاثة الأولى من الحمل يُعد من الأسباب الخطيرة المؤدية للتخلف العقلي للجنين:", options: ["الحصبة الألمانية (Rubella).", "الزكام العادي.", "الصداع النصفي.", "الإنفلونزا البسيطة."], correct: 0, explanation: "الحصبة الألمانية في الأشهر الثلاثة الأولى من الحمل من أخطر أسباب التخلف العقلي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يُعد \"نقص الأكسجين (Anoxia/Hypoxia)\" من الأسباب المؤدية للتخلف العقلي، ويحدث غالباً:", options: ["قبل الولادة (أثناء تكون الجنين).", "أثناء عملية الولادة (أسباب ولادية).", "في سن المراهقة.", "في سن الشيخوخة."], correct: 1, explanation: "نقص الأكسجين أثناء عملية الولادة من الأسباب الولادية للتخلف العقلي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التهاب السحايا (Meningitis) والتهاب الدماغ (Encephalitis) من أسباب التخلف العقلي التي تحدث:", options: ["ما قبل الولادة.", "أثناء عملية الولادة.", "ما بعد الولادة (مرحلة الطفولة).", "في سن البلوغ."], correct: 2, explanation: "التهاب السحايا والدماغ من أسباب ما بعد الولادة التي تؤدي للتخلف العقلي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يُطلق على الاضطراب الذي ينتج عن تناول الأم الحامل للكحول بشراهة، ويؤدي إلى تشوهات وجهية وتخلف عقلي لدى الطفل:", options: ["متلازمة داون.", "متلازمة الكحول الجنينية (FAS).", "متلازمة أسبرجر.", "متلازمة ريت."], correct: 1, explanation: "متلازمة الكحول الجنينية (FAS) تنتج عن تناول الأم للكحول أثناء الحمل.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "من خصائص التفكير لدى الأطفال ذوي التخلف العقلي أنه تفكير:", options: ["مجرد ومعقد.", "عياني (ملموس) ومحدود.", "فلسفي وعميق.", "تجريدي وعالي."], correct: 1, explanation: "تفكير الأطفال ذوي التخلف العقلي يتسم بأنه عياني (ملموس) ومحدود.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "بمقارنة التخلف العقلي بالمرض العقلي (الذهان)، نجد أن التخلف العقلي:", options: ["يظهر غالباً في مرحلة متأخرة من العمر (الشيخوخة).", "هو نقص أو توقف في نمو الذكاء منذ الطفولة المبكرة وليس تدهوراً بعد اكتمال النمو.", "يمكن علاجه تماماً بالأدوية المضادة للاكتئاب.", "ينتج عن صدمة نفسية حادة."], correct: 1, explanation: "التخلف العقلي هو نقص في نمو الذكاء منذ الطفولة، بينما الذهان هو تدهور بعد اكتمال النمو.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "استخدام مقياس \"فاينلاند (Vineland)\" يُعتبر من أشهر الأدوات المستخدمة لقياس:", options: ["التوافق الزواجي.", "الميول المهنية.", "النضج الاجتماعي والسلوك التكيفي.", "الذكاء الفطري."], correct: 2, explanation: "مقياس فاينلاند يقيس النضج الاجتماعي والسلوك التكيفي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الأطفال ذوو التخلف العقلي ........ يمكنهم اكتساب المهارات الأكاديمية الأساسية (حتى مستوى الصف السادس الابتدائي تقريباً) إذا تلقوا تعليماً خاصاً:", options: ["البسيط (Educable).", "الشديد (Severe).", "العميق (Profound).", "المتوسط (Trainable)."], correct: 0, explanation: "أطفال التخلف البسيط (Educable) يمكنهم اكتساب مهارات أكاديمية حتى مستوى الصف السادس الابتدائي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يتميز الأطفال المصابون بمتلازمة داون بخصائص جسدية واضحة منها:", options: ["طول القامة المفرط.", "طية في الجفن الداخلي للعين (Epicanthic fold)، وتفلطح الوجه.", "كبر حجم الجمجمة بشكل غير طبيعي.", "نحافة شديدة."], correct: 1, explanation: "متلازمة داون تتميز بطية في الجفن الداخلي وتفلطح الوجه وقصر القامة.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "للحد من حالات التخلف العقلي الناتجة عن أسباب وراثية، يُنصح طبياً بـ:", options: ["تشجيع زواج الأقارب.", "الاستشارة الجينية والفحص الطبي قبل الزواج.", "استخدام العلاج بالصدمات الكهربائية للوالدين.", "تجنب اللقاحات."], correct: 1, explanation: "الاستشارة الجينية قبل الزواج تساعد في الحد من التخلف العقلي الوراثي.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التخلف العقلي الذي ليس له سبب عضوي واضح ويُعزى غالباً للحرمان البيئي والاجتماعي والثقافي الشديد يُسمى:", options: ["التخلف العقلي الوراثي.", "التخلف العقلي العائلي الثقافي (Cultural-familial).", "استسقاء الدماغ.", "متلازمة الكحول الجنينية."], correct: 1, explanation: "التخلف العقلي العائلي الثقافي ينتج عن الحرمان البيئي والاجتماعي الشديد.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التعرض للإشعاع بكثرة أثناء الحمل يُصنف ضمن الأسباب ........ للتخلف العقلي:", options: ["الوراثية الجينية.", "البيئية (ما قبل الولادة).", "أسباب ما بعد الولادة.", "الولادية."], correct: 1, explanation: "التعرض للإشعاع أثناء الحمل من الأسباب البيئية ما قبل الولادة.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
    {text: "يُقصد بالعمر العقلي (Mental Age):", options: ["عدد السنوات التي عاشها الطفل منذ ولادته.", "مستوى الأداء العقلي الذي وصل إليه الطفل مقارنة بمتوسط أداء الأطفال في نفس سنه.", "العمر المتوقع للطفل عند وفاته.", "عمر الأب والأم مجتمعين."], correct: 1, explanation: "العمر العقلي هو مستوى الأداء العقلي مقارنة بمتوسط أداء الأطفال في نفس السن الزمني.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "حالة صغر حجم الجمجمة (Microcephaly) تؤدي إلى التخلف العقلي بسبب:", options: ["الضغط الزائد من السائل الشوكي.", "عدم إتاحة الحيز الكافي لنمو الدماغ بشكل طبيعي.", "خلل في إفرازات الغدة الدرقية.", "زيادة ضغط الدم."], correct: 1, explanation: "Microcephaly تؤدي لصغر حجم المخ وعدم إتاحة الحيز الكافي لنمو الدماغ.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "نقص إفراز هرمون الغدة الدرقية (Thyroid) منذ الطفولة المبكرة يؤدي إلى حالة من التخلف العقلي والتقزم تُسمى:", options: ["الفينيل كيتون يوريا.", "القصاع أو الفدامة (Cretinism).", "متلازمة داون.", "استسقاء الدماغ."], correct: 1, explanation: "نقص إفراز الغدة الدرقية يؤدي إلى القصاع (Cretinism) وهو تخلف عقلي مع تقزم.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التسمم بالرصاص (Lead poisoning) الناتج عن تناول الطفل لطلاء الجدران القديم يُعد سبباً ........ للتخلف العقلي:", options: ["وراثياً.", "بيئياً (ما بعد الولادة).", "بيولوجياً جينياً.", "ولادياً."], correct: 1, explanation: "التسمم بالرصاص من الأسباب البيئية ما بعد الولادة.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "عندما نقول أن طفلاً ما يعاني من \"إعاقة مزدوجة\" (Dual Diagnosis)، فإننا نعني أنه:", options: ["ذكي جداً ولكنه انطوائي.", "يعاني من تخلف عقلي مصحوب باضطراب نفسي أو عقلي آخر (كالفصام أو التوحد).", "يتحدث لغتين مختلفتين.", "لديه إعاقة جسدية وذهنية."], correct: 1, explanation: "الإعاقة المزدوجة تعني وجود تخلف عقلي مع اضطراب نفسي أو عقلي آخر.", category: "mcq", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يُمكن تشخيص شخص ما بالتخلف العقلي بناءً على درجة اختبار الذكاء (IQ) فقط، حتى لو كان سلوكه التكيفي ممتازاً.", options: ["صح", "خطأ"], correct: 1, explanation: "التشخيص يتطلب قصوراً في الذكاء والسلوك التكيفي معاً.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "من شروط تشخيص التخلف العقلي أن تظهر أعراض القصور العقلي والتكيفي قبل سن الثامنة عشرة.", options: ["صح", "خطأ"], correct: 0, explanation: "يُشترط ظهور القصور قبل سن 18 عاماً.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "فئة التخلف العقلي \"البسيط\" هم الأقل انتشاراً بين جميع فئات التخلف العقلي.", options: ["صح", "خطأ"], correct: 1, explanation: "البسيط هم الأكثر انتشاراً (85%).", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "يمكن للأفراد ذوي التخلف العقلي البسيط الاندماج في المجتمع والحصول على وظائف بسيطة ببعض التوجيه والدعم.", options: ["صح", "خطأ"], correct: 0, explanation: "أصحاب التخلف البسيط يمكنهم الاندماج في المجتمع والعمل بوظائف بسيطة.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "متلازمة داون تنتج عن خلل جيني وراثي في عملية التمثيل الغذائي.", options: ["صح", "خطأ"], correct: 1, explanation: "متلازمة داون تنتج عن تثلث الكروموسوم 21 وليس خلل في التمثيل الغذائي.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "مرض الفينيل كيتون يوريا (PKU) يمكن اكتشافه مبكراً بعد الولادة مباشرة عن طريق فحص بسيط للدم.", options: ["صح", "خطأ"], correct: 0, explanation: "PKU يمكن اكتشافه مبكراً بعد الولادة بفحص بسيط للدم (heel prick test).", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "إذا تم اكتشاف حالة الفينيل كيتون يوريا (PKU) مبكراً، يمكن منع التخلف العقلي من خلال وضع الطفل على حمية غذائية صارمة.", options: ["صح", "خطأ"], correct: 0, explanation: "الحمية الخالية من الفينيل ألانين تمنع التخلف العقلي في حالة PKU.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "استسقاء الدماغ (Hydrocephalus) هو كبر غير طبيعي في حجم الجمجمة ناتج عن تراكم السوائل، وقد يتم علاجه جراحياً بتسريب السائل لمنع التلف العقلي.", options: ["صح", "خطأ"], correct: 0, explanation: "الاستسقاء يمكن علاجه جراحياً بتسريب السائل.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "نقص الأكسجين والولادة المتعسرة واستخدام الجفت بشكل خاطئ تعتبر من أسباب التخلف العقلي (أثناء الولادة).", options: ["صح", "خطأ"], correct: 0, explanation: "هذه من الأسباب الولادية للتخلف العقلي.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الحصبة الألمانية لا تشكل أي خطر على الجنين إذا أُصيبت بها الأم في الأشهر الثلاثة الأولى من الحمل.", options: ["صح", "خطأ"], correct: 1, explanation: "الحصبة الألمانية خطيرة جداً على الجنين في الأشهر الثلاثة الأولى.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "سوء التغذية الحاد والحرمان البيئي الشديد في السنوات الأولى من عمر الطفل يمكن أن يؤديا إلى انخفاض دائم في مستوى الذكاء.", options: ["صح", "خطأ"], correct: 0, explanation: "سوء التغذية والحرمان البيئي يمكن أن يؤديا لانخفاض دائم في الذكاء.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الأشخاص في فئة التخلف العقلي العميق (Profound) قادرون على إكمال تعليمهم المدرسي حتى المرحلة الإعدادية.", options: ["صح", "خطأ"], correct: 1, explanation: "فئة العميق تحتاج لرعاية مستمرة ولا يمكنها إكمال التعليم المدرسي.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "زواج الأقارب يزيد من احتمالية ظهور الأمراض الجينية المتنحية التي قد تسبب التخلف العقلي.", options: ["صح", "خطأ"], correct: 0, explanation: "زواج الأقارب يزيد من احتمالية التقاء الجينات المتنحية الحاملة للأمراض.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التخلف العقلي هو مرض عقلي (ذهان) يبدأ بعد اكتمال نمو المخ وتتدهور فيه الشخصية تماماً.", options: ["صح", "خطأ"], correct: 1, explanation: "التخلف العقلي هو نقص في نمو الذكاء منذ الطفولة وليس تدهوراً بعد اكتمال النمو.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الطفل المصاب بـ \"القصاع\" (Cretinism) يعاني من تأخر عقلي بسبب نقص شديد في إفراز الغدة الدرقية.", options: ["صح", "خطأ"], correct: 0, explanation: "القصاع ناتج عن نقص إفراز الغدة الدرقية.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "مقياس \"فاينلاند\" يُستخدم لتقييم القدرات الأكاديمية كالقراءة والكتابة فقط.", options: ["صح", "خطأ"], correct: 1, explanation: "فاينلاند يقيس النضج الاجتماعي والسلوك التكيفي وليس القدرات الأكاديمية.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "متلازمة الكحول الجنينية (FAS) هي من الأسباب البيئية القابلة للمنع والوقاية بنسبة 100%.", options: ["صح", "خطأ"], correct: 0, explanation: "FAS قابل للوقاية بنسبة 100% بتجنب شرب الكحول أثناء الحمل.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "التفكير عند المعاقين عقلياً يتسم بالقدرة العالية على التجريد والتخيل الواسع.", options: ["صح", "خطأ"], correct: 1, explanation: "التفكير عند ذوي التخلف العقلي يتسم بأنه عياني ومحدود.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "في الدليل التشخيصي الخامس (DSM-5)، تم استبدال مصطلح \"التخلف العقلي\" بمصطلح \"الإعاقة الفكرية\" (Intellectual Disability).", options: ["صح", "خطأ"], correct: 0, explanation: "DSM-5 استبدل مصطلح التخلف العقلي بالإعاقة الفكرية.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "الفئة القابلة للتدريب (Trainable) يمكنهم تعلم مهارات العناية بالذات والحماية من الأخطار، وتقابل فئة التخلف العقلي المتوسط.", options: ["صح", "خطأ"], correct: 0, explanation: "القابلين للتدريب يقابلون فئة التخلف المتوسط.", category: "truefalse", chapter: "الفصل السادس: التخلف العقلي"},
  {text: "فقد وزن بارز بغياب الحمية عن الطعام، أو كسب وزن، يُعد من أعراض:", options: ["اضطرابات الأكل.", "اضطراب عسر المزاج.", "النوبة الاكتئابية الجسيمة (Major Depressive Episode).", "الوسواس القهري."], correct: 2, explanation: "فقدان أو زيادة الوزن من أعراض النوبة الاكتئابية الجسيمة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يتضمن اضطراب ........ قصة عرضين هضميين على الأقل ما عدا الألم (الغثيان، الانتفاخ، القيء، الإسهال):", options: ["اضطرابات الأكل.", "اضطراب الجسدنة (Somatization Disorder).", "اضطرابات الإطعام.", "توهم المرض."], correct: 1, explanation: "اضطراب الجسدنة يتضمن أعراضاً جسدية متعددة منها عرضان هضميان على الأقل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الانشغال بمخاوف من حصول مرض خطير أو الانشغال بفكرة أن لدى الشخص مرضاً خطيراً يُشير إلى:", options: ["Pain Disorder (اضطراب الألم).", "Somatization (الجسدنة).", "Hypochondrial (توهم المرض).", "اضطراب التحول."], correct: 2, explanation: "توهم المرض (Hypochondriasis) يتميز بالانشغال بمخاوف من وجود مرض خطير رغم الفحوصات السليمة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "تتميز الاضطرابات الجسدية الشكل (Somatoform Disorders) بوجود أعراض جسدية:", options: ["ناتجة عن خلل عضوي طبي واضح.", "تُفتعل عمداً وبشكل مقصود (تمارض).", "توحي بوجود حالة طبية ولكن لا يمكن تفسيرها بالكامل من خلال حالة طبية أو تأثير دواء، ولا تُفتعل عمداً.", "غير حقيقية تماماً."], correct: 2, explanation: "الاضطرابات الجسدية الشكل توحي بوجود حالة طبية لكنها لا تُفتعل عمداً ولا يمكن تفسيرها طبياً بالكامل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يُشترط لتشخيص اضطراب الجسدنة (Somatization) وجود تاريخ من الشكاوى الجسدية يبدأ قبل سن:", options: ["30 عاماً.", "18 عاماً.", "12 عاماً.", "21 عاماً."], correct: 0, explanation: "يُشترط أن يبدأ تاريخ الشكاوى الجسدية قبل سن 30 عاماً لتشخيص الجسدنة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "من المعايير التشخيصية لاضطراب الجسدنة، أن يبلغ المريض عن وجود ........ أعراض ألم (في مواضع مختلفة كالمفاصل أو الصدر):", options: ["عرضين.", "أربعة أعراض.", "عرض واحد فقط.", "ستة أعراض."], correct: 1, explanation: "يُشترط وجود أربعة أعراض ألم في مواضع مختلفة لتشخيص اضطراب الجسدنة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب ........ يتميز بوجود عجز أو تغيير في الوظائف الحركية الإرادية أو الحسية يوحي بوجود حالة عصبية طبية (مثل الشلل أو العمى الهستيري):", options: ["توهم المرض.", "التحول (Conversion Disorder).", "تشوه صورة الجسد.", "الجسدنة."], correct: 1, explanation: "اضطراب التحول (Conversion) يتميز بعجز أو تغيير في الوظائف الحركية أو الحسية دون أساس عضوي.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الانشغال بوجود عيب متخيل في المظهر الخارجي، أو مبالغة شديدة في عيب بدني طفيف، يُعرف باضطراب:", options: ["تشوه صورة الجسد (Body Dysmorphic Disorder).", "الألم الجسدي.", "الهوس الاكتئابي.", "الوسواس القهري."], correct: 0, explanation: "اضطراب تشوه صورة الجسد (BDD) يتميز بالانشغال بعيب متخيل أو مبالغة في عيب طفيف في المظهر.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "تنقسم اضطرابات المزاج بشكل رئيسي إلى فئتين أساسيتين هما:", options: ["اضطرابات القلق واضطرابات الهلع.", "الاضطرابات الاكتئابية والاضطرابات ثنائية القطب (Bipolar).", "الاضطرابات الانشقاقية واضطرابات الشخصية.", "الاضطرابات النمائية والاضطرابات السلوكية."], correct: 1, explanation: "اضطرابات المزاج تنقسم إلى الاضطرابات الاكتئابية والاضطرابات ثنائية القطب (Bipolar).", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "لكي يتم تشخيص النوبة الاكتئابية الجسيمة، يجب أن تستمر الأعراض (مثل المزاج المكتئب وفقدان الاهتمام) لمدة لا تقل عن:", options: ["أسبوعين.", "6 أشهر.", "سنتين.", "شهر واحد."], correct: 0, explanation: "تستمر النوبة الاكتئابية الجسيمة لمدة لا تقل عن أسبوعين.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب \"عسر المزاج\" (Dysthymic Disorder) هو اكتئاب مزمن لكنه أقل شدة، ويُشترط لتشخيصه عند البالغين استمراره لمدة لا تقل عن:", options: ["أسبوعين.", "6 أشهر.", "سنتين.", "5 سنوات."], correct: 2, explanation: "عسر المزاج (Dysthymia) يستمر لمدة لا تقل عن سنتين عند البالغين.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يتميز الاضطراب ثنائي القطب من النوع الأول (Bipolar I) بوجود:", options: ["نوبات اكتئاب فقط طوال الحياة.", "نوبة هوس (Manic Episode) واحدة على الأقل، سواء صاحبها اكتئاب أم لا.", "نوبات من الهوس الخفيف فقط.", "نوبات قلق فقط."], correct: 1, explanation: "Bipolar I يتطلب وجود نوبة هوس واحدة على الأقل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "تناقص الحاجة إلى النوم (يشعر المريض بالراحة بعد 3 ساعات فقط من النوم)، وتطاير الأفكار، والثرثرة الزائدة هي من أعراض:", options: ["نوبة الهوس (Manic Episode).", "النوبة الاكتئابية الجسيمة.", "اضطراب الهلع.", "الفصام."], correct: 0, explanation: "هذه من أعراض نوبة الهوس (Mania).", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "رفض الفرد الحفاظ على وزن الجسم عند الحد الأدنى الطبيعي لعمره وطوله، والخوف الشديد من زيادة الوزن يُشير إلى:", options: ["الشره المرضي العصبي (Bulimia Nervosa).", "فقدان الشهية العصبي (Anorexia Nervosa).", "السمنة المفرطة.", "اضطراب بيكا."], correct: 1, explanation: "فقدان الشهية العصبي (Anorexia) يتميز برفض الحفاظ على الوزن الطبيعي والخوف من زيادة الوزن.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "نوبات متكررة من الأكل بشراهة (Binge eating) يتبعها سلوك تعويضي غير ملائم لمنع زيادة الوزن (كالقيء المتعمد)، تُعرف بـ:", options: ["فقدان الشهية العصبي.", "الشره المرضي العصبي (Bulimia Nervosa).", "اضطراب بيكا (Pica).", "السمنة المفرطة."], correct: 1, explanation: "الشره المرضي (Bulimia) يتميز بالأكل بشراهة ثم سلوك تعويضي كالقيء.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "أكل مواد غير مغذية وغير صالحة للأكل (مثل التراب أو الطلاء) بشكل مستمر لمدة شهر على الأقل يُعرف باضطراب:", options: ["بيكا (Pica).", "الاجترار (Rumination).", "عسر البلع.", "فقدان الشهية."], correct: 0, explanation: "اضطراب بيكا (Pica) هو أكل مواد غير صالحة للأكل بشكل مستمر.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يعد اضطراب اللغة التعبيرية (Expressive Language Disorder) من اضطرابات:", options: ["التعلم.", "التواصل (Communication Disorders).", "المهارات الحركية.", "السلوك."], correct: 1, explanation: "اضطراب اللغة التعبيرية من اضطرابات التواصل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "تأخر أو فشل ملحوظ في استخدام الأصوات الكلامية المتوقعة نمائياً (كالتأتأة أو حذف الحروف) يُصنف تحت اضطرابات:", options: ["التواصل.", "الإخراج.", "الانتباه.", "التعلم."], correct: 0, explanation: "تأخر استخدام الأصوات الكلامية من اضطرابات التواصل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب المسلك (Conduct Disorder) الذي يتميز بانتهاك حقوق الآخرين وتجاوز القواعد الاجتماعية يُصنف ضمن مجموعة اضطرابات:", options: ["القلق العام.", "عجز الانتباه والسلوك الفوضوي (Disruptive Behavior).", "التعلم.", "التوحد."], correct: 1, explanation: "اضطراب المسلك من اضطرابات السلوك الفوضوي (Disruptive Behavior Disorders).", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "صعوبة الحفاظ على الانتباه، والاندفاعية، والنشاط الحركي الزائد الذي لا يتناسب مع عمر الطفل يُشير إلى:", options: ["اضطراب التوحد.", "اضطراب عجز الانتباه والنشاط الزائد (ADHD).", "التخلف العقلي العميق.", "اضطراب القلق."], correct: 1, explanation: "ADHD يتميز بصعوبة الانتباه، الاندفاعية، والنشاط الزائد.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الإخراج المتكرر للبول (لا إرادياً أو إرادياً) في الفراش أو الملابس، والذي يحدث مرتين أسبوعياً لمدة 3 أشهر، يُعرف بـ:", options: ["سلس البراز (Encopresis).", "التبول اللاإرادي (Enuresis).", "اضطراب العناد الشارد.", "اضطراب القلق."], correct: 1, explanation: "التبول اللاإرادي (Enuresis) هو الإخراج المتكرر للبول في الفراش.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يُشترط لتشخيص سلس البول (Enuresis) أن يكون العمر الزمني للطفل قد بلغ على الأقل:", options: ["سنتين.", "5 سنوات.", "12 سنة.", "3 سنوات."], correct: 1, explanation: "يُشترط أن يكون عمر الطفل 5 سنوات على الأقل لتشخيص التبول اللاإرادي.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "حركات حركية أو تصويتات مفاجئة وسريعة ومتكررة وغير إيقاعية، تسمى بـ:", options: ["اللوازم أو العرّات (Tics).", "الهلاوس.", "التشنجات الصرعية.", "النَّمط الحركي."], correct: 0, explanation: "اللوازم أو العرّات (Tics) هي حركات أو أصوات مفاجئة وسريعة ومتكررة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب توريت (Tourette\'s Disorder) هو من اضطرابات العرّات، ويُشترط لتشخيصه وجود:", options: ["لوازم حركية متعددة ولازمة صوتية واحدة أو أكثر تظهر معاً.", "لوازم صوتية فقط دون حركات.", "ضعف في العضلات وارتخاء.", "فقدان وعي."], correct: 0, explanation: "تشخيص توريت يتطلب وجود لوازم حركية متعددة مع لازمة صوتية واحدة على الأقل.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "قلق مفرط وغير مناسب نمائياً يتعلق بالابتعاد عن المنزل أو عن الأشخاص المتعلق بهم الطفل، يُعرف بـ:", options: ["الخواف الاجتماعي.", "اضطراب قلق الانفصال (Separation Anxiety).", "الفصام الطفولي.", "الاكتئاب."], correct: 1, explanation: "قلق الانفصال (Separation Anxiety) هو قلق مفرط من الابتعاد عن المنزل أو المرفقين.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
    {text: "الاضطراب الذي يظهر فيه الطفل سلوكاً سلبياً وعناداً وعداءاً تجاه شخصيات السلطة (بدون انتهاك خطير لحقوق الآخرين كاضطراب المسلك) هو:", options: ["اضطراب العناد المتحدي (Oppositional Defiant Disorder).", "الفصام غير المنتظم.", "اضطراب الشخصية التجنبية.", "التوحد."], correct: 0, explanation: "اضطراب العناد المتحدي (ODD) يتميز بالسلبية والعناد تجاه السلطة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "\"اضطراب عسر القراءة\" (Dyslexia) و \"اضطراب الحساب\" يُصنفان ضمن اضطرابات:", options: ["التواصل.", "التعلم الأكاديمي.", "التخلف العقلي.", "القلق."], correct: 1, explanation: "عسر القراءة واضطراب الحساب من اضطرابات التعلم الأكاديمي (Specific Learning Disorders).", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "أي من الفئات التالية تتميز باضطراب شديد في العلاقات الاجتماعية للطفل ناتج عن رعاية مرضية أو إهمال شديد؟", options: ["اضطراب التعلق التفاعلي (Reactive Attachment Disorder).", "التبول اللاإرادي.", "عسر الكتابة.", "التوحد."], correct: 0, explanation: "اضطراب التعلق التفاعلي ينتج عن رعاية مرضية أو إهمال شديد في الطفولة المبكرة.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "غياب الضلالات البارزة والهلاوس والكلام المشوش يُعد سمة مميزة للنمط ........ من الفصام:", options: ["البارانويدي.", "الكتاتوني.", "غير المميز أو المتبقي (Residual/Undifferentiated).", "الهيبفريني."], correct: 2, explanation: "النمط غير المميز (Undifferentiated) يتميز بغياب الضلالات البارزة والهلاوس.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "ينجم اضطراب الفصام الوجداني (Schizoaffective) بشكل أساسي عن:", options: ["تأثيرات فيزيولوجية مباشرة لتعاطي دواء أو مخدرات.", "التزامن بين أعراض الفصام وأعراض نوبة مزاجية (اكتئاب أو هوس) دون أن يكون السبب المباشر عقاراً أو حالة طبية.", "كبر حجم الجمجمة.", "نقص فيتامين B12."], correct: 1, explanation: "الفصام الوجداني ينجم عن التزامن بين أعراض الفصام وأعراض المزاج دون سبب عضوي مباشر.", category: "mcq", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "في اضطراب الألم (Pain Disorder)، يكون الألم في موضع تشريحي أو أكثر هو التظاهر السريري الغالب، وهو بشدة كافية لكي يستحق انتباهاً سريرياً.", options: ["صح", "خطأ"], correct: 0, explanation: "في اضطراب الألم يكون الألم في موضع تشريحي وهو بشدة كافية لاستحقاق الانتباه السريري.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "مصطلح \"الاضطرابات الجسدية الشكل\" (Somatoform Disorders) هو مرادف تماماً لاضطراب واحد فقط هو اضطراب الجسدنة (Somatization Disorder).", options: ["صح", "خطأ"], correct: 1, explanation: "الاضطرابات الجسدية الشكل تشمل عدة اضطرابات وليست الجسدنة فقط.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "يجب أن تكون مدة اضطراب المزاج الدوري (Cyclothymic Disorder) عند الأطفال والمراهقين سنة على الأقل ليتم تشخيصه.", options: ["صح", "خطأ"], correct: 0, explanation: "عند الأطفال والمراهقين يُشترط سنة واحدة على الأقل لتشخيص Cyclothymia.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "تعلل النوبة الاكتئابية الجسيمة بصورة أفضل من خلال اضطراب فصام وجداني.", options: ["صح", "خطأ"], correct: 0, explanation: "النوبة الاكتئابية تُفسر بصورة أفضل من خلال اضطراب فصام وجداني.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "ينجم اضطراب الفصام الوجداني عن تأثيرات فيزيولوجية مباشرة لدواء أو عقار.", options: ["صح", "خطأ"], correct: 1, explanation: "الفصام الوجداني ليس ناتجاً عن تأثيرات دواء أو عقار.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "المريض المصاب باضطرابات جسدية شكل (Somatoform) لا يتصنع المرض ولا يفتعل الأعراض بإرادته.", options: ["صح", "خطأ"], correct: 0, explanation: "مريض Somatoform لا يفتعل الأعراض عمداً وهذا ما يميزه عن التمثيل.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "مريض \"توهم المرض\" (Hypochondriasis) يقتنع بسهولة عند طمأنة الطبيب له بأن الفحوصات الطبية سليمة ولا يوجد لديه مرض خطير.", options: ["صح", "خطأ"], correct: 1, explanation: "مريض توهم المرض لا يقتنع بسهولة حتى مع الفحوصات السليمة.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "في اضطراب التحول (Conversion)، يعاني المريض من شلل أو فقدان بصر ليس له أساس تشريحي عصبي.", options: ["صح", "خطأ"], correct: 0, explanation: "اضطراب التحول يتميز بأعراض جسدية ليس لها أساس عصبي تشريحي.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الاضطراب ثنائي القطب (Bipolar) يشمل بالضرورة تبادلاً أو وجوداً لنوبات الهوس ونوبات الاكتئاب.", options: ["صح", "خطأ"], correct: 1, explanation: "Bipolar I قد يظهر بنوبة هوس فقط دون اكتئاب.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "فقدان الشهية العصبي يتميز بوزن منخفض جداً، بينما في الشره المرضي العصبي يكون وزن المريض غالباً طبيعياً أو فوق الطبيعي بقليل.", options: ["صح", "خطأ"], correct: 0, explanation: "Anorexia = وزن منخفض جداً، Bulimia = وزن طبيعي أو مرتفع.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "سلوك التقيؤ المتعمد أو استخدام الملينات بكثرة بعد نوبات الأكل الشره هو سلوك يُعرف بالسلوك التعويضي في الشره المرضي العصبي.", options: ["صح", "خطأ"], correct: 0, explanation: "القيء والملينات من السلوكيات التعويضية في الشره المرضي.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب عجز الانتباه والنشاط الزائد (ADHD) يصيب الأطفال فقط وتختفي جميع أعراضه بمجرد البلوغ.", options: ["صح", "خطأ"], correct: 1, explanation: "ADHD قد يستمر إلى البلوغ ولا تختفي جميع الأعراض.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "في اضطراب المسلك (Conduct Disorder)، يعتدي الطفل على حقوق الآخرين وقد يقوم بالسرقة أو تخريب الممتلكات أو القسوة على الحيوانات.", options: ["صح", "خطأ"], correct: 0, explanation: "اضطراب المسلك يتميز بانتهاك حقوق الآخرين والعدوان.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب اللغة التعبيرية هو صعوبة في فهم ما يقوله الآخرون واستيعابه، وليس في التعبير.", options: ["صح", "خطأ"], correct: 1, explanation: "اضطراب اللغة التعبيرية هو صعوبة في التعبير وليس الفهم.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "التبول اللاإرادي (Enuresis) لا يمكن تشخيصه طبياً كاضطراب قبل أن يبلغ الطفل سن الخامسة.", options: ["صح", "خطأ"], correct: 0, explanation: "يُشترط أن يكون الطفل قد بلغ 5 سنوات لتشخيص Enuresis.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "اضطراب اللوازم أو العرّات (Tics) تزداد شدته عادة تحت وطأة الضغوط النفسية ويختفي أثناء النوم.", options: ["صح", "خطأ"], correct: 0, explanation: "العرّات تزداد بالضغط النفسي وتختفي أثناء النوم.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "متلازمة توريت هي اضطراب مؤقت يزول تلقائياً بعد أسابيع قليلة ولا يحتوي على أي لوازم صوتية.", options: ["صح", "خطأ"], correct: 1, explanation: "توريت اضطراب مزمن ويحتوي على لوازم حركية وصوتية.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "قلق الانفصال يُعد اضطراباً إذا كان مستواه يفوق بكثير ما هو متوقع من الطفل في مرحلته العمرية ويسبب له إعاقة اجتماعية أو مدرسية.", options: ["صح", "خطأ"], correct: 0, explanation: "قلق الانفصال يُعد اضطراباً عندما يتجاوز المستوى المتوقع عمرياً.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "النوبة الاكتئابية الجسيمة قد تصاحبها أفكار متكررة عن الموت أو محاولات انتحار.", options: ["صح", "خطأ"], correct: 0, explanation: "النوبة الاكتئابية الجسيمة قد تصاحبها أفكار انتحار.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الأشخاص ذوو اضطراب تشوه صورة الجسد قد يلجأون إلى إجراء عمليات تجميلية متعددة دون الشعور بالرضا أبداً.", options: ["صح", "خطأ"], correct: 0, explanation: "مرضى BDD غالباً ما يلجأون لعمليات تجميل متعددة دون رضا.", category: "truefalse", chapter: "الفصل السابع: اضطرابات المزاج والجسدية والأكل"},
  {text: "الاضطراب الذي يتميز بتبادل أو تأرجح واضح بين نوبات من الهوس (Mania) ونوبات من الاكتئاب الجسيم يُعرف بـ:", options: ["الاضطراب ثنائي القطب من النوع الأول (Bipolar I).", "اضطراب عسر المزاج (Dysthymia).", "اضطراب القلق العام.", "الفصام الوجداني."], correct: 0, explanation: "Bipolar I يتميز بتبادل بين نوبات الهوس والاكتئاب الجسيم.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "يُشترط لتشخيص نوبة الهوس (Manic Episode) أن يستمر المزاج المرتفع أو الاستثاري والنشاط الزائد غير الطبيعي لمدة لا تقل عن:", options: ["يومين.", "أسبوع واحد (أو أي مدة إذا تطلب الأمر دخول المستشفى).", "شهر كامل.", "3 أيام."], correct: 1, explanation: "نوبة الهوس تستمر لمدة أسبوع على الأقل أو أي مدة إذا استدعى الأمر دخول المستشفى.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "أحد الأعراض الجوهرية لنوبة الهوس، حيث يشعر المريض بأنه يمتلك قدرات استثنائية أو علاقات بشخصيات هامة، يُسمى:", options: ["تطاير الأفكار.", "العظمة أو تضخم الذات (Grandiosity).", "الانعدامية.", "القلق."], correct: 1, explanation: "تضخم الذات (Grandiosity) هو شعور المريض بامتلاك قدرات استثنائية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "في نوبة الهوس، يعاني المريض غالباً من تناقص الحاجة إلى النوم، مما يعني أنه:", options: ["يعاني من أرق شديد ويرغب في النوم لكنه لا يستطيع.", "يشعر بالراحة والنشاط بعد النوم لساعات قليلة جداً (مثل 3 ساعات).", "ينام لساعات طويلة جداً (فرط النوم).", "لا ينام على الإطلاق."], correct: 1, explanation: "في الهوس يشعر المريض بالراحة والنشاط بعد نوم قليل جداً (3 ساعات أو أقل).", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الاضطراب ثنائي القطب من النوع الثاني (Bipolar II) يتميز بوجود نوبات اكتئاب جسيمة تتخللها نوبات من:", options: ["الهوس الكامل (Mania).", "الهوس الخفيف (Hypomania) الذي لا يسبب إعاقة وظيفية شديدة.", "الفصام البارانويدي.", "الذهان."], correct: 1, explanation: "Bipolar II يتميز بنوبات اكتئاب مع هوس خفيف (Hypomania) وليس هوساً كاملاً.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "لكي يتم تشخيص نوبة \"الهوس الخفيف\" (Hypomania)، يجب أن تستمر الأعراض لمدة لا تقل عن:", options: ["4 أيام متتالية.", "14 يوماً.", "6 أشهر.", "أسبوع."], correct: 0, explanation: "الهوس الخفيف يستمر لمدة 4 أيام متتالية على الأقل.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الفرق الجوهري بين نوبة الهوس (Mania) ونوبة الهوس الخفيف (Hypomania) هو أن الأخيرة:", options: ["تحتوي دائماً على ضلالات وهلاوس.", "تستدعي دخول المستشفى فوراً.", "لا تسبب ضعفاً ملحوظاً في الأداء الاجتماعي أو المهني ولا تتطلب الإيداع بالمستشفى.", "تستمر لأكثر من شهر."], correct: 2, explanation: "الهوس الخفيف لا يسبب إعاقة شديدة ولا يتطلب دخول المستشفى.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "اضطراب المزاج الدوري (Cyclothymic Disorder) هو اضطراب مزمن يتضمن تقلبات مزاجية لا ترقى لمعايير الهوس الكامل أو الاكتئاب الجسيم، ويستمر لدى البالغين لمدة لا تقل عن:", options: ["6 أشهر.", "سنتين.", "5 سنوات.", "شهر واحد."], correct: 1, explanation: "Cyclothymic Disorder يستمر لمدة سنتين على الأقل عند البالغين.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "ظاهرة \"الدوير السريع\" (Rapid Cycling) في الاضطراب ثنائي القطب تعني حدوث:", options: ["تقلب المزاج كل دقيقة.", "4 نوبات مزاجية أو أكثر خلال 12 شهراً.", "نوبة هوس واحدة فقط طوال العمر.", "تقلب يومي."], correct: 1, explanation: "الدوير السريع يعني حدوث 4 نوبات أو أكثر في 12 شهراً.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "أشارت الدراسات الحديثة (مثل دراسة Chen et al., 2021) إلى وجود ارتباط ومعدلات انتشار ملحوظة للاضطراب ثنائي القطب لدى المرضى المصابين بـ:", options: ["أمراض المناعة الذاتية (Autoimmune diseases).", "الكسور العظمية المتكررة.", "العمى الوراثي.", "الصمم."], correct: 0, explanation: "دراسة Chen et al. (2021) أشارت إلى ارتباط Bipolar بأمراض المناعة الذاتية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "أظهرت دراسة (Bjertrup et al., 2022) أن الأمهات المصابات بالاضطراب ثنائي القطب يُظهرن استجابة ........ في قشرة الدماغ الجبهية (Prefrontal cortex) عند رؤية وجوه أطفال رضع غير معروفين:", options: ["مفرطة ونشطة جداً.", "منخفضة أو مخفضة (Reduced).", "طبيعية تماماً كباقي الأمهات.", "متغيرة باستمرار."], correct: 1, explanation: "دراسة Bjertrup et al. (2022) أظهرت استجابة مخفضة في قشرة الدماغ الجبهية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "وفقاً لـ (Miskowiak et al., 2022)، توجد ارتباطات بين ........ والنوبات المزاجية اللاحقة لدى مرضى الاضطراب ثنائي القطب وأقاربهم غير المصابين:", options: ["لون العينين.", "الإدراك والمعرفة (Cognition).", "الطول والوزن.", "العمر."], correct: 1, explanation: "دراسة Miskowiak et al. (2022) أظهرت ارتباطات بين الإدراك والمعرفة والنوبات المزاجية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "لتقييم ومراقبة المزاج والنشاط والنوم لدى مرضى الاضطراب ثنائي القطب وأقاربهم، استخدمت دراسة (Melbye et al., 2021) تقنية التقييم الذاتي القائمة على:", options: ["الهواتف الذكية (Smartphone-based).", "أجهزة كشف الكذب.", "التنويم المغناطيسي.", "الموجات الدماغية."], correct: 0, explanation: "دراسة Melbye et al. (2021) استخدمت التقييم عبر الهواتف الذكية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "المثبتات المزاجية (Mood Stabilizers) هي العلاج الدوائي الأساسي للاضطراب ثنائي القطب، ومن أشهر أمثلتها التقليدية:", options: ["الباراسيتامول.", "الليثيوم (Lithium).", "المضادات الحيوية.", "المنبهات."], correct: 1, explanation: "الليثيوم هو المثبت المزاجي الأكثر شهرة لعلاج Bipolar.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "إذا عانى المريض من نوبة هوس ونوبة اكتئاب في نفس الوقت (أو بتعاقب سريع جداً يومياً)، تُسمى هذه الحالة:", options: ["نوبة مختلطة (Mixed Episode).", "فصام وجداني.", "عسر مزاج.", "اضطراب القلق."], correct: 0, explanation: "النوبة المختلطة (Mixed Episode) تجمع بين أعراض الهوس والاكتئاب معاً.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "فقدان القدرة على الشعور بالمتعة (Anhedonia) هو من الأعراض الأساسية في:", options: ["نوبة الهوس.", "النوبة الاكتئابية الجسيمة.", "اضطراب الهلع.", "الفصام."], correct: 1, explanation: "Anhedonia (فقدان الشعور بالمتعة) من أعراض الاكتئاب الجسيم.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "حالة \"التخلف أو التباطؤ النفسي الحركي\" (Psychomotor Retardation) تظهر بوضوح على شكل بطء في الكلام والحركة والتفكير لدى مرضى:", options: ["الهوس.", "القلق العام.", "الاكتئاب الجسيم.", "التوحد."], correct: 2, explanation: "التباطؤ النفسي الحركي من أعراض الاكتئاب الجسيم.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الأفكار المتكررة عن الموت (ليس فقط الخوف من الموت) أو محاولات الانتحار هي معيار تشخيصي مهم لـ:", options: ["النوبة الاكتئابية الجسيمة.", "اضطراب توهم المرض.", "اضطراب الشخصية التجنبية.", "الفصام."], correct: 0, explanation: "الأفكار المتكررة عن الموت من معايير تشخيص الاكتئاب الجسيم.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "لكي يُشخص المريض بالاضطراب الاكتئابي الجسيم (MDD)، يجب ألا يكون قد أصيب أبداً بـ:", options: ["نوبة قلق.", "نوبة هوس أو هوس خفيف.", "صداع نصفي.", "أرق."], correct: 1, explanation: "تشخيص MDD يتطلب عدم وجود نوبة هوس أو هوس خفيف سابقاً (إذا وجدت يُشخص Bipolar).", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "\"الثالوث المعرفي\" (Cognitive Triad) لآرون بيك في تفسير الاكتئاب يتضمن النظرة السلبية المتمثلة في:", options: ["الذات، والعالم، والمستقبل.", "الماضي، والحاضر، والمستقبل.", "الأسرة، والأصدقاء، والعمل.", "الجسد، والعقل، والروح."], correct: 0, explanation: "الثالوث المعرفي لبيك: نظرة سلبية للذات، العالم، والمستقبل.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "التفسير القائل بأن الاكتئاب ينتج عن شعور الفرد بأنه لا يملك أي سيطرة على الأحداث السلبية في حياته (العجز المتعلم) هو من إسهامات العالم:", options: ["سيجموند فرويد.", "مارتن سليجمان (Seligman).", "إميل كريبلين.", "آرون بيك."], correct: 1, explanation: "مارتن سليجمان قدم نظرية العجز المتعلم (Learned Helplessness).", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "يُعتقد أن هناك نقصاً في نواقل عصبية معينة يلعب دوراً في الاكتئاب، وأهمها:", options: ["السيروتونين والنورإبينفرين.", "الأنسولين والجلوكاجون.", "الميلاتونين فقط.", "الأدرينالين فقط."], correct: 0, explanation: "النظرية البيوكيميائية ترى أن نقص السيروتونين والنورإبينفرين يلعب دوراً في الاكتئاب.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الأفراد الذين يعانون من الاضطراب ثنائي القطب لديهم خطر ........ للإقدام على الانتحار مقارنة بعامة الناس:", options: ["منخفض جداً.", "مماثل.", "مرتفع جداً (أعلى بحوالي 15 مرة).", "غير موجود."], correct: 2, explanation: "مرضى Bipolar لديهم خطر مرتفع للانتحار (أعلى بحوالي 15 مرة من عامة الناس).", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الدراسات التي تُجرى على \"الأقارب غير المصابين\" (Unaffected relatives) لمرضى الاضطراب ثنائي القطب تهدف إلى فهم العوامل:", options: ["الثقافية فقط.", "الوراثية الجينية والاستعداد المعرفي.", "الاقتصادية.", "البيئية فقط."], correct: 1, explanation: "دراسة الأقارب غير المصابين تساعد في فهم العوامل الوراثية والاستعداد المعرفي.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "عندما تصاحب النوبة الاكتئابية أعراض مثل الهلاوس وضلالات الإثم والذنب، يُسمى ذلك:", options: ["اكتئاب مصحوب بسمات ذهانية.", "فصام بارانويدي.", "اضطراب جسدنة.", "هوس."], correct: 0, explanation: "الاكتئاب مع هلاوس وضلالات = اكتئاب مصحوب بسمات ذهانية.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
    {text: "الاضطراب العاطفي الفصلي (SAD) هو نوع من الاكتئاب يرتبط بـ:", options: ["تناول أطعمة معينة في الصيف.", "التغيرات في فصول السنة ونقص التعرض لضوء الشمس.", "الفشل في الاختبارات المدرسية.", "الحمل والولادة."], correct: 1, explanation: "الاضطراب العاطفي الفصلي (SAD) يرتبط بتغير الفصول ونقص ضوء الشمس.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "من خصائص حديث مريض الهوس (Manic patient) أنه حديث:", options: ["بطيء ومتردد.", "مضغوط، سريع، ويصعب مقاطعته.", "مقتضب ويقتصر على الإجابة بنعم أو لا.", "صامت."], correct: 1, explanation: "حديث مريض الهوس يكون مضغوطاً وسريعاً ويصعب مقاطعته.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الميل المفرط للانخراط في أنشطة ممتعة ذات عواقب مؤلمة محتملة (مثل الشراء غير المقيد أو الطيش الجنسي) يُعد من أعراض:", options: ["نوبة الهوس.", "الاكتئاب الجسيم.", "اضطراب الوسواس القهري.", "القلق العام."], correct: 0, explanation: "هذا من أعراض نوبة الهوس (الانغماس في أنشطة ممتعة ذات مخاطر).", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الاضطراب الذي يجمع بين أعراض الفصام (ضلالات وهلاوس مستمرة) وأعراض اضطراب المزاج (نوبة اكتئاب أو هوس) يُسمى:", options: ["اضطراب الفصام الوجداني (Schizoaffective Disorder).", "الفصام المبكر.", "الشخصية الحدية.", "Bipolar I."], correct: 0, explanation: "الفصام الوجداني يجمع بين أعراض الفصام والمزاج.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "التدخل العلاجي الذي يُستخدم للحالات الشديدة والمقاومة للأدوية من الاكتئاب أو الهوس (خاصة عند وجود خطر انتحار وشيك) هو:", options: ["الإرشاد المهني.", "العلاج بالصدمات الكهربائية (ECT).", "العلاج باللعب.", "العلاج بالفن."], correct: 1, explanation: "ECT يُستخدم للحالات الشديدة المقاومة للأدوية خاصة مع خطر انتحار وشيك.", category: "mcq", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "تشخيص الاضطراب ثنائي القطب من النوع الأول (Bipolar I) يشترط بالضرورة وجود نوبة اكتئاب جسيمة سابقة.", options: ["صح", "خطأ"], correct: 1, explanation: "Bipolar I يشترط نوبة هوس واحدة على الأقل وليس بالضرورة نوبة اكتئاب.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "نوبة الهوس الخفيف (Hypomania) لا تسبب إعاقة شديدة في الأداء الاجتماعي ولا تتطلب الإيداع في المستشفى.", options: ["صح", "خطأ"], correct: 0, explanation: "الهوس الخفيف لا يسبب إعاقة شديدة ولا يتطلب دخول المستشفى.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "المريض في حالة الهوس يتميز بزيادة ملحوظة في الحاجة إلى النوم قد تصل إلى 14 ساعة يومياً.", options: ["صح", "خطأ"], correct: 1, explanation: "في الهوس يتناقص النوم وليس يزيد.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "اضطراب المزاج الدوري (Cyclothymia) يمثل شكلاً مزمناً ومخففاً من الاضطراب ثنائي القطب.", options: ["صح", "خطأ"], correct: 0, explanation: "Cyclothymia هو شكل مزمن ومخفف من Bipolar.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الاكتئاب الجسيم (MDD) أكثر شيوعاً وانتشاراً بين النساء مقارنة بالرجال.", options: ["صح", "خطأ"], correct: 0, explanation: "MDD أكثر شيوعاً بين النساء بنسبة ضعف تقريباً.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الاضطراب ثنائي القطب يصيب النساء بضعف معدل إصابته للرجال تقريباً.", options: ["صح", "خطأ"], correct: 1, explanation: "Bipolar يصيب الرجال والنساء بنفس المعدل تقريباً.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "تطاير الأفكار (Flight of ideas) والانتقال السريع من موضوع لآخر من السمات المميزة لنوبة الهوس.", options: ["صح", "خطأ"], correct: 0, explanation: "تطاير الأفكار من سمات نوبة الهوس.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الدوير السريع (Rapid Cycling) هو حالة نادرة تحدث إذا تعرض المريض لتقلب المزاج أكثر من 4 مرات في اليوم الواحد.", options: ["صح", "خطأ"], correct: 1, explanation: "الدوير السريع يعني 4 نوبات أو أكثر في 12 شهراً وليس في يوم واحد.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "أثبتت الدراسات الحديثة وجود ارتباط بين الاضطراب ثنائي القطب وبعض أمراض المناعة الذاتية.", options: ["صح", "خطأ"], correct: 0, explanation: "دراسة Chen et al. (2021) أثبتت هذا الارتباط.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "لا يمكن مراقبة تقلبات المزاج أو تشخيصها مبدئياً بمساعدة تطبيقات الهواتف الذكية المخصصة لذلك.", options: ["صح", "خطأ"], correct: 1, explanation: "دراسة Melbye et al. (2021) استخدمت التطبيقات الذكية لمراقبة المزاج.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الأقارب من الدرجة الأولى لمرضى الاضطراب ثنائي القطب لديهم استعداد وراثي أعلى للإصابة بالمرض مقارنة بغيرهم.", options: ["صح", "خطأ"], correct: 0, explanation: "الأقارب من الدرجة الأولى لديهم استعداد وراثي أعلى.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "العلاج المعرفي السلوكي (CBT) يهدف إلى تغيير الأفكار السلبية والتشوهات المعرفية لدى مرضى الاكتئاب.", options: ["صح", "خطأ"], correct: 0, explanation: "CBT يستهدف تغيير الأفكار السلبية والتشوهات المعرفية.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الليثيوم (Lithium) يُعد من أشهر مضادات القلق ولا علاقة له بعلاج الاضطراب ثنائي القطب.", options: ["صح", "خطأ"], correct: 1, explanation: "الليثيوم هو مثبت مزاجي أساسي لعلاج Bipolar وليس مضاد قلق.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "العجز المتعلم (Learned helplessness) هو نظرية بيولوجية تفسر الاكتئاب بناءً على نقص الهرمونات.", options: ["صح", "خطأ"], correct: 1, explanation: "العجز المتعلم نظرية سلوكية-معرفية وليست بيولوجية.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "في حالة الاكتئاب المصحوب بسمات ذهانية، قد يعتقد المريض وهماً أنه ارتكب ذنباً لا يُغتفر أو أن أعضاءه تتعفن.", options: ["صح", "خطأ"], correct: 0, explanation: "الاكتئاب الذهاني قد يصاحبه ضلالات إثم وذنب.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "اضطراب عسر المزاج (Dysthymia) هو اكتئاب خفيف إلى متوسط الشدة ولكنه مزمن يستمر لسنتين على الأقل.", options: ["صح", "خطأ"], correct: 0, explanation: "Dysthymia هو اكتئاب مزمن أقل شدة يستمر لسنتين.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "فقدان الوزن الملحوظ دون عمل حمية غذائية أو زيادة الوزن الملحوظة قد تكون من أعراض الاكتئاب الجسيم.", options: ["صح", "خطأ"], correct: 0, explanation: "تغير الوزن من أعراض الاكتئاب الجسيم.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "أظهرت دراسة على الأمهات المصابات بالاضطراب ثنائي القطب وجود استجابة متغيرة (مخفضة) في قشرة الدماغ الجبهية عند تفاعلهن العاطفي.", options: ["صح", "خطأ"], correct: 0, explanation: "دراسة Bjertrup et al. (2022) أظهرت استجابة مخفضة.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "المريض بنوبة هوس يسعى دائماً للعلاج من تلقاء نفسه لأنه يدرك تماماً أنه في حالة غير طبيعية ومزعجة له.", options: ["صح", "خطأ"], correct: 1, explanation: "مريض الهوس عادة لا يدرك أنه في حالة غير طبيعية ولا يسعى للعلاج.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "الفصام الوجداني يختلف عن الاضطراب ثنائي القطب ذو السمات الذهانية في أن الهلاوس والضلالات تستمر حتى في غياب النوبة المزاجية.", options: ["صح", "خطأ"], correct: 0, explanation: "في الفصام الوجداني تستمر أعراض الفصام حتى في غياب النوبة المزاجية.", category: "truefalse", chapter: "الفصل التاسع: الاضطراب ثنائي القطب"},
  {text: "يُعرّف المرض بمعناه العام بأنه:", options: ["انحراف سلوكي عن المعيار الإحصائي", "تعطل العضو عن أداء وظيفته تعطلاً جزئياً أو كلياً", "صراع نفسي لا شعوري", "اضطراب وظيفي في الشخصية"], correct: 1, explanation: "المرض بمعناه العام هو تعطل العضو عن أداء وظيفته تعطلاً جزئياً أو كلياً.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "تعطل الإنسان عن أداء دوره في الحياة كلياً (كمريض الفصام) يُصنف كـ:", options: ["مرض عصبي", "مرض ذُهاني", "مرض عصابي", "مرض وظيفي"], correct: 1, explanation: "التعطل الكلي يُصنف كمرض ذهاني (Psychosis) مثل الفصام.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "يتميز \"العصاب\" بأنه اضطراب وظيفي يؤدي إلى:", options: ["انفصال تام عن الواقع", "تعطل جزئي عن أداء الدور مع بقاء الصلة بالواقع", "تلف في خلايا المخ", "فقدان الذاكرة"], correct: 1, explanation: "العصاب يؤدي لتعطل جزئي مع بقاء الصلة بالواقع.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الشلل النصفي وحالات الصرع الناتجة عن تلف عضوي تُعد من:", options: ["الأمراض العصبية", "الأمراض النفسية", "الأمراض العقلية الوظيفية", "الأمراض الذهانية"], correct: 0, explanation: "الشلل النصفي والصرع من الأمراض العصبية العضوية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "ذهاب مريض الشلل النصفي لمعالج نفسي بدلاً من طبيب الأعصاب يُعد:", options: ["إجراءً طبياً صحيحاً", "عبثاً لا طائل منه", "الخطوة الأولى للشفاء", "علاجاً تكميلياً"], correct: 1, explanation: "ذهاب مريض عضوي لمعالج نفسي يُعد عبثاً لا طائل منه.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الأسباب التي تمهد لحدوث المرض وتجعل الفرد عرضة له تُسمى:", options: ["الأسباب الأصلية (المهيأة)", "الأسباب المرسبة", "الأسباب البيئية", "الأسباب الفسيولوجية"], correct: 0, explanation: "الأسباب المهيأة تمهد لحدوث المرض وتجعل الفرد عرضة له.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الأحداث الضاغطة الأخيرة التي تسبق المرض مباشرة وتعجل بظهوره هي:", options: ["الأسباب المهيأة", "الأسباب المساعدة (المرسبة)", "الأسباب الفسيولوجية", "الأسباب الوراثية"], correct: 1, explanation: "الأسباب المساعدة (المرسبة) هي الأحداث الأخيرة التي تعجل بظهور المرض.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اضطراب الغدد والهرمونات يُصنف ضمن الأسباب:", options: ["البيئية", "الفسيولوجية", "النفسية", "الاجتماعية"], correct: 1, explanation: "اضطراب الغدد والهرمونات من الأسباب الفسيولوجية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "دلت البرديات على إجراء الفراعنة لثقوب في الجماجم بهدف:", options: ["طرد الأرواح الشريرة المسببة للجنون", "استئصال الأورام السرطانية", "علاج الجلطات الدماغية", "تخفيف الضغط الدماغي"], correct: 0, explanation: "الفراعنة أجروا ثقوباً في الجماجم لطرد الأرواح الشريرة.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "أول من شيد المستشفيات الخاصة بالأمراض العقلية في التاريخ هم:", options: ["الإغريق", "الفراعنة", "العلماء المسلمون الأوائل", "الرومان"], correct: 2, explanation: "العلماء المسلمون الأوائل كانوا أول من شيد المستشفيات للأمراض العقلية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "عجز الفرد عن حل مشكلاته اليومية إخفاقاً يزيد عما يُنتظر منه يُعرف بـ:", options: ["الفصام", "سوء التوافق", "الهوس", "الاكتئاب"], correct: 1, explanation: "سوء التوافق هو عجز الفرد عن حل مشكلاته اليومية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "من مظاهر سوء التوافق البسيطة لدى الأطفال:", options: ["قضم الأظافر والتبول القسري", "الهلاوس السمعية", "فقدان الذاكرة الكلي", "الشلل النصفي"], correct: 0, explanation: "قضم الأظافر والتبول القسري من مظاهر سوء التوافق البسيطة.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "يلجأ الإنسان للحيل الدفاعية غير السوية عندما:", options: ["يصل لأعلى درجات النضج", "يعجز عن حفظ توازنه النفسي بالطرق السوية", "يغيب عنه الدعم المادي", "يكون متوافقاً"], correct: 1, explanation: "الحيل الدفاعية غير السوية تظهر عند فشل الطرق السوية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "المعيار الذي يعتبر السلوك السوي هو السلوك \"الكامل\" الخالي من العيوب هو:", options: ["المعيار الإحصائي", "المعيار المثالي", "المعيار السيكولوجي", "المعيار الثقافي"], correct: 1, explanation: "المعيار المثالي يرى السلوك السوي كالسلوك الكامل الخالي من العيوب.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "وفقاً للمعيار الإحصائي، السلوك الشاذ هو السلوك الذي:", options: ["يخالف الدين", "ينحرف بشدة عن \"المتوسط\" العام للأغلبية", "يعاني صاحبه من صراع داخلي", "غير مقبول اجتماعياً"], correct: 1, explanation: "المعيار الإحصائي يعتبر الشاذ من ينحرف عن المتوسط.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اعتبار الانتحار مرضاً في الغرب وسلوكاً مقبولاً في بعض ثقافات اليابان يمثل المعيار:", options: ["السيكولوجي", "المثالي", "الثقافي الاجتماعي", "الإحصائي"], correct: 2, explanation: "المعيار الثقافي الاجتماعي يختلف في تحديد السواء والشذوذ.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "من مميزات المعيار السيكولوجي لتحديد السوية أنه:", options: ["يعتمد على رأي الأغلبية", "يمكن تطبيقه في أي مجتمع بغض النظر عن ثقافته", "يتطلب خلو الإنسان من أي نقص", "يختلف من ثقافة لأخرى"], correct: 1, explanation: "المعيار السيكولوجي قابل للتطبيق عالمياً.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "المشكلة الأساسية لمريض العصاب (كالقلق) هي مشكلة:", options: ["وجود", "توافق", "هلاوس", "فقدان ذاكرة"], correct: 1, explanation: "مشكلة العصابي هي مشكلة توافق.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "المشكلة الأساسية لمريض الفصام هي مشكلة:", options: ["وجود (انفصال عن الواقع)", "توافق اجتماعي بسيط", "تكيف دراسي", "تكيف مهني"], correct: 0, explanation: "مشكلة الذهاني (الفصام) هي مشكلة وجود (انفصال عن الواقع).", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "بين المريض ........ والحياة \"جدار فولاذي\" فلا يرى منها شيئاً:", options: ["العصابي", "الذهاني", "السوي", "المتوافق"], correct: 1, explanation: "بين الذهاني والحياة \"جدار فولاذي\".", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الأمراض العقلية التي يسببها تلف تشريحي مباشر في الدماغ (كالأورام) تسمى:", options: ["ذهاناً وظيفياً", "ذهاناً عضوياً", "عصاباً", "فصاماً"], correct: 1, explanation: "الذهان العضوي ينتج عن تلف تشريحي في الدماغ.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الفصام والاكتئاب الذهاني يصنفان على أنهما أمراض عقلية:", options: ["عضوية", "وظيفية", "عصبية", "انفصالية"], correct: 1, explanation: "الفصام والاكتئاب الذهاني من الأمراض العقلية الوظيفية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "مجال التخصص الأساسي للأخصائي النفسي (Psychologist) هو:", options: ["الأمراض النفسية والعقلية الوظيفية", "الأمراض العضوية", "جراحة المخ", "الأمراض العصبية"], correct: 0, explanation: "الأخصائي النفسي يختص بالأمراض الوظيفية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "من أمثلة الذهان (التعطل الكلي):", options: ["الوسواس القهري", "القلق العام", "البارانويا", "الاكتئاب العصابي"], correct: 2, explanation: "البارانويا من أمثلة الذهان (التعطل الكلي).", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "مجموعة الأعراض (Symptoms) التي تشكل معاً تشخيصاً لمرض معين تسمى:", options: ["مرضاً فسيولوجياً", "زملة أعراض (Syndrome)", "اضطراباً تكيفياً", "حالة نفسية"], correct: 1, explanation: "زملة الأعراض (Syndrome) هي مجموعة الأعراض التي تشكل تشخيصاً.", category: "mcq", chapter: "الامتحان الشامل"},
    {text: "ألغى الدليل التشخيصي الرابع (DSM-IV) التقسيم الصارم بين فئتي:", options: ["الطفولة والشيخوخة", "العصاب والذهان", "التخلف العقلي والتوحد", "العضوي والوظيفي"], correct: 1, explanation: "DSM-IV ألغى التقسيم الصارم بين العصاب والذهان.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اضطرابات الهذيان والخرف تُصنف تحت فئة:", options: ["الاضطرابات المعرفية", "اضطرابات المزاج", "الاضطرابات الانفصالية", "اضطرابات الشخصية"], correct: 0, explanation: "الهذيان والخرف من الاضطرابات المعرفية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الفصام الوجداني والاضطراب الضلالي يندرجان تحت:", options: ["اضطرابات الشخصية", "اضطرابات الفصام والذهان", "الاضطرابات جسمية الشكل", "اضطرابات المزاج"], correct: 1, explanation: "الفصام الوجداني والضلالي من اضطرابات الفصام والذهان.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اضطراب التحول (Conversion) وتوهم المرض يُصنفان كـ:", options: ["اضطرابات مزاج", "اضطرابات جسمية الشكل (Somatoform)", "اضطرابات انشقاقية", "اضطرابات قلق"], correct: 1, explanation: "التحول وتوهم المرض من الاضطرابات جسمية الشكل.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "فقدان الشهية العصبي والشره المرضي من:", options: ["اضطرابات الأكل", "اضطرابات الطفولة", "اضطرابات التكيف", "اضطرابات المزاج"], correct: 0, explanation: "فقدان الشهية والشره المرضي من اضطرابات الأكل.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "متلازمة عصبية تتصف بحدوث مفاجئ وتؤثر على الوعي والانتباه هي:", options: ["الفصام", "الهذيان (Delirium)", "القلق العام", "الاكتئاب"], correct: 1, explanation: "الهذيان يحدث فجأة ويؤثر على الوعي والانتباه.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "يُعد ........ العامل المؤهب الأقوى لحدوث الهذيان لدى كبار السن:", options: ["القلق", "الاكتئاب", "الضعف الإدراكي السابق أو الخرف", "الأرق"], correct: 2, explanation: "الخرف هو العامل المؤهب الأقوى للهذيان.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "يُستبعد تشخيص \"الهذيان\" إذا كان المريض في حالة:", options: ["يقظة تامة", "غيبوبة أو فقدان تام للوعي", "توتر عصبي", "حزن شديد"], correct: 1, explanation: "يُستبعد الهذيان في حالات فقدان الوعي التام.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "من الأنماط الحركية للهذيان:", options: ["النمط المتسارع فقط", "مفرط النشاط، ناقص النشاط، والمختلط", "النمط الشللي", "النمط الطبيعي"], correct: 1, explanation: "أنماط الهذيان الحركية: مفرط، ناقص، ومختلط.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "السمات الذهانية (كالهلاوس) والقدرة العاطفية في الهذيان تُعتبر أعراضاً:", options: ["أساسية وجوهرية دائماً", "ثانوية (تحدث بشكل أقل وتتغير)", "مستحيلة الحدوث", "ثابتة في كل الحالات"], correct: 1, explanation: "السمات الذهانية والعاطفية في الهذيان ثانوية وليست أساسية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "متوسط حدوث الهذيان بعد العمليات الجراحية (كالكسور) يبلغ حوالي:", options: ["10%", "40%", "90%", "5%"], correct: 1, explanation: "متوسط حدوث الهذيان بعد العمليات الجراحية حوالي 40%.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اضطراب تقلص المهبل (بدون سبب عضوي) يُصنف ضمن:", options: ["اضطرابات المزاج", "الاضطرابات الجنسية والهوية الجنسية", "اضطرابات الإدعاء", "اضطرابات القلق"], correct: 1, explanation: "تقلص المهبل من الاضطرابات الجنسية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الإساءة الجسدية للأطفال تُصنف في الدليل التشخيصي كـ:", options: ["مشاكل مرتبطة بسوء المعاملة", "اضطراب التكيف", "ذهان عضوي", "اضطراب شخصية"], correct: 0, explanation: "الإساءة للأطفال تُصنف كمشاكل مرتبطة بسوء المعاملة.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "وجود عرض واحد أو اثنين لدى المريض:", options: ["يكفي لتشخيص الفصام", "لا يبرر وضعه تحت تشخيص اضطراب عقلي محدد", "يؤكد إصابته بالخرف", "يكفي لتشخيص الاكتئاب"], correct: 1, explanation: "عرض واحد أو اثنين لا يبرر تشخيص اضطراب عقلي محدد.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الشرود الانفصالي واضطراب تعدد الشخصيات من الاضطرابات:", options: ["المعرفية", "الانشقاقية (Dissociative)", "الجسدية", "النمائية"], correct: 1, explanation: "الشرود الانفصالي وتعدد الشخصيات من الاضطرابات الانفصالية.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "اضطرابات اللوازم (Tics) تظهر وتُشخص غالباً في مرحلة:", options: ["الشيخوخة", "الطفولة أو المراهقة", "الرشد المتأخر", "الرضاعة"], correct: 1, explanation: "اللوازم تظهر عادة في الطفولة أو المراهقة.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "يُعرف التدهور المعرفي البطيء والمستمر في الذاكرة لدى كبار السن بـ:", options: ["الهذيان", "الخرف (Dementia)", "الاكتئاب الفصلي", "الفصام"], correct: 1, explanation: "الخرف (Dementia) هو تدهور معرفي بطيء ومستمر.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الخواف الاجتماعي واضطراب ما بعد الصدمة يتبعان فئة:", options: ["اضطرابات القلق", "اضطرابات المزاج", "الاضطرابات الذهانية", "اضطرابات الشخصية"], correct: 0, explanation: "الخواف الاجتماعي وPTSD من اضطرابات القلق.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الكوكايين والأمفيتامين تسبب اضطرابات تصنف تحت:", options: ["الاضطرابات المرتبطة بالمواد", "اضطرابات النوم", "الاضطرابات المصطنعة", "اضطرابات المزاج"], correct: 0, explanation: "الكوكايين والأمفيتامين من الاضطرابات المرتبطة بالمواد.", category: "mcq", chapter: "الامتحان الشامل"},
  {text: "الفصام يتميز بوجود اضطراب حاد في:", options: ["الشهية فقط", "التفكير والإدراك واختبار الواقع", "التنفس", "الدورة الدموية"], correct: 1, explanation: "الفصام يتميز باضطراب في التفكير والإدراك واختبار الواقع.", category: "mcq", chapter: "الامتحان الشامل"},

  {text: "من المجالات الثلاثة المعرفية المتضررة في الهذيان:", options: ["قوة العضلات", "التوجه والانتباه", "البصر الخارجي", "السمع"], correct: 1, explanation: "التوجه والانتباه من المجالات المعرفية المتضررة في الهذيان.", category: "mcq", chapter: "الامتحان الشامل"}
