                    : wrongMemes[Math.floor(Math.random() * wrongMemes.length)];

                setModalObj({
                    isCorrect,
                    meme,
                    correctText: q[1][q[2]],
                    rationale: q[3]
                });

                                        key={idx} 
                                        onClick={() => handleAnswer(idx)}
                                        className="p-4 md:p-6 text-lg md:text-xl font-semibold bg-slate-700 hover:bg-indigo-600 border border-slate-600 hover:border-indigo-400 rounded-2xl transition-all text-right group"
                                    >
                                        <span className="inline-block w-8 h-8 text-center bg-slate-900 group-hover:bg-indigo-800 rounded-full ml-3 text-indigo-300 leading-8">
                                            {idx + 1}
                                        </span>
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Gamification Modal */}
                        {modalObj && (
                            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 p-8 md:p-12 rounded-[2rem] border-2 shadow-[0_0_50px_rgba(0,0,0,0.5)] max-w-2xl w-full text-center bounce-in" style={{ borderColor: modalObj.isCorrect ? '#4ade80' : '#f87171' }}>
                                    <div className="text-8xl mb-6">{modalObj.meme.emoji}</div>
                                    <h3 className={`text-3xl font-black mb-6 ${modalObj.isCorrect ? 'text-green-400' : 'text-red-400'}`}>
                                        {modalObj.meme.text}
                                    </h3>
                                    
                                    {!modalObj.isCorrect && (
                                        <div className="mb-6 p-4 bg-red-900/30 rounded-xl border border-red-500/30">
                                            <p className="text-gray-300 mb-2">الإجابة الصحيحة هي:</p>
                                            <p className="text-xl font-bold text-white">{modalObj.correctText}</p>
                                        </div>
                                    )}

                                    <div className="bg-indigo-900/30 p-6 rounded-2xl border border-indigo-500/30 text-right mb-8">
                                        <span className="bg-indigo-600 text-white px-3 py-1 rounded-md font-bold text-sm mb-3 inline-block">التعليل من الكتاب 💡</span>
                                        <p className="text-lg text-indigo-100 leading-relaxed">{modalObj.rationale}</p>
                                    </div>

                                    <button onClick={nextQuestion} className="w-full py-4 bg-slate-100 text-slate-900 hover:bg-white rounded-xl font-black text-2xl transition-all">
                                        {currentIndex + 1 < questions.length ? 'السؤال التالي ⏭️' : 'النتيجة النهائية 🏆'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (view === 'result') {
                const percent = Math.round((score / questions.length) * 100);
                let message = "أداء أسطوري!";
                if (percent < 50) message = "محتاج تذاكر من الكتاب تاني يا بطل!";
                else if (percent < 80) message = "عاش، بس تقدر تجيب أحسن!";

                return (
                    <div className="container mx-auto px-4 py-16 slide-up flex justify-center items-center text-center">
                        <div className="max-w-2xl w-full p-10 bg-slate-800/90 backdrop-blur-xl rounded-3xl border border-indigo-500/50 shadow-2xl">
                            {percent >= 50 ? <CheckIcon /> : <XIcon />}
                            <h2 className="text-5xl font-black text-white mb-4">{percent}%</h2>
                            <h3 className="text-3xl font-bold text-indigo-400 mb-8">{message}</h3>
                            <p className="text-xl text-gray-300 mb-10">جاوبت صح على {score} من أصل {questions.length} سؤال في الفصل {activeChapter}.</p>
                            
                            <div className="flex flex-col sm:flex-row gap-4">
                                <button onClick={beginQuiz} className="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-xl transition-all">
                                    إعادة الفصل 🔄
                                </button>
                                <button onClick={() => setView('chapters')} className="flex-1 py-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-xl transition-all">
                                    العودة للفصول 📚
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Footer -->
    <div class="fixed bottom-0 w-full bg-slate-950 border-t border-indigo-900/50 p-4 z-40 overflow-hidden shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
        <div class="absolute inset-0 stars-bg opacity-40"></div>
        <p class="relative text-center text-indigo-300 font-black text-xl drop-shadow-[0_0_10px_rgba(129,140,248,0.8)] tracking-wide">
            🌟 إعداد: مجدي عبد البصير 🌟
        </p>
    </div>
</body>
</html>
